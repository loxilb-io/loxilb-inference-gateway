# mcp/contract/fields.yml - the field contract of the request models the bridge builds.
#
# Every swagger property of each model carries one label, enforced by
# mcp/contract/fields_test.go:
#   typed           the bridge has a typed argument (arg:) and sends the property (wire:,
#                   default = the property name) in the request body
#   extra-only      reachable only through lb_create.service_extra (serviceArguments)
#   read-back       returned on GET, never sent by the bridge
#   excluded-field  never sent, with a reason (secret material, not wired)
#   pending         not typed yet; phase: names the PR that types it
# desc_sha256 is the SHA-256 of the swagger description; a change is a warning
# naming the field (early signal of semantic drift of an unchanged field).
