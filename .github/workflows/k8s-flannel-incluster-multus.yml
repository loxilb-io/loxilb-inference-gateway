name: K8s-Flannel-Incluster-Multus-Sanity-CI
on:
 # schedule:
 # Runs "At 11:00 UTC every day-of-week"
 #- cron: '0 11 * * *'
 workflow_dispatch:
    inputs:
      testName:
        description: 'Test Run-Name'     
        required: true
        default: 'k8s-flannel-incluster-multus'
jobs:
  test-runner:
    name: k8s-flannel-incluster-multus-sanity
    runs-on: [self-hosted, large]
    if: github.repository == 'loxilb-io/loxilb-inference-gateway' 
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Checkout
      uses: actions/checkout@v7
      with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}

    - name: Run the test
      run: |
         cd cicd/k8s-flannel-incluster-multus
         ./config.sh
         ./validation.sh
         cd -
         
    - name: Clean test-bed
      if: success() || failure()
      run: |
        cd cicd/k8s-flannel-incluster-multus || true
        ./rmconfig.sh
        cd -
