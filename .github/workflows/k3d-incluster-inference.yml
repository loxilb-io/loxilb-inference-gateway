name: K3d-InCluster-Inference-Sanity-CI

# Runs the k3d in-cluster inference-gateway scenarios: loxilb and kube-loxilb
# (feat/auth-annotation, built from source) as Pods in a single-node
# k3d cluster, exercised through Service annotations (svc), through Gateway API
# InferencePool (gwapi), and with the whole stack installed by the Helm chart
# (helm-gwapi, which re-runs the gwapi assertions). Hosted runners suffice: the
# k3d node is a privileged container, so nothing touches the runner's own network.

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      klbRef:
        description: 'kube-loxilb git ref to build'
        required: false
        default: 'feat/auth-annotation'
  push:
    branches: [ "main" ]
    paths:
      - 'cicd/common/k8s-inference/**'
      - 'cicd/k3d-incluster-inference-svc/**'
      - 'cicd/k3d-incluster-inference-gwapi/**'
      - 'cicd/k3d-incluster-inference-epp/**'
      - 'cicd/k3d-helm-inference-gwapi/**'
      - 'deploy/helm/**'
      - '.github/workflows/k3d-incluster-inference.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cicd/common/k8s-inference/**'
      - 'cicd/k3d-incluster-inference-svc/**'
      - 'cicd/k3d-incluster-inference-gwapi/**'
      - 'cicd/k3d-incluster-inference-epp/**'
      - 'cicd/k3d-helm-inference-gwapi/**'
      - 'deploy/helm/**'
      - '.github/workflows/k3d-incluster-inference.yml'

jobs:
  k3d-incluster-inference:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90   # the EPP scenario builds the image from the checkout
    strategy:
      fail-fast: false
      matrix:
        scenario: [k3d-incluster-inference-svc, k3d-incluster-inference-gwapi, k3d-incluster-inference-epp, k3d-helm-inference-gwapi]
    steps:
      - uses: actions/checkout@v4
        with:
          # The EPP scenario builds the image from this checkout, and the
          # Dockerfile needs loxilb-ebpf (and its nested libbpf) present.
          submodules: recursive
      - name: Install PyYAML (manifest renderer)
        run: python3 -m pip install --quiet pyyaml
      # Authenticate to avoid anonymous ghcr pull limits (the image is public).
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        if: matrix.scenario == 'k3d-incluster-inference-epp'
        with:
          go-version-file: go.mod
      - name: Build loxilb from this checkout (the EPP scenario tests the branch)
        env:
          GH_TOKEN: ${{ github.token }}
        if: matrix.scenario == 'k3d-incluster-inference-epp'
        run: |
          docker build --secret id=github_token,env=GH_TOKEN -t ghcr.io/loxilb-io/loxilb-inference-gateway:k3d-epp-local .
          echo "IGW_IMAGE=ghcr.io/loxilb-io/loxilb-inference-gateway:k3d-epp-local" >> "$GITHUB_ENV"
      - name: Run the scenario
        env:
          KLB_REF: ${{ github.event.inputs.klbRef || 'feat/auth-annotation' }}
        run: |
          cd cicd/${{ matrix.scenario }}
          rc=0
          ./config.sh && ./validation.sh || rc=$?
          ./rmconfig.sh || true
          exit $rc
      - name: Debug on failure
        if: failure()
        run: |
          docker ps -a || true
          KCFG=$(ls ~/.config/k3d/kubeconfig-*.yaml 2>/dev/null | head -1)
          [ -n "$KCFG" ] && KUBECONFIG=$KCFG kubectl get pods -A || true
          [ -n "$KCFG" ] && KUBECONFIG=$KCFG kubectl -n kube-system logs deploy/kube-loxilb --tail=80 || true
          [ -n "$KCFG" ] && KUBECONFIG=$KCFG helm list -A || true
