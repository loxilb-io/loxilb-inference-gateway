name: HA-Two-Node-Nightly

# Two-node container clusters, GPU-free, nightly and on demand, and on a pull
# request that changes one of the two suites or what they share.
#
#   kv-mixed-version  strict KV-exact across a mixed-version pair: llb1 is
#                     this build, llb2 is varied per case (the released "old"
#                     image, a divergent or corrupt profile registry, dark),
#                     and attestation is earned through the vLLM attestation
#                     simulator (cicd/common/kv_hash). The only mixed-version
#                     HA coverage in the tree. The old side is the repository
#                     variable PERSIST_UPGRADE_OLD_TAG, the same knob as
#                     persist-upgrade, or the dispatch input oldTag. The suite
#                     fails on purpose when old and new resolve to the same
#                     image. Its artifacts are kept on every run: each run is
#                     evidence for one version pair.                ~5 min
#   ai-qos-ha-sync    the AI-QoS rate-limiter HA sync path: quota debt
#                     refused at the other node, promotion keeps synced
#                     state, a dead quota channel is visible, split-brain
#                     never refunds a spender.                      ~2 min
#
# Fork pull requests are excluded: pulling the released image needs registry
# credentials a fork run does not get.

on:
  push:
    branches:
      - main
    paths:
      - 'cicd/kv-mixed-version/**'
      - 'cicd/ai-qos-ha-sync/**'
      - 'cicd/common/**'
      - '.github/workflows/ha-two-node-nightly.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cicd/kv-mixed-version/**'
      - 'cicd/ai-qos-ha-sync/**'
      - 'cicd/common/**'
      - '.github/workflows/ha-two-node-nightly.yml'
  schedule:
    # Away from the other nightlies, which cluster at 16:00-18:17 and 19:00 UTC.
    - cron: '35 19 * * *'
  workflow_dispatch:
    inputs:
      oldTag:
        description: 'Old-side image tag for kv-mixed-version (default: vars.PERSIST_UPGRADE_OLD_TAG)'
        required: false
        default: ''

jobs:
  kv-mixed-version:
    name: kv-mixed-version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      KV_OLD_IMAGE: ghcr.io/loxilb-io/loxilb-inference-gateway:${{ inputs.oldTag || vars.PERSIST_UPGRADE_OLD_TAG || 'v0.9.8.9-rc.1-u24' }}
      LOXILB_DOCKER_IMAGE: ghcr.io/loxilb-io/loxilb-inference-gateway:main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      - run: docker pull "$KV_OLD_IMAGE"
      # The suite's seven mixed-version cases. The gateway logs of both nodes
      # are kept before teardown: the attestation ladder's reasons are only
      # in them.
      - name: Mixed-version strict KV (old/new pair, attestation through the vLLM simulator)
        run: |
          cd cicd/kv-mixed-version/
          rc=0
          ./config.sh && ./validation.sh || rc=$?
          mkdir -p /tmp/kv-mixed-version
          for n in llb1 llb2; do
            docker exec "$n" sh -c 'cat /var/log/loxilb*.log' > "/tmp/kv-mixed-version/$n-loxilb.log" 2>&1 || true
          done
          ./rmconfig.sh || rc=1
          cd -
          exit $rc
      - name: Keep the run's version pair and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv-mixed-version-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/kv-mixed-version/
            /tmp/kvmv-*
          if-no-files-found: ignore
          retention-days: 14

  ai-qos-ha-sync:
    name: ai-qos-ha-sync
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: AI-QoS rate-limiter HA sync (two nodes, shared key store)
        env:
          LOXILB_DOCKER_IMAGE: ghcr.io/loxilb-io/loxilb-inference-gateway:main
        run: |
          cd cicd/ai-qos-ha-sync/
          rc=0
          sudo -E ./config.sh && sudo ./validation.sh || rc=$?
          sudo ./rmconfig.sh || rc=1
          cd -
          exit $rc
      - name: Keep what a failed run left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-qos-ha-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ai-qos-ha-*.log
          if-no-files-found: ignore
          retention-days: 14
