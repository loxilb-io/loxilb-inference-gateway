name: Liveness-LB-Sanity-CI-Ubuntu-22
on:
  schedule:
  # Runs "At 17:00 UTC every day-of-week"
  - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'
      tags:
        description: 'Liveness LB Sanity Ubuntu 22'
  workflow_run:
    workflows: ["Docker-Multi-Arch"]
    types:
      - completed
       
jobs:
  build:
    name: liveness-lb-sanity-ubuntu-22
    runs-on: ubuntu-22.04
    if: github.repository == 'loxilb-io/loxilb-inference-gateway'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
      - uses: actions/setup-go@v5
        with:
             go-version: '>=1.18.0'
      - run: sudo apt-get update
      - run: sudo apt-get -y install iperf iproute2 nodejs socat ethtool lksctp-tools
      # Install minica as root into /usr/local/bin (on PATH) so the TLS scenarios
      # (httpsep, http2ep) can mint their test certs via 'command -v minica'.
      - run: sudo -E env "PATH=$PATH" GOBIN=/usr/local/bin go install github.com/jsha/minica@latest
      - run: |
             cd cicd/tcplbmon/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/udplbmon/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/sctplbmon/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/tcplbmon6/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      # Per-endpoint counters survive a health flap of another endpoint (the rule is
      # re-programmed in place). Tears down whatever the verdict, keeps the
      # validation's exit code, and leaves llb1's logs in /tmp/ci-logs when red.
      - run: |
             cd cicd/tcplbmon-epstat/
             rc=0
             ./config.sh && ./validation.sh || rc=$?
             if [ $rc -ne 0 ]; then
               mkdir -p /tmp/ci-logs/tcplbmon-epstat
               for f in /tmp/loxilb.err /tmp/loxilb.out /var/log/loxilbdp.log; do docker cp "llb1:$f" /tmp/ci-logs/tcplbmon-epstat/ || true; done
             fi
             ./rmconfig.sh
             exit $rc
      - run: |
             cd cicd/tcplbepmod/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/lbtimeout/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/lb6timeout/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/httpsep/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/http2ep/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: liveness-lb-sanity-ubuntu-22-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ci-logs
          if-no-files-found: ignore
          retention-days: 14
