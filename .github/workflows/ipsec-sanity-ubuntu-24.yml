name: IPsec-Sanity-CI-Ubuntu-24

on:
  schedule:
  # Runs "At 11:00 UTC every day-of-week"
  - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      userInput:
        description: 'Enter string to print at end'
        required: true
        default: 'Finished'
      tags:
        description: 'IPSec Sanity Ubuntu 24'
  workflow_run:
    workflows: ["Docker-Multi-Arch"]
    types:
      - completed
jobs:
  build:
    name: ipsec-sanity-ubuntu-24
    runs-on: ubuntu-24.04
    if: github.repository == 'loxilb-io/loxilb-inference-gateway'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Seed :latest-u24 from :latest on the Azure runner
        # The u24-built eBPF datapath (tc_packet_func_slow) exceeds the hosted
        # ubuntu-24.04 (6.17-azure) kernel's BPF verifier limit and loxilb aborts.
        # The u22-based :latest image loads fine here, so run it on this runner.
        run: |
          docker pull ghcr.io/loxilb-io/loxilb-inference-gateway:latest
          docker tag ghcr.io/loxilb-io/loxilb-inference-gateway:latest ghcr.io/loxilb-io/loxilb-inference-gateway:latest-u24
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
      - uses: actions/setup-go@v5
        with:
             go-version: '>=1.18.0'
      - run: |
             cd cicd/ipsec1/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/ipsec2/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/ipsec3/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/ipsec-e2e/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: echo ${{ github.event.inputs.userInput }}
