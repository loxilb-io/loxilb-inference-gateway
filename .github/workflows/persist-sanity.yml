name: Persist-Sanity-CI

# Configuration-persistence gates, self-contained on a hosted runner.
#
#   unit-gates    vet + the snapshot/restore unit suites (document codec,
#                 domain registry, restore engine, wipe/rollback, boot
#                 write-through) and the route-lifecycle guard: every
#                 mutating REST route in api/swagger.yml must carry an
#                 explicit persistence classification
#                 (pkg/snapshot/lifecycle.go), so a new mutating API
#                 cannot merge without a reboot-recovery decision.
#                 Pure Go -- no submodules, no datapath build.
#
#   persist-scenarios   the docker scenario suites: cfg-persist-roundtrip
#                 (persist + in-place restart must be field-identical,
#                 canonical deep-diff oracle), cfg-persist-negative
#                 (corrupted/truncated snapshots quarantine loudly,
#                 hostile documents are refused, partial documents never
#                 wipe what they do not cover) and cfg-persist-restartmatrix
#                 (the three restart classes: in-place, container
#                 recreate, cold config -- each ending on the same
#                 deep-compare plus traffic probe) and cfg-persist-cli
#                 (the packaged CLI as subject, REST as oracle: the
#                 identity it reports is the identity on disk, and every
#                 failure path exits non-zero). The CLI it measures is
#                 built here from the CLI repository, so a change on
#                 either side of that contract shows up as a red gate
#                 rather than as drift discovered at a release.
#
#   persist-soak / persist-upgrade   nightly and dispatch only, never a
#                 per-PR gate: the drift/leak classes that need repetition
#                 (cfg-persist-soak) and the two-image version matrix
#                 (cfg-persist-upgrade), which needs a released image on
#                 the other side of the volume.

on:
  push:
    branches:
      - main
    paths:
      - 'pkg/snapshot/**'
      - 'api/swagger.yml'
      - 'api/loxinlp/**'
      - 'api/restapi/handler/snapshot.go'
      - 'api/restapi/handler/l7policy.go'
      - 'api/restapi/handler/cert.go'
      - 'api/restapi/handler/cors.go'
      - 'api/restapi/handler/configure_trace.go'
      - 'common/**'
      - 'cicd/cfg-persist-*/**'
      - 'cicd/common/persist_lib.sh'
      - '.github/workflows/persist-sanity.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'pkg/snapshot/**'
      - 'api/swagger.yml'
      - 'api/loxinlp/**'
      - 'api/restapi/handler/snapshot.go'
      - 'api/restapi/handler/l7policy.go'
      - 'api/restapi/handler/cert.go'
      - 'api/restapi/handler/cors.go'
      - 'api/restapi/handler/configure_trace.go'
      - 'common/**'
      - 'cicd/cfg-persist-*/**'
      - 'cicd/common/persist_lib.sh'
      - '.github/workflows/persist-sanity.yml'
  schedule:
    # Nightly, so a regression arriving through an untouched path (a
    # dependency bump, runner image drift) still surfaces within a day.
    - cron: '50 17 * * *'
  workflow_dispatch:

jobs:
  unit-gates:
    name: unit-gates
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Snapshot unit suites and route-lifecycle guard
        run: |
          go vet ./pkg/snapshot/...
          go test -count=1 ./pkg/snapshot/...

      # The producer half of the config-lifecycle contract check. The CLI
      # repository pins the operations and fields it decodes from the
      # persist and restore responses and checks them against a checkout
      # of this repository; running the same fixture here means a change
      # to swagger.yml that breaks the consumer goes red on the PR that
      # makes it, instead of on a CLI release weeks later.
      - name: Check out the CLI repository
        uses: actions/checkout@v4
        with:
          repository: loxilb-io/loxicmd-inference-gateway
          ref: main
          path: .loxicmd-contract
          persist-credentials: false
      - name: Config-lifecycle contract as the CLI consumes it
        working-directory: .loxicmd-contract
        env:
          GATEWAY_REPO: ${{ github.workspace }}
        run: go test -count=1 ./pkg/api/ -run 'TestGatewayContract|TestLifecycleModels|TestLifecycleEnums' -v

  persist-scenarios:
    name: persist-scenarios
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update
      - run: sudo apt-get -y install clang llvm libelf-dev gcc-multilib libpcap-dev linux-tools-$(uname -r) elfutils dwarves git libbsd-dev bridge-utils unzip build-essential bison flex iproute2 socat ethtool libjson-c-dev libnghttp2-dev jq
      - name: Install libtokenizers (cgo link dependency of the router)
        run: arch=$(dpkg --print-architecture) && wget -q https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-${arch}.tar.gz -O /tmp/libtokenizers.tar.gz && sudo tar -xzf /tmp/libtokenizers.tar.gz -C /usr/local/lib/ && rm /tmp/libtokenizers.tar.gz
      - run: loxilb-ebpf/utils/mkllb_bpffs.sh
      - run: sudo -E env "PATH=$PATH" make
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      # Same image recipe as the AI-gateway sanity workflow: pull the
      # published image, overlay the freshly built binary, and commit --
      # the scenarios then test THIS tree, not the registry.
      - run: docker pull ghcr.io/loxilb-io/loxilb-inference-gateway:latest || docker build -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      - run: docker run -u root --cap-add SYS_ADMIN --restart unless-stopped --privileged -dit -v /dev/log:/dev/log --name loxilb ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: sudo -E env "PATH=$PATH" make docker-cp
      - run: docker exec -dit loxilb mkllb_bpffs
      - run: id=`docker ps -f name=loxilb | cut -d " " -f 1 | grep -iv "CONTAINER"` && docker commit $id ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: docker stop loxilb && docker rm loxilb

      # The CLI is a subject of cfg-persist-cli, not a bystander, so it is
      # built from its own repository rather than taken from whatever was
      # baked into the published image. Static, so it runs inside the
      # container regardless of the image's libc.
      - name: Check out the CLI repository
        uses: actions/checkout@v4
        with:
          repository: loxilb-io/loxicmd-inference-gateway
          ref: main
          path: .loxicmd-under-test
          persist-credentials: false
      - name: Build the CLI under test
        run: |
          cd .loxicmd-under-test
          CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/loxicmd-under-test" .
          "$GITHUB_WORKSPACE/loxicmd-under-test" version

      - name: Round-trip (persist + restart field-identical, deep-diff oracle)
        run: |
          cd cicd/cfg-persist-roundtrip/
          rc=0
          ./config.sh && ./validation.sh || rc=$?
          ./rmconfig.sh || true
          exit $rc
      - name: Negative (quarantine, refusal, partial-document safety)
        run: |
          cd cicd/cfg-persist-negative/
          rc=0
          ./config.sh && ./validation.sh || rc=$?
          ./rmconfig.sh || true
          exit $rc
      - name: Restart matrix (in-place, container recreate, cold config)
        run: |
          cd cicd/cfg-persist-restartmatrix/
          rc=0
          ./config.sh && ./validation.sh || rc=$?
          ./rmconfig.sh || true
          exit $rc
      - name: CLI (packaged binary as subject, REST as oracle)
        env:
          LOXICMD_BIN: ${{ github.workspace }}/loxicmd-under-test
        run: |
          cd cicd/cfg-persist-cli/
          rc=0
          ./config.sh && ./validation.sh || rc=$?
          ./rmconfig.sh || true
          exit $rc
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persist-scenario-artifacts
          path: |
            cicd/cfg-persist-roundtrip/artifacts/
            cicd/cfg-persist-negative/artifacts/
            cicd/cfg-persist-restartmatrix/artifacts/
            cicd/cfg-persist-cli/artifacts/
          if-no-files-found: ignore

  persist-soak:
    name: persist-soak
    runs-on: ubuntu-22.04
    # Repetition-class coverage (cumulative restore drift, checksum churn,
    # descriptor growth, debounce collapse under a config storm). Long by
    # construction -- nightly and dispatch only, never a per-PR gate.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update
      - run: sudo apt-get -y install clang llvm libelf-dev gcc-multilib libpcap-dev linux-tools-$(uname -r) elfutils dwarves git libbsd-dev bridge-utils unzip build-essential bison flex iproute2 socat ethtool libjson-c-dev libnghttp2-dev jq
      - name: Install libtokenizers (cgo link dependency of the router)
        run: arch=$(dpkg --print-architecture) && wget -q https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-${arch}.tar.gz -O /tmp/libtokenizers.tar.gz && sudo tar -xzf /tmp/libtokenizers.tar.gz -C /usr/local/lib/ && rm /tmp/libtokenizers.tar.gz
      - run: loxilb-ebpf/utils/mkllb_bpffs.sh
      - run: sudo -E env "PATH=$PATH" make
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - run: docker pull ghcr.io/loxilb-io/loxilb-inference-gateway:latest || docker build -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      - run: docker run -u root --cap-add SYS_ADMIN --restart unless-stopped --privileged -dit -v /dev/log:/dev/log --name loxilb ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: sudo -E env "PATH=$PATH" make docker-cp
      - run: docker exec -dit loxilb mkllb_bpffs
      - run: id=`docker ps -f name=loxilb | cut -d " " -f 1 | grep -iv "CONTAINER"` && docker commit $id ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: docker stop loxilb && docker rm loxilb

      - name: Soak (drift, stability, storm, concurrency)
        run: |
          cd cicd/cfg-persist-soak/
          rc=0
          ./config.sh && ./validation.sh || rc=$?
          ./rmconfig.sh || true
          exit $rc
      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persist-soak-artifacts
          path: cicd/cfg-persist-soak/artifacts/
          if-no-files-found: ignore

  persist-upgrade:
    name: persist-upgrade
    runs-on: ubuntu-22.04
    # The version matrix: a released image on one side of the config
    # volume, this build on the other. Needs two distinct images, so it is
    # dispatch/nightly only and fails loudly rather than running vacuously
    # when both sides resolve to the same reference.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update
      - run: sudo apt-get -y install clang llvm libelf-dev gcc-multilib libpcap-dev linux-tools-$(uname -r) elfutils dwarves git libbsd-dev bridge-utils unzip build-essential bison flex iproute2 socat ethtool libjson-c-dev libnghttp2-dev jq
      - name: Install libtokenizers (cgo link dependency of the router)
        run: arch=$(dpkg --print-architecture) && wget -q https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-${arch}.tar.gz -O /tmp/libtokenizers.tar.gz && sudo tar -xzf /tmp/libtokenizers.tar.gz -C /usr/local/lib/ && rm /tmp/libtokenizers.tar.gz
      - run: loxilb-ebpf/utils/mkllb_bpffs.sh
      - run: sudo -E env "PATH=$PATH" make
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - run: docker pull ghcr.io/loxilb-io/loxilb-inference-gateway:latest || docker build -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      - run: docker run -u root --cap-add SYS_ADMIN --restart unless-stopped --privileged -dit -v /dev/log:/dev/log --name loxilb ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: sudo -E env "PATH=$PATH" make docker-cp
      - run: docker exec -dit loxilb mkllb_bpffs
      - run: id=`docker ps -f name=loxilb | cut -d " " -f 1 | grep -iv "CONTAINER"` && docker commit $id ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: docker stop loxilb && docker rm loxilb
      - run: docker pull ghcr.io/loxilb-io/loxilb-inference-gateway:${{ vars.PERSIST_UPGRADE_OLD_TAG || 'v0.9.8.9-rc.1-u24' }}
      - name: Upgrade matrix (released image <-> this build, one volume)
        env:
          UP_OLD_IMAGE: ghcr.io/loxilb-io/loxilb-inference-gateway:${{ vars.PERSIST_UPGRADE_OLD_TAG || 'v0.9.8.9-rc.1-u24' }}
          UP_NEW_IMAGE: ghcr.io/loxilb-io/loxilb-inference-gateway:latest
        run: |
          cd cicd/cfg-persist-upgrade/
          rc=0
          ./config.sh && ./validation.sh || rc=$?
          ./rmconfig.sh || true
          exit $rc
      - name: Upload upgrade artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persist-upgrade-artifacts
          path: cicd/cfg-persist-upgrade/artifacts/
          if-no-files-found: ignore
