# =============================================================================
# loxilb Presidio Configuration - Production Ready
# Phase 2.1: JSON-Aware Anonymization for OpenAI & MCP Services
# =============================================================================

[general]
# Global PII detection settings
enabled = true
server_url = 172.31.45.219:50051
timeout_ms = 5000
max_retries = 3

[limits]
# Resource limits (production-tuned)
max_body_size = 1048576          # 1MB max request body
min_body_size = 100              # Skip tiny requests
max_json_fields = 32             # Max JSON field mappings
max_jsonpath_length = 128        # Max JSONPath expression length
max_entity_types_per_field = 8   # Max entity types per field

[detection]
# PII detection behavior
mode = 1                         # 0=detect, 1=mask, 2=redact, 3=anonymize
direction = 0                    # 0=both, 1=request-only, 2=response-only
score_threshold = 0.7            # Confidence threshold (0.0-1.0)
scan_mode = 1                    # 0=full (skip large), 1=truncate, 2=skip

[json]
# JSON-aware anonymization (Phase 2.1)
enabled = true
config_file = /etc/loxilb/presidio_json_fields.json
response_scanning = false        # Set true to scan responses too
fallback_to_text = true          # Fallback to text mode if JSON parsing fails
preserve_structure = true        # Ensure valid JSON output

[url_patterns]
# URL pattern matching (OpenAI-style selective detection)
mode = 1                         # 0=all, 1=include-list, 2=exclude-list

# OpenAI API endpoints
include_pattern_1 = /v1/chat/completions
include_pattern_2 = /v1/completions
include_pattern_3 = /v1/embeddings
include_pattern_4 = /v1/fine_tuning/jobs/*
include_pattern_5 = /v1/assistants/*

# MCP protocol endpoints (if using HTTP transport)
include_pattern_6 = /mcp/v1/*
include_pattern_7 = /rpc/*

# Exclude health checks and metrics
exclude_pattern_1 = /health
exclude_pattern_2 = /metrics
exclude_pattern_3 = /v1/models

[operators]
# Default anonymization operators
default_operator = replace       # replace, redact, hash, encrypt, mask
email_address = replace
phone_number = replace
us_ssn = redact                  # Complete removal for SSN
credit_card = redact             # Complete removal for credit cards
person = replace
location = replace

[circuit_breaker]
# Prevent cascading failures
failure_threshold = 5            # Open circuit after N failures
timeout_sec = 30                 # Wait before retry
success_threshold = 2            # Close circuit after N successes

[fail_mode]
# Behavior when Presidio unavailable
mode = 0                         # 0=fail-open (allow traffic), 1=fail-closed (block traffic)

[performance]
# Performance tuning
retry_backoff_ms = 100          # Backoff between retries
max_concurrent_requests = 100    # Max parallel Presidio requests

# =============================================================================
# Future Phases (currently disabled)
# =============================================================================

[encryption]
# Reversible encryption (Phase 2.3)
enabled = false
mode = mask                      # mask (default), encrypt
key_source = env                 # env, file, vault
key_rotation_days = 90
audit_log = /var/log/loxilb/presidio_audit.log

[custom_patterns]
# Custom recognizer patterns (Phase 2.2)
enabled = false
patterns_file = /etc/loxilb/presidio_custom_patterns.json
reload_interval_sec = 300
validate_regex = true

[batch]
# Batch processing (Phase 2.4)
enabled = false
max_batch_size = 1000
stream_timeout_ms = 60000
max_concurrent_batches = 10
