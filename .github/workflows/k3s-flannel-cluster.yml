name: K3s-Flannel-Cluster-Sanity-CI
on:
 # schedule:
 # Runs "At 11:00 UTC every day-of-week"
 # - cron: '0 11 * * *'
 workflow_dispatch:
    inputs:
      testName:
        description: 'Test Run-Name'     
        required: true
        default: 'k3s-flannel-cluster'
jobs:
  build:
    name: k3s-flannel-cluster-sanity
    runs-on: [self-hosted, large]
    if: github.repository == 'loxilb-io/loxilb-inference-gateway'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - run: |
         cd cicd/k3s-flannel-cluster
         ./config.sh
         ./validation.sh
         ./rmconfig.sh
         cd -
