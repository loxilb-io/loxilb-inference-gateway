      bytes:
        type: integer
        format: int64
        description: Byte counter (read-only)

  SecurityRateConfigMod:
    type: object
    required:
      - synEnabled
      - synThreshold
      - cookieThreshold
      - connRateEnabled
      - ratePerSec
      - udpEnabled
      - udpPktThreshold
      - udpBandwidthMB
    properties:
      synEnabled:
        type: boolean
        description: Enable/disable SYN flood protection (P0-5)
      synThreshold:
        type: integer
        format: int64
        default: 100
        description: Maximum SYNs per second per IP (hard drop threshold)
      cookieThreshold:
        type: integer
        format: int64
        default: 50
        description: Enable SYN cookies above this rate (must be < synThreshold)
      connRateEnabled:
        type: boolean
        description: Enable/disable connection rate limiting (P0-6)
      ratePerSec:
        type: integer
        format: int64
        default: 50
        description: Maximum new connections per second per IP
      udpEnabled:
        type: boolean
        description: Enable/disable UDP flood protection (P0-7)
      udpPktThreshold:
        type: integer
        format: int64
        default: 1000
        description: Maximum UDP packets per second per IP
      udpBandwidthMB:
        type: integer
        format: int64
        default: 100
        description: Maximum UDP bandwidth in MB per second per IP
      whitelistIps:
        type: array
        items:
          type: string
        description: IP addresses to bypass all rate limiting

  SecurityRateEntry:
    type: object
    properties:
      synEnabled:
        type: boolean
        description: Whether SYN flood protection is enabled
      synThreshold:
        type: integer
        format: int64
        description: Maximum SYNs per second per IP
      cookieThreshold:
        type: integer
        format: int64
        description: SYN cookie activation threshold
      connRateEnabled:
        type: boolean
        description: Whether connection rate limiting is enabled
      ratePerSec:
        type: integer
        format: int64
        description: Maximum new connections per second per IP
      udpEnabled:
        type: boolean
        description: Whether UDP flood protection is enabled
      udpPktThreshold:
        type: integer
        format: int64
        description: Maximum UDP packets per second per IP
      udpBandwidthMB:
        type: integer
        format: int64
        description: Maximum UDP bandwidth in MB per second per IP
      whitelistIps:
        type: array
        items:
          type: string
        description: Whitelisted IPs
      synBlocked:
        type: integer
        format: int64
        description: SYN packets blocked (read-only)
      synPassed:
        type: integer
        format: int64
        description: SYN packets passed (read-only)
      synCookies:
        type: integer
        format: int64
        description: SYN cookie activations (read-only)
      connBlocked:
        type: integer
        format: int64
        description: Connections blocked by rate limit (read-only)
      connPassed:
        type: integer
        format: int64
        description: Connections passed (read-only)
      udpBlocked:
        type: integer
        format: int64
        description: UDP packets blocked (read-only)
      udpPassed:
        type: integer
        format: int64
        description: UDP packets passed (read-only)
      udpBytesBlocked:
        type: integer
        format: int64
