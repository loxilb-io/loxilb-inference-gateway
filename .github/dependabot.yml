# Dependabot: weekly dependency update PRs for Go modules, GitHub Actions,
# and the container/package build bases. PRs only — nothing merges without
# review and green CI.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # k8s.io/{client-go,api,apimachinery} >= 0.34 require the Go 1.26
      # toolchain, but we deliberately stay on Go 1.25. The pod-watcher in
      # api/k8s uses only stable core client-go APIs, so 0.29.x is sufficient.
      # Bump these by hand if/when we move the Go toolchain.
      - dependency-name: "k8s.io/client-go"
      - dependency-name: "k8s.io/api"
      - dependency-name: "k8s.io/apimachinery"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Base OS, Go toolchain, and the alpine runtime base are pinned to our
      # stable set (ubuntu 20/22/24, go 1.25, alpine 3.20) and moved by hand,
      # not by Dependabot. Freeze them so the weekly run stops proposing
      # ubuntu 26.x / go 1.26+ / alpine 3.2x bumps.
      - dependency-name: "ubuntu"
      - dependency-name: "golang"
      - dependency-name: "alpine"

  - package-ecosystem: docker
    directory: "/packaging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # Same policy as above for the packaging build base.
      - dependency-name: "ubuntu"
      - dependency-name: "golang"

  # Monitoring stack image pins (prom/prometheus, grafana/grafana) in the
  # shipped compose file — bumps are gated by monitoring-lint + monitoring-e2e.
  - package-ecosystem: docker-compose
    directory: "/deploy/monitoring"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
