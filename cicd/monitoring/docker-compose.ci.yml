# CI profile of the LoxiLB monitoring stack (Tier 1 of the internal monitoring CI plan).
# Differences from deploy/monitoring/docker-compose.yml:
#   - prometheus.yml is the scenario-generated prometheus-ci.yml (target = the
#     llb1 container bridge IP instead of 127.0.0.1)
#   - Grafana admin credentials come from inline env (no .env file)
#   - no named volumes — CI runs are throwaway, rmconfig.sh removes everything
# Rules, dashboards, and provisioning are mounted straight from deploy/monitoring
# so CI validates exactly what ships.
services:
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: loxilb-ci-prometheus
    network_mode: host
    volumes:
      - ./prometheus-ci.yml:/etc/prometheus/prometheus.yml:ro
      - ../../deploy/monitoring/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      # Loopback bind, same posture the shipped compose documents — every CI
      # consumer (validation.sh, sweep, Grafana datasource) queries localhost,
      # and the security matrix S4 arm asserts non-reachability from outside.
      - --web.listen-address=127.0.0.1:9090

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: loxilb-ci-alertmanager
    network_mode: host
    volumes:
      - ../../deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      # prometheus.yml already targets 127.0.0.1:9093; the shipped example
      # config delivers to the local webhook sink on 127.0.0.1:9095
      - --web.listen-address=127.0.0.1:9093

  grafana:
    image: grafana/grafana:11.6.0
    container_name: loxilb-ci-grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ci-admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
