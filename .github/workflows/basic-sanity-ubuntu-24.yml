name: Sanity-CI-Ubuntu-24
on:
  schedule:
  # Runs "At 11:00 UTC every day-of-week"
  - cron: '0 11 * * *'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      testName:
        description: 'Test Run-Name'     
        required: true
        default: 'Sanity-BuildCI-u24'
  workflow_run:
    workflows: ["Docker-Multi-Arch"]
    types:
      - completed
jobs:
  build:
    name: basic-sanity-ubuntu-24
    runs-on: ubuntu-24.04
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.repository == 'loxilb-io/loxilb-inference-gateway' && github.actor != 'dependabot[bot]'
    # Force the u22 :latest image on hosted ubuntu-24.04 (6.x-azure)
    # runners: the latest-u24 eBPF datapath trips the kernel BPF verifier
    # E2BIG limit and loxilb aborts. common.sh honors LOXILB_DOCKER_IMAGE.
    env:
      LOXILB_DOCKER_IMAGE: latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
          
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: actions/setup-python@v5
      - uses: actions/setup-go@v5
        with:
             go-version: '>=1.18.0'
      - run: |
             cd cicd/sconnect/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/tcplb/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
