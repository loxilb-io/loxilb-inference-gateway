        type: number
      secondarystat:
        type: number
      thickness:
        type: integer
      color:
        type: string
  
  OauthMessageResponse:
    description: >-
      Legacy message schema. OAuth authorization initiation currently returns
      HTTP 307 with Location, not a JSON success message or HTTP 302. OAuth routes
      require Oauth2Enable. State is single-use, process-local, and expires after
      ten minutes; browser/session and provider binding are not established.
    properties:
      message:
        type: string
    type: object
  
  OauthErrorResponse:
    description: >-
      OAuth-specific message envelope. Invalid provider or callback state returns
      400 on initiation/callback; exchange and refresh failures generally return
      500. Refresh credential rejection is not consistently represented as 401.
    properties:
      message:
        type: string
    type: object
  
  OauthLoginResponse:
    description: >-
      Provider token response, not a local JWT. Current OAuth admission assigns
      administrator authority unconditionally; identity admission and role mapping
      require explicit policy and implementation. GitHub configuration currently
      uses the Google OAuth endpoint, and provider user-info parsing is incomplete;
      this schema is not evidence of qualified provider support.
    properties:
      id:
        type: string
        description: The unique identifier for the authenticated user (e.g., Google user ID).
      token:
        type: string
        description: The access token used for API requests. Typically expires after a short duration.
      refreshtoken:
        type: string
        description: Provider refresh token. The current refresh endpoint also requires the original access-token entry to remain cached, so refresh after access-token expiry is not supported by that path.
      expiresin:
        type: integer
        description: The duration in seconds that the access token is valid for.
    type: object
  
  OauthTokenResponse:
    description: >-
      Refresh result for a still-cached access-token/refresh-token pair. A rotated
      refresh token is not returned by this schema, and replacement of stored
      credentials is not atomic. Do not describe this as a complete post-expiry
      refresh or refresh-token-rotation workflow.
    properties:
      token:
        type: string
        description: The access token used for API requests. Typically expires after a short duration.
      expiresin:
        type: integer
        description: The duration in seconds that the access token is valid for.
    type: object
    
  CorsEntry:
    type: object
    description: >-
      Management CORS origin additions, applied sequentially rather than atomically;
      a later failure does not undo earlier entries. Omitted or empty cors is a
      no-op. CRUD rejects wildcard origin entries. Removing the last explicit
      origin leaves an empty allowlist, not the factory wildcard state. GET uses
      corsAttr. Current preflight grants omit PATCH and X-Api-Key; CORS is not
      management authentication or data-plane API-key enforcement.
    properties:
      cors:
        type: array
        description: Origin strings to add. Values are trimmed; empty values and '*' are rejected, and duplicates conflict. Deletion identifies the exact origin encoded as one path parameter.
        items:
          type: string
          description: cors list

  UpdateLicenseRequest:
    type: object
    description: >-
      Replaces the configured manual management-token file with license_key and
      echoes the request on success. This is not license validation and does not
      change the active authentication mode. Empty/whitespace validation and a
      secret-response policy are not established. Authentication precedence is
      local user service, OAuth, then manual token; with none configured the
      management API operates without credential enforcement.
    required:
      - license_key
    properties:
      license_key:
        type: string

#----------------------------------------------
# GPU-Aware Load Balancing Definitions
#----------------------------------------------
  GPUMonitoringStatus:
    type: object
    properties:
      enabled:
        type: boolean
        description: Runtime monitoring flag, not proof of GPU health or effective routing. The generated response can omit false.
      routing_mode:
        type: string
        description: Reported monitoring mode (standard_chwbl, gpu_aware or disabled when support is not compiled), not verified per-service datapath selection.
      worker_count:
        type: integer
        description: Number of cached worker entries, including potentially stale samples; zero can be omitted.
      last_metrics_update:
        type: string
        format: date-time
        description: Latest timestamp among cached samples, not a fresh health probe; may be absent when no sample exists.
      ebpf_map_loaded:
        type: boolean
        description: Whether the worker-statistics map descriptor is positive; this does not verify all required maps or their consumers. False can be omitted.

  WorkerMetricsEntry:
    type: object
    required:
      - endpoint_ip
      - queued_requests
      - kv_cache_usage_perc
    properties:
      endpoint_ip:
        type: string
        description: Worker endpoint label, conventionally IP:port. The handler does not establish endpoint registration or fully validate address syntax; GPU indexing uses an IP-like key, so different supplied ports can alias map state.
      queued_requests:
        type: integer
        minimum: 0
        description: "Caller-supplied queue observation. The builtin scraper stores waiting requests, not running plus waiting. Values are converted to uint32 without a matching schema maximum; safe bounds and a uniform producer contract remain unresolved."
      swapped_requests:
        type: integer
        minimum: 0
        description: "Caller-supplied swap/preemption observation; the handler does not compute or verify a delta. Omitted values replace the previous sample with zero. Conversion to uint32 lacks a matching schema maximum."
      kv_cache_usage_perc:
        type: integer
        minimum: 0
        maximum: 100
        description: "vllm:gpu_cache_usage_perc * 100 (0-100 scale)"
      num_gpu_blocks:
        type: integer
        minimum: 0
        description: "Advertised GPU-block capacity observation. Omitted values replace the previous sample with zero. The handler does not verify engine capacity and converts to uint32 without a matching schema maximum."
      timestamp:
        type: string
        format: date-time
        description: Sample collection time. Omitted or zero time becomes the server's current time. Samples older than ten seconds are rejected; future timestamps currently lack an upper bound. Readback reports the cached sample time.

  WorkerMetricsResponse:
    type: object
    required:
      # Both must serialize unconditionally. monitoring_enabled is the field
      # that distinguishes a disabled subsystem from an enabled one with no
      # workers reporting yet; without 'required' go-swagger emits omitempty
      # and false is dropped, making the two states byte-identical on the
      # wire. workers is listed for the same reason: an empty list must be
      # visible as an empty list.
      - workers
      - monitoring_enabled
    properties:
      workers:
        type: array
        items:
          $ref: '#/definitions/WorkerMetricsEntry'
      monitoring_enabled:
        type: boolean
        description: >-
          Whether GPU worker-metrics monitoring is enabled. When false the
          gateway accepts no ingestion and workers is always empty; when true
          an empty workers list means no worker has reported yet.

  GPUEnableResponse:
    type: object
    required:
      - enabled
      - routing_mode
      - message
    properties:
      enabled:
        type: boolean
        description: Whether GPU monitoring is now enabled
      routing_mode:
        type: string
        description: Current routing mode (gpu_aware or standard_chwbl)
      message:
        type: string
        description: Status message

  WorkerMetricsUpdateResponse:
    type: object
    required:
      - endpoint_ip
      - queued_requests
      - message
    properties:
      endpoint_ip:
        type: string
        description: Worker endpoint that was updated
      queued_requests:
        type: integer
        description: Number of queued requests (for confirmation)
      message:
        type: string
        description: Status message

  ConversationCleanupResponse:
    type: object
    required:
      - deleted_count
      - oldest_remaining_hours
      - message
    properties:
      deleted_count:
        type: integer
        description: Currently always zero from a placeholder backend that performs no deletion; this does not prove the table is empty.
      oldest_remaining_hours:
        type: number
        format: float
        description: Currently a placeholder zero, not a measured age of remaining conversations.
      message:
        type: string
        description: Status message

  SNICertificateEntry:
    type: object
    description: >-
      Registration in the node's shared hostname-keyed certificate store, not a
      PEM upload. DELETE uses hostname and ignores certPath; it unregisters without
      deleting files. Mutations currently return HTTP 200 result strings for both
      success and failure. GET returns sniAttr entries, not certificates/count or
      reference-count fields. Hostname and path validation is incomplete. Loading
      a root CA file alone does not enable mTLS on this registration path.
    required:
      - hostname
    properties:
      hostname:
        type: string
        description: Hostname for SNI certificate (e.g., api.example.com). This certificate will be automatically used by all loadbalancer rules that have matching 'host' field.
      certPath:
        type: string
        description: Optional directory on the gateway node containing server.crt and server.key; omitted uses the hostname-relative location under /opt/loxilb/cert. This is not a client-side path or upload. The registration loader is invoked with mTLS disabled, so rootCA.crt alone does not enable client-certificate enforcement.
  Cert:
    type: object
    description: >-
      Managed PEM input and partial read model. POST currently returns empty 201,
      including when it mints an ID; callers cannot obtain that minted handle
      from the response. PUT uses the path ID and ignores body ID and hostnames.
      Known lifecycle gaps: duplicate POST persists before rejecting registration
      and can remove existing material; failed rotation does not roll back files;
      hostname ownership conflicts and multi-host swaps are not transactional;
      rotation retains the old hostname set. Do not claim atomic certificate
      transactions, automatic SAN migration, or verified zero downtime. GET
      returns no private-key material, although the shared schema still requires
      keyPem and the generated response can serialize it as null.
    required:
      - certPem
      - keyPem
    properties:
      certId:
        type: string
        x-nullable: true
        description: Opaque handle, client-supplied or minted when absent/empty on POST. PUT uses the path handle. Current validation permits at most 63 bytes and rejects path separators and any '..' substring; NUL validation is incomplete. Minted handles are currently not returned by POST.
      certPem:
        type: string
        x-nullable: true
        description: Leaf certificate PEM required on POST/PUT. The Go handler checks PEM armor; authoritative X.509/key parsing occurs in the OpenSSL loader after persistence. A 400 load failure does not imply transactional rollback of persisted material.
      keyPem:
        type: string
        x-nullable: true
        description: Private key in PEM. Required on POST/PUT. Persisted 0600 (key-at-rest). Never returned on GET.
      chainPem:
        type: string
        description: Optional intermediate-chain PEM appended after the leaf.
      hostnames:
        type: array
        items:
          type: string
        description: Output-only. SAN-DNS/CN auto-derived hostnames the certId registered into the SNI store. Ignored on POST/PUT.
  #----------------------------------------------
# Trace Parser Management Definitions
#----------------------------------------------
  TraceCatalogEntry:
    type: object
    required:
      - name
      - parser_type
      - sample_rate
      - enabled
    properties:
      name:
        type: string
        description: Name from the YAML catalog_name field, not the filename. The catalog-list operation is currently unwired, so this is not an available response field.
        example: "openai"
      parser_type:
        type: string
        description: Parser assigned to this catalog
        example: "openai"
      sample_rate:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
        description: Percentage of requests to trace (0-100)
        example: 100
      max_body_size:
        type: integer
        format: int32
        minimum: 0
        description: YAML capture limit in bytes. The loader replaces zero with 16384 and rejects values above 10 MiB; zero is not unlimited. The catalog-list operation is currently unwired.
        example: 65536
      enabled:
        type: boolean
        description: Whether this catalog is currently active
        example: true
      version:
        type: string
        description: Catalog version for compatibility
        example: "1.0"
      description:
        type: string
        description: Human-readable description
        example: "OpenAI API tracing catalog"

  TraceParserInfo:
    type: object
    required:
      - name
      - version
      - protocol
    properties:
      name:
        type: string
        description: Metadata name returned by discovery, such as openai_v1, mcp_v1 or mock_parser. These differ from assignment keys openai, mcp and mock and must not be used interchangeably.
        example: "openai"
      version:
        type: string
        description: Parser version
        example: "1.0.0"
      protocol:
        type: string
        description: Protocol handled by parser
        example: "OpenAI API v1"
      supported_paths:
        type: array
        items:
          type: string
        description: URL paths this parser handles
        example:
          - "/v1/chat/completions"
          - "/v1/completions"
          - "/v1/embeddings"
      description:
        type: string
        description: Intended descriptive metadata; currently not populated by the parser-list handler.
        example: "Parses OpenAI API requests including GPT models, token usage, and streaming responses"
      capabilities:
        type: array
        items:
          type: string
        description: Intended capability metadata; currently not populated by the parser-list handler and not evidence of verified parser behavior.
        example:
          - "streaming"
          - "cost_estimation"
          - "tool_calls"

  CatalogParserMapping:
    type: object
    required:
      - catalog_id
    properties:
      catalog_id:
        type: integer
        minimum: 1
        maximum: 255
        description: Runtime catalog identifier assigned from the loaded catalog set, not a durable identity across changes to that set.
        example: 1
      catalog_name:
        type: string
        description: Catalog name from YAML
        example: "v1"
      parser_name:
        type: string
        description: Currently assigned parser
        example: "openai"
      parser_type:
        type: string
        description: Parser type from YAML configuration
        example: "openai"
  TraceParserUpdate:
    type: object
    required:
      - parser_name
    properties:
      parser_name:
        type: string
        description: Runtime assignment key (openai, mcp or mock), not the distinct metadata name returned by discovery. The mapping is runtime-only; parser existence is checked, but catalog existence is not established by this update.
        enum:
          - "openai"
          - "mcp"
          - "mock"
        example: "openai"

  L4TraceStats:
    type: object
    properties:
      total_events:
        type: integer
        format: int64
        description: Total L4 events emitted
        example: 15234
      sampled_events:
        type: integer
        format: int64
        description: Events that passed sampling
        example: 15234
      dropped_events:
        type: integer
        format: int64
        description: Ring buffer overflows
        example: 12
      tcp_events:
        type: integer
        format: int64
        description: TCP state changes
        example: 12500
      sctp_events:
        type: integer
        format: int64
        description: SCTP state changes
        example: 2734
      udp_events:
        type: integer
        format: int64
        description: UDP state changes
        example: 5678
      conn_new:
        type: integer
        format: int64
        description: New connections
        example: 1523
      conn_established:
        type: integer
        format: int64
        description: Established connections
        example: 1520
      conn_closed:
        type: integer
        format: int64
        description: Clean closes
        example: 1450
      conn_timeout:
        type: integer
        format: int64
        description: Timeout closes
        example: 45
      conn_reset:
        type: integer
        format: int64
        description: RST/ABORT closes
        example: 28
      conn_error:
        type: integer
        format: int64
        description: Error events
        example: 2

  L4TraceStatusResponse:
    type: object
    properties:
      enabled:
        type: boolean
        description: Reported enablement; false can be omitted. Default-looking status does not establish compiled support or usable maps.
        example: true
      sampling_rate:
        type: integer
        format: int64
        description: Reported sampling percentage. Explicit zero can be omitted by response serialization; absence is not proof of the enable operation's default of 100.
        example: 100
      config_version:
        type: integer
        format: int64
        description: Configuration version number
        example: 5
      stats:
        $ref: '#/definitions/L4TraceStats'

#----------------------------------------------
# PII Detection Definitions
#----------------------------------------------
  PIIConfigEntry:
    type: object
    description: >-
      Stored settings, not scanner-readiness evidence. Requires piidetection and
      an initialized manager. Omission generally preserves values; empty strings
      do not clear them. Known gaps are documented on the affected fields below.
      Numeric int64 settings are narrowed to uint32 without upper bounds, and
      min_body_size <= max_body_size is not validated. Configuration success
      does not establish encryption, complete-body inspection, or protection.
    properties:
      mode:
        type: string
        description: Detection mode (detect, mask, redact, anonymize)
        enum:
          - detect
          - mask
          - redact
          - anonymize
        example: "mask"
      direction:
        type: string
        description: Scan direction (both, request, response)
        enum:
          - both
          - request
          - response
        example: "both"
      fail_mode:
        type: string
        description: Behavior when Presidio is unavailable (open, closed)
        enum:
          - open
          - closed
        example: "open"
      scan_mode:
        type: string
        description: Intended large-message mode, currently dropped by this handler. The consumer skips oversized input in full mode or truncates to configured max_body_size in truncate mode, not invariably 64KB.
        enum:
          - full
          - truncate
        example: "truncate"
      analyzer_url:
        type: string
        description: Stored gRPC endpoint. The reviewed client uses insecure transport credentials; storage does not establish connectivity, TLS protection, or successful live reconfiguration.
        example: "localhost:50051"
      anonymizer_url:
        type: string
        description: Optional stored endpoint; the reviewed Go bridge uses the analyzer client rather than configuring a separate anonymizer connection.
        example: "localhost:50051"
      score_threshold:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        description: Stored threshold, including explicit zero. AnonymizeJSON reads this value, but legacy Analyze sends 0.5; uniform threshold enforcement is not established.
        example: 0.7
      timeout_ms:
        type: integer
        format: int64
        minimum: 0
        description: Stored milliseconds, including explicit zero. The current reconfiguration bridge does not apply this value to the client's five-second RPC timeout; zero is not a proven disable or unlimited setting.
        example: 100
      max_body_size:
        type: integer
        format: int64
        minimum: 0
        description: Stored byte bound, including explicit zero. Eligibility also checks HTTP-buffer length and content type; this does not guarantee inspection of every complete body or validate the relation to min_body_size.
        example: 65536
      min_body_size:
        type: integer
        format: int64
        minimum: 0
        description: Stored minimum byte bound, including explicit zero. The consumer checks HTTP-buffer length; the relation to max_body_size is not validated.
        example: 100
      circuit_breaker:
        $ref: '#/definitions/PIICircuitBreaker'
      retry:
        $ref: '#/definitions/PIIRetry'
      # === V2 API Fields ===
      enable_v2:
        type: boolean
        description: Intended v2 selector, currently dropped by the handler. Supplying it does not enable v2 processing; no performance improvement is established by this API.
        example: true
      default_operator:
        type: string
        description: Intended v2 operator, currently dropped by the handler. Selecting encrypt does not configure encryption or imply use of encryption_key.
        enum:
          - replace
          - redact
          - hash
          - mask
          - encrypt
        example: "encrypt"
      encryption_key:
        type: string
        description: Intended v2 encryption input, currently dropped by the handler. Base64 decoding, AES-256 key-length validation, and encryption using this value are not implemented on this path.
        example: "YourBase64EncodedKey32BytesLong="
      batch_size:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        description: Intended v2 batch size, currently dropped by the handler. The declared range does not establish batch-processing support through this endpoint.
        example: 10

  PIICircuitBreaker:
    type: object
    description: >-
      Stored C-scanner settings. Omission preserves values; explicit zero is
      accepted but ignored, not a disable command. Defaults are 5 failures,
      60 seconds, and 3 successes. Values are narrowed to uint32 without upper bounds.
    properties:
      threshold:
        type: integer
        format: int64
        minimum: 0
        description: Number of failures before opening circuit
        example: 5
      timeout_sec:
        type: integer
        format: int64
        minimum: 0
        description: Time to wait before attempting half-open (seconds)
        example: 60
      success_threshold:
        type: integer
        format: int64
        minimum: 0
        description: Number of successes needed to close circuit
        example: 3

  PIIRetry:
    type: object
    description: >-
      Stored C-scanner settings. Explicit zero is ignored by the manager, so
      max_retries=0 cannot currently disable retries. Defaults are one retry and
      100 ms backoff; the consumer waits backoff_ms times the attempt number.
      Values are narrowed to uint32 without upper bounds.
    properties:
      max_retries:
        type: integer
        format: int64
        minimum: 0
        description: Maximum number of retry attempts
        example: 1
      backoff_ms:
        type: integer
        format: int64
        minimum: 0
        description: Backoff time between retries (milliseconds)
        example: 100

  PIIURLPatternsEntry:
    type: object
    description: >-
      Ordered update with required mode. clear ignores patterns; replace with
      omitted/empty patterns clears the list; add appends. Empty configuration
      scans all eligible URLs. A nonempty list is an include list with first
      match winning, so an exclude-only list scans nothing. The resulting limit
      is 64 entries; excess count currently maps to generic 500. Null entries
      can pass generated validation and be dereferenced by the handler.
    required:
      - mode
    properties:
      mode:
        type: string
        description: Pattern update mode (add, replace, clear)
        enum:
          - add
          - replace
          - clear
        example: "replace"
      patterns:
        type: array
        items:
          $ref: '#/definitions/PIIURLPattern'
        description: List of URL patterns (max 64)

  PIIURLPattern:
    type: object
    description: >-
      Ordered include/exclude matcher, not an independent exclusion override.
      The first matching entry decides. Text beyond 127 bytes can be truncated
      in fixed-size storage; length and pattern syntax are not fully validated.
    required:
      - pattern
    properties:
      pattern:
        type: string
        description: URL pattern with wildcards (e.g., /v1/chat/*, /api/*)
        example: "/v1/chat/*"
      is_exclude:
        type: boolean
        description: Exclude pattern (true) or include pattern (false)
        example: false

  PIIStatusResponse:
    type: object
    description: >-
      Stored configuration, not scanner readiness. scan_mode is not mapped by
      the handler; optional zero/false fields can be omitted. V2/encryption
      settings are neither returned nor applied by the configuration handler.
      Without the compiled feature or initialized manager, status fails.
    properties:
      enabled:
        type: boolean
        description: Whether PII detection is enabled
        example: true
      mode:
        type: string
        description: Current detection mode
        example: "mask"
      direction:
        type: string
        description: Current scan direction
        example: "both"
      fail_mode:
        type: string
        description: Current fail mode
        example: "open"
      scan_mode:
        type: string
        description: Current large body handling mode
        example: "truncate"
      analyzer_url:
        type: string
        description: Analyzer endpoint
        example: "localhost:50051"
      anonymizer_url:
        type: string
        description: Anonymizer endpoint
        example: "localhost:50051"
      score_threshold:
        type: number
        format: float
        description: Current confidence threshold
        example: 0.7
      timeout_ms:
        type: integer
        format: int64
        description: Request timeout
        example: 100
      max_body_size:
        type: integer
        format: int64
        description: Maximum body size to scan
        example: 65536
      min_body_size:
        type: integer
        format: int64
        description: Minimum body size to scan
        example: 100
      circuit_breaker:
        $ref: '#/definitions/PIICircuitBreaker'
      retry:
        $ref: '#/definitions/PIIRetry'
      url_patterns:
        type: array
        items:
          $ref: '#/definitions/PIIURLPattern'
        description: Current URL patterns
      url_pattern_count:
        type: integer
        format: int64
        description: Number of configured URL patterns
        example: 3

  PIIStatsResponse:
    type: object
    description: >-
      Unimplemented management telemetry. All four values are hard-coded zero
      and currently serialize as an empty object, including without a manager.
      This is not evidence of zero scans, detections, blocks, or errors.
    properties:
      total_scans:
        type: integer
        format: int64
        description: Total number of PII scans performed
        example: 1523
      pii_detected:
        type: integer
        format: int64
        description: Number of requests with PII detected
        example: 245
      pii_blocked:
        type: integer
        format: int64
        description: Number of requests blocked due to PII
        example: 12
      errors:
        type: integer
        format: int64
        description: Number of scan errors
        example: 8

#----------------------------------------------
# LlamaFirewall AI Security Definitions
#----------------------------------------------
  LlamaFirewallConfigEntry:
    type: object
    description: >-
      Stored settings, not verified active policy. Omitted nullable fields
      preserve values; explicit booleans are stored. Timeout, cache, connection
      pool, fail-policy, threshold, and scanner-selection settings are not
      connected end-to-end to the reviewed consumer. The RPC client uses a fixed
      15-second timeout and insecure transport. The HTTP error path continues
      processing after scan failures, and oversized scan content also follows
      an allow/error path. Fail-closed protection is not currently guaranteed;
      implementation correction is required, not client reinterpretation.
    properties:
      server_url:
        type: string
        description: LlamaFirewall gRPC server URL
        example: "localhost:50052"
      timeout_sec:
        type: integer
        format: int64
        minimum: 1
        maximum: 300
        description: Request timeout in seconds (for ML models)
        example: 15
        x-nullable: true
      fail_closed:
        type: boolean
        description: Intended error policy, stored but not reliably enforced by the HTTP consumer. true does not currently guarantee blocking on scanner errors; do not claim fail-closed protection from this setting.
        example: false
        x-nullable: true
      block_threshold:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        description: Intended blocking threshold. Zero is accepted but ignored by the manager, and the stored value is not connected to the C policy configuration; effective threshold enforcement is not established.
        example: 0.9
        x-nullable: true
      cache_enabled:
        type: boolean
        description: Enable response caching for identical requests
        example: true
        x-nullable: true
      cache_ttl_sec:
        type: integer
        format: int64
        minimum: 0
        description: Stored cache TTL in seconds. Explicit zero is ignored, and this setting is not connected to caching in the reviewed RPC consumer.
        example: 300
        x-nullable: true
      connection_pool_size:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        description: Number of reusable gRPC connections
        example: 10
        x-nullable: true
      scan_patterns:
        type: array
        items:
          type: string
        description: Intended inclusion patterns, currently discarded by the manager. Supplied patterns do not restrict scanning through this setting.
        example: ["/api/v1/chat*", "/api/*/code"]
      skip_patterns:
        type: array
        items:
          type: string
        description: Intended exclusions, currently discarded by the manager. Supplying a path does not guarantee exclusion from scanning.
        example: ["/health", "/metrics"]

  LlamaFirewallScannersEntry:
    type: object
    description: >-
      Stored flags; omission preserves values and false is stored. Current
      request scanning nevertheless selects prompt_guard and regex directly,
      rather than consuming these flags. A response-scanning function exists
      but no production caller was located. These switches do not establish
      implemented end-to-end scanner selection.
    properties:
      prompt_guard:
        type: boolean
        description: Enable PromptGuard (ML-based prompt injection detection)
        example: true
        x-nullable: true
      code_shield:
        type: boolean
        description: Enable CodeShield (insecure code pattern detection)
        example: true
        x-nullable: true
      regex:
        type: boolean
        description: Enable Regex (credential/API key leak detection)
        example: true
        x-nullable: true
      hidden_ascii:
        type: boolean
        description: Enable HiddenASCII (zero-width/invisible character detection)
        example: true
        x-nullable: true
      agent_alignment:
        type: boolean
        description: Enable AgentAlignment (AI agent misalignment detection)
        example: false
        x-nullable: true
      pii_detection:
        type: boolean
        x-nullable: true
        description: Enable PII Detection (complementary to Presidio)
        example: false

  LlamaFirewallStatusResponse:
    type: object
    description: >-
      Stored configuration plus incomplete tracked status, not a readiness probe.
      connected and last_health_check are not connected to the active client;
      pattern arrays are discarded and timeout/pool-size readback is absent.
      The disabled build can return inert status successfully. Optional false
      or zero fields may be omitted; configured values do not prove enforcement.
    properties:
      enabled:
        type: boolean
        description: Whether LlamaFirewall scanning is enabled
        example: true
      server_url:
        type: string
        description: Configured server URL
        example: "localhost:50052"
      connected:
        type: boolean
        description: Connection status to gRPC server
        example: true
      fail_closed:
        type: boolean
        description: Current fail policy
        example: false
      block_threshold:
        type: number
        format: float
        description: Current block threshold
        example: 0.9
      scanners:
        $ref: '#/definitions/LlamaFirewallScannersStatus'
      cache_enabled:
        type: boolean
        description: Cache status
        example: true
      cache_ttl_sec:
        type: integer
        format: int64
        description: Cache TTL
        example: 300
      scan_patterns:
        type: array
        items:
          type: string
        description: Active scan patterns
      skip_patterns:
        type: array
        items:
          type: string
        description: Active skip patterns
      last_health_check:
        type: string
        description: Last health check timestamp (RFC3339)
        example: "2025-01-10T10:30:00Z"

  LlamaFirewallScannersStatus:
    type: object
    description: Stored flag readback only; current request scanning hard-codes prompt_guard and regex. These values do not establish which scanners run.
    properties:
      prompt_guard:
        type: boolean
        description: PromptGuard enabled
        example: true
      code_shield:
        type: boolean
        description: CodeShield enabled
        example: true
      regex:
        type: boolean
        description: Regex enabled
        example: true
      hidden_ascii:
        type: boolean
        description: HiddenASCII enabled
        example: true
      agent_alignment:
        type: boolean
        description: AgentAlignment enabled
        example: false
      pii_detection:
        type: boolean
        description: PII Detection enabled
        example: false

  LlamaFirewallStatsResponse:
    type: object
    description: >-
      Management telemetry is not connected to scanner counters. Values come
      from an unpopulated object, including in the disabled build. Zero or
      omitted values do not prove no scans, threats, blocks, errors, or cache use.
    properties:
      total_scans:
        type: integer
        format: int64
        description: Total number of scans performed
        example: 2456
      requests_scanned:
        type: integer
        format: int64
        description: User requests scanned (PromptGuard+Regex)
        example: 1523
      responses_scanned:
        type: integer
        format: int64
        description: AI responses scanned (CodeShield+Regex)
        example: 933
      threats_detected:
        type: integer
        format: int64
        description: Total threats detected across all scanners
        example: 47
      requests_blocked:
        type: integer
        format: int64
        description: Requests blocked due to threats
        example: 12
      scan_errors:
        type: integer
        format: int64
        description: Number of scan errors
        example: 3
      avg_latency_ms:
        type: integer
        format: int64
        description: Average scan latency in milliseconds
        example: 85
      cache_hits:
        type: integer
        format: int64
        description: Number of cache hits
        example: 542
      scanner_stats:
        $ref: '#/definitions/LlamaFirewallScannerStats'
      decisions:
        $ref: '#/definitions/LlamaFirewallDecisionStats'

  LlamaFirewallScannerStats:
    type: object
    description: Per-scanner telemetry placeholders; a member's presence does not establish that its scanner ran.
    properties:
      prompt_guard:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      code_shield:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      regex:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      hidden_ascii:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      agent_alignment:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      pii_detection:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'

  LlamaFirewallIndividualScannerStats:
    type: object
    description: Placeholder values, not measured scan, detection, latency, or error evidence in this management path.
    properties:
      scans:
        type: integer
        format: int64
        description: Number of scans by this scanner
        example: 1523
      detections:
        type: integer
        format: int64
        description: Threats detected by this scanner
        example: 15
      avg_latency_ms:
        type: integer
        format: int64
        description: Average latency for this scanner
        example: 45
      errors:
        type: integer
        format: int64
        description: Errors from this scanner
        example: 1

  LlamaFirewallDecisionStats:
    type: object
    description: Unpopulated decision counters. hitl does not establish an implemented human-review workflow or enforcement action.
    properties:
      allow:
        type: integer
        format: int64
        description: Number of ALLOW decisions
        example: 2397
      block:
        type: integer
        format: int64
        description: Number of BLOCK decisions
        example: 12
      hitl:
        type: integer
        format: int64
        description: Number of Human-In-The-Loop decisions
        example: 47

  LlamaFirewallHealthResponse:
    type: object
    description: >-
      Intended health response. Current behavior reads tracked state rather than
      probing the scanner, and no updater from the active client was located.
      Unhealthy results use the generic error envelope instead of this schema;
      latency_ms is not measured probe latency. This is not readiness attestation.
    properties:
      healthy:
        type: boolean
        description: Overall health status
        example: true
      server_url:
        type: string
        description: Server URL checked
        example: "localhost:50052"
      connected:
        type: boolean
        description: Connection status
        example: true
      latency_ms:
        type: integer
        format: int64
        description: Health check latency
        example: 12
      message:
        type: string
        description: Health check message
        example: "LlamaFirewall server is healthy"
      timestamp:
        type: string
        description: Health check timestamp (RFC3339)
        example: "2025-01-10T10:30:00Z"

  ApiKeyCreateRequest:
    type: object
    description: >-
      Management creation of a data-plane credential; management authorization
      and data-plane enforcement are separate. Protection requires a service
      requiring API-key authentication. Quotas lack complete nonnegative/range
      validation. Whitespace-only tenant IDs are rejected but surrounding spaces
      are retained. Empty allowed_models permits all models; otherwise matching
      is exact. Embedded commas do not round-trip as one model identifier.
    required:
      - tenant_id
    properties:
      tenant_id:
        type: string
        description: Tenant identifier that owns this key
      name:
        type: string
        description: Human-readable label for the API key
      api_key:
        type: string
        description: >-
          Optional imported credential; absent or empty generates a new key.
          Imports require 16-512 printable non-space ASCII bytes. GET/list never
          returns the credential. Create currently emits an empty raw_key string
          for imports, not omission. Length rejection maps to 400; invalid
          character errors currently fall through to generic 500.
      allowed_models:
        type: array
        items:
          type: string
        description: List of model identifiers this key may access
      rate_limit_rps:
        type: integer
        format: int64
        description: Maximum requests per second allowed for this key
      burst_size:
        type: integer
        format: int64
        description: Total request-bucket capacity, not additional capacity above RPS. Zero uses per-key RPS. Nonpositive RPS skips this limiter; negative-value validation remains incomplete.
      tokens_per_min:
        type: integer
        format: int64
        description: Stored per-key token-quota metadata; enforcement is not connected in the reviewed token-accounting consumer. Tenant and tenant/model quotas are separate.
      expires_at:
        type: string
        format: date-time
        description: Optional RFC3339 expiry. Omitted, zero-time, or Unix-epoch values mean no expiry in this handler. Other past timestamps are accepted, so successful creation does not establish a currently usable key.
      enabled:
        type: boolean
        x-nullable: true
        description: Whether the API key is active. Absent = enabled (optional, nullable to distinguish unset).

  ApiKeyCreateResponse:
    type: object
    description: >-
      HTTP 201 creation result. key_id is the management handle. raw_key contains
      a secret only for generated credentials and is currently empty for imports.
      Protect generated secrets from logs; subsequent reads expose metadata only.
    required:
      - raw_key
      # key_id is always set by the create handler, so it must serialize
      # unconditionally; without 'required' go-swagger emits omitempty and a
      # client has to null-check a field the server never omits.
      - key_id
    properties:
      raw_key:
        type: string
        description: Generated plaintext credential returned only at creation; currently an empty string, not omission, when the caller imported api_key.
      key_id:
        type: string
        description: Unique identifier of the created API key

  ApiKeySummary:
    type: object
    description: >-
      Metadata, not effective service-enforcement status. enabled=false is
      explicitly serialized; optional zero metadata can be absent. A list without
      nonempty tenant_id returns all keys; viewer authorization is not tenant
      scoped. DELETE permanently removes the key and returns 204, not reversible
      disabling. Per-key token-quota enforcement is not connected.
    required:
      # enabled must always serialize: a disabled key (enabled=false) is still
      # listed/returned by the management endpoints, and the operator relies on
      # this flag to tell it apart. Without 'required', go-swagger emits
      # omitempty and false would be dropped from the JSON.
      - enabled
    properties:
      key_id:
        type: string
        description: Unique identifier of the API key
      tenant_id:
        type: string
        description: Tenant that owns this key
      name:
        type: string
        description: Human-readable label for the API key
      allowed_models:
        type: array
        items:
          type: string
        description: List of model identifiers this key may access
      rate_limit_rps:
        type: integer
        format: int64
        description: Maximum requests per second allowed for this key
      burst_size:
        type: integer
        format: int64
        description: Total request-bucket capacity, not additional capacity above RPS. Nonpositive burst uses per-key RPS; nonpositive RPS skips that limiter.
      tokens_per_min:
        type: integer
        format: int64
        description: Stored metadata, not an enforced per-key token quota in the reviewed consumer. Tenant and tenant/model token limits are separate.
      created_at:
        type: string
        format: date-time
        description: Timestamp when the key was created
      expires_at:
        type: string
        format: date-time
        description: Optional expiry timestamp (RFC3339)
      enabled:
        type: boolean
        description: Whether this key is currently active

  TenantRateLimitMod:
    type: object
    description: >-
      POST replaces aggregate rps, tokens_per_min, and burst_pct; omission becomes
      zero, not preservation. Supplied model_limits are individual upserts or
      removals; omitted/empty model_limits preserves existing model rows.
      Aggregate and model writes are sequential, not one transaction, so failure
      can leave partial changes. Blank identifiers and malformed model entries
      are not consistently rejected as 400. Configuration alone does not enable
      enforcement on a service.
    required:
      - tenant_id
    properties:
      tenant_id:
        type: string
        description: Tenant identifier
      rps:
        type: integer
        format: int64
        description: Maximum requests per second for the tenant
      tokens_per_min:
        type: integer
        format: int64
        description: Maximum LLM tokens per minute for the tenant
      burst_pct:
        type: integer
        format: int64
        description: Token bucket capacity as a percent of tokens_per_min; 0 uses the server default
      model_limits:
        type: array
        description: Per-model token quotas for the tenant
        items:
          $ref: '#/definitions/TenantModelRateLimit'

  TenantModelRateLimit:
    type: object
    description: >-
      A nonempty model is required by the handler despite the schema's optional
      property. Storage rejects '|' in tenant/model names. Zero, including an
      omitted tokens_per_min, removes the model quota. Negative values currently
      also remove it; that is not an approved negative-quota policy. Repeated
      model entries are applied in order, with the last successful write winning.
    properties:
      model:
        type: string
        description: Model name the quota applies to
      tokens_per_min:
        type: integer
        format: int64
        description: Maximum LLM tokens per minute for this tenant and model; 0 removes the model quota

  TenantRateLimitEntry:
    type: object
    description: >-
      Stored quotas, not enforcement status. Missing aggregate and model records
      produce 404; model-only state may lack an aggregate update timestamp.
      Zero aggregate rates disable their limiter while model quotas remain
      separate. burst_pct controls token capacity, not request-rate burst;
      zero uses the server default and positive values are clamped to 1-1000.
    required:
      - tenant_id
    properties:
      tenant_id:
        type: string
        description: Tenant identifier
      rps:
        type: integer
        format: int64
        description: Maximum requests per second for the tenant
      tokens_per_min:
        type: integer
        format: int64
        description: Maximum LLM tokens per minute for the tenant
      burst_pct:
        type: integer
        format: int64
        description: Token bucket capacity as a percent of tokens_per_min; 0 uses the server default
      model_limits:
        type: array
        description: Per-model token quotas for the tenant
        items:
          $ref: '#/definitions/TenantModelRateLimit'
      updated_at:
        type: string
        format: date-time
        description: Timestamp of the last rate limit update

  OPAWatcherConfig:
    type: object
    description: >-
      Full replacement of the singleton OPA watcher configuration, not a patch.
      Acceptance starts background polling; it does not prove a successful fetch
      or firewall application. The current internal applier uses localhost HTTP
      without a management credential, so authenticated management deployments
      require implementation reconciliation before enforcement can be claimed.
    required:
      - opa_url
    properties:
      opa_url:
        type: string
        description: >-
          OPA server URL with a hostname. Current admission checks a limited
          IPv4 blocklist only; it does not provide comprehensive IPv6,
          redirect, or DNS-rebinding protection. This is an unresolved outbound
          security limitation, not a qualified SSRF prevention guarantee.
      policy_path:
        type: string
        description: OPA data path; omitted or empty uses loxilb/l4. Leading slashes are removed before appending the path after /v1/data/.
        default: "loxilb/l4"
      poll_interval_sec:
        type: integer
        description: >-
          Polling interval in seconds; omitted or nonpositive uses 30. The
          initial poll starts after the current 10-second initial delay.
          Positive values need an overflow-safe product bound before conversion
          to time.Duration; that upper-bound validation is not implemented.
        default: 30
      fail_open:
        type: boolean
        description: >-
          Intended OPA failure-policy declaration. The current watcher stores
          and reports this flag but does not implement distinct fail-open
          behavior; fetch failures retain the previously applied state for
          either value. False does not implement a deny-all fallback. Policy
          semantics and enforcement require implementation reconciliation.
        default: false

  OPAWatcherStatus:
    type: object
    properties:
      opa_url:
        type: string
        description: Configured OPA server URL
      policy_path:
        type: string
        description: Configured OPA policy path
      poll_interval_sec:
        type: integer
        description: Configured polling interval in seconds
      fail_open:
        type: boolean
        description: Stored fail_open declaration; the current failure path does not consume it and retains existing applied rules for either value.
      status:
        type: string
        description: Watcher lifecycle state (running, stopped, not_configured). Running means polling was started, not that policy synchronization succeeded.
      last_sync_at:
        type: string
        format: date-time
        description: Timestamp of the latest cycle reaching the end of apply, including partial apply failures. Consult last_error; this timestamp does not prove complete or durable synchronization.
      rules_count:
        type: integer
        description: Number of rules in the watcher cache, including loaded cached state. This is not a live firewall or dataplane readback.
      circuit_breaker_state:
        type: integer
        description: Policy-fetch circuit breaker state (0=closed, 1=open, 2=half-open). This is distinct from the fullproxy endpoint circuit breaker.
      last_error:
        type: string
        description: Last error message if any

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
security:
  - BearerAuth: [] # Global security applied to all endpoints by default
