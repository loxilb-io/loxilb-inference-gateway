name: AI-Gateway-Sanity-CI

# Builds loxilb-inference-gateway from source (Go + eBPF), overlays the fresh
# binary onto the container image, and runs the self-contained AI-gateway CICD
# scenarios that need only loxilb + local mock/echo backends (no GPU, no cloud,
# no external 3rd-party service). Scenarios that require published backend
# images (vllm-server / mcp-server / grpc) are listed under workflow_dispatch.

on:
  push:
    branches:
      - main
    paths:
      - 'cicd/vllm-**'
      - 'cicd/sglang-**'
      - 'cicd/trtllm-**'
      - 'cicd/llamacpp-**'
      - 'cicd/ai-**'
      - 'cicd/common/reflect-echo/**'
      - 'cicd/sockmap-fullproxy/**'
      - 'pkg/**'
      - 'api/**'
      - '.github/workflows/ai-gateway-sanity.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cicd/vllm-**'
      - 'cicd/sglang-**'
      - 'cicd/trtllm-**'
      - 'cicd/llamacpp-**'
      - 'cicd/ai-**'
      - 'cicd/common/reflect-echo/**'
      - 'cicd/sockmap-fullproxy/**'
      - 'pkg/**'
      - 'api/**'
      - '.github/workflows/ai-gateway-sanity.yml'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'AI Gateway Sanity'

jobs:
  ai-gateway-sanity:
    name: ai-gateway-sanity
    runs-on: ubuntu-22.04
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.18.0'
      - run: sudo apt-get update
      - run: sudo apt-get -y install clang llvm libelf-dev gcc-multilib libpcap-dev linux-tools-$(uname -r) elfutils dwarves git libbsd-dev bridge-utils unzip build-essential bison flex iperf iproute2 nodejs socat ethtool libjson-c-dev libnghttp2-dev
      - name: Install libtokenizers (KV-router HF backend)
        run: arch=$(dpkg --print-architecture) && wget -q https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-${arch}.tar.gz -O /tmp/libtokenizers.tar.gz && sudo tar -xzf /tmp/libtokenizers.tar.gz -C /usr/local/lib/ && rm /tmp/libtokenizers.tar.gz
      - name: Install KV publisher python deps (pyzmq/msgpack/cbor2/xxhash/transformers)
        # The sglang/vllm KV scenarios drive kv_event_publisher.py, which imports these.
        # A fresh runner has none of them and apt for the native modules is unreliable
        # here, so install to the system site (visible to the root publisher launched via
        # `ip netns exec`) from prebuilt manylinux wheels. config.sh re-probes as a fallback.
        run: sudo python3 -m pip install pyzmq msgpack cbor2 xxhash transformers || sudo python3 -m pip install --break-system-packages pyzmq msgpack cbor2 xxhash transformers
      - name: Install python h2 (ai-jwtauth HTTP/2 client and echo backend)
        # ai-jwtauth's h2c echo backend, multiplexed client and raw recorder all
        # import h2, and config.sh fails closed when it is missing rather than
        # quietly dropping the HTTP/2 legs. Install to the system site: the
        # mocks are launched as root through `ip netns exec`.
        run: sudo python3 -m pip install h2 || sudo python3 -m pip install --break-system-packages h2
      - run: loxilb-ebpf/utils/mkllb_bpffs.sh
      - run: sudo -E env "PATH=$PATH" make
      # minica (github.com/jsha/minica) is fetched on demand by the TLS scenarios' config.sh
      - run: sudo -E env "PATH=$PATH" GOBIN=/usr/local/bin go install github.com/jsha/minica@latest
      # Gateway image: pull the published one, or build locally when not yet published
      # The GHCR image is public; authenticate anyway (GHCR_TOKEN when present,
      # else the built-in token) to avoid anonymous pull rate limits and the
      # fragile full from-source docker build fallback.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - run: docker pull ghcr.io/loxilb-io/loxilb-inference-gateway:latest || docker build -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      # reflect-echo backend image (KV-cache scenarios) — always built from the local context
      - run: bash cicd/common/reflect-echo/docker-build.sh
      - run: docker run -u root --cap-add SYS_ADMIN --restart unless-stopped --privileged -dit -v /dev/log:/dev/log --name loxilb ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: pwd && ls && sudo -E env "PATH=$PATH" make docker-cp
      - run: docker exec -dit loxilb mkllb_bpffs
      - run: id=`docker ps -f name=loxilb | cut -d " " -f 1 | grep -iv "CONTAINER"` && docker commit $id ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: docker stop loxilb && docker rm loxilb

      # --- Self-contained scenarios (loxilb + local mock/echo backends) ---
      # NOTE: cicd/vllm-kvcache-routing-cpu is intentionally NOT gated here. Its
      # strict fixture-driven asserts (exact tokenizer-overlap fallthrough timing)
      # are sensitive to hosted-runner state; that real-vLLM CPU harness is
      # exercised out-of-band (manual runs) rather than in this workflow.
      # The stable CI set below mirrors cicd/run_local_cicd.sh.
      - name: Prefill/Decode disaggregation (mock vLLM)
        run: |
          cd cicd/vllm-pd-disagg/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: SGLang P/D dual-dispatch disaggregation (mock SGLang)
        run: |
          cd cicd/sglang-pd-disagg/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: TRT-LLM P/D rewriter-dialect disaggregation (mock TRT-LLM)
        run: |
          cd cicd/trtllm-pd-disagg/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: llama.cpp typed plain-LB affinity + guards (mock llama.cpp)
        run: |
          cd cicd/llamacpp-lb/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: SGLang KV-cache-aware routing (echo backends)
        run: |
          cd cicd/sglang-loxilb-kvcache/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Model-name routing
        run: |
          cd cicd/ai-model-routing/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      # The other half of the model contract: one body-first resolution shared
      # by authorization and routing, and a hard 400 when the body and the
      # X-Model header disagree. It ran only in the local runner, so a change
      # that agreed with the router but disagreed with the authorizer reached
      # main ungated.
      - name: Effective-model contract on enforcing services
        run: |
          cd cicd/ai-model-conflict/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Endpoint health fans out to every pool (address-keyed)
        run: |
          cd cicd/ai-ephealth/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: SSE streaming quota
        run: |
          cd cicd/ai-sse-quota/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: API keys + tenant rate limits (PostgreSQL-backed)
        run: |
          cd cicd/ai-apikey/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      # The bearer (JWT) admission arm against a real Keycloak realm: the token
      # verdict ladder, apikey-or-jwt precedence, upstream header hygiene, the
      # HTTP/2 admission legs, the keyless VIP quota arm and the missing-usage
      # accounting arm. 69 declared case IDs with a Z1/Z2 inventory, so a case
      # that stops running turns the step red instead of shrinking the count.
      #
      # It ran only in the local runner until now, which left the largest AI
      # regression suite in the tree gating no pull request. Measured cost on
      # the reference bed: 84s config + 77s validation + 16s cleanup, plus 43s
      # the first time it builds the pinned Keycloak image (config.sh builds it
      # on demand and reuses it afterwards). Keycloak and PostgreSQL are
      # locally built/pulled containers, so the job stays within this
      # workflow's no-external-service charter.
      - name: JWT bearer admission against a live Keycloak realm
        run: |
          cd cicd/ai-jwtauth/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Authentication plane separation (PostgreSQL key store, plaintext + TLS)
        run: |
          cd cicd/ai-authsep/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - run: echo "AI-gateway sanity complete"

# Related feature workflows: mcp-sanity.yml (MCP proxying),
# l7-proxy-sanity.yml (HTTPS/H1/H2/mTLS/prefix + gRPC),
# vllm-proxy-sanity.yml (real CPU-vLLM backends; scheduled — heavy image build).

  # The sockmap testbed is otherwise run by hand (see cicd/sockmap-fullproxy/README.md):
  # its acceleration suites need a kernel carrying the sk_psock_backlog fix, which
  # the hosted runners do not have. This suite drives a handful of small echoes
  # through a response-accelerated service, well under the volume where that defect
  # shows, and holds the per-direction contract for a service that declares
  # api_key_auth: the request direction is refused and stays on the relay, where the
  # credential is checked and X-Api-Key stripped on every keep-alive request; the
  # response direction is accepted and its bytes are redirected by the kernel. The
  # image is built from the Dockerfile (-DHAVE_SOCKOPS, the build --sockmapsupport
  # is documented for) rather than overlaid from the host build.
  sockmap-apikey-response-sanity:
    name: sockmap-apikey-response-sanity
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
      - run: sudo apt-get update
      - run: sudo apt-get -y install linux-tools-$(uname -r) linux-tools-common nodejs
      - run: loxilb-ebpf/utils/mkllb_bpffs.sh
      - name: Build the image the sockmap testbed starts (Dockerfile defaults)
        run: docker build -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      # The suite creates a key and drives keyed traffic, so the testbed brings
      # up its optional PostgreSQL key store (the same fixture cicd/ai-apikey
      # uses). Without the knob the suite refuses to start.
      - name: A declared api_key_auth keeps requests on the relay and accelerates responses
        env:
          SOCKMAP_AI_KEY_STORE: "1"
        run: |
          cd cicd/sockmap-fullproxy/
          ./config.sh
          ./validation_apikey_response.sh
          ./rmconfig.sh
          cd -
