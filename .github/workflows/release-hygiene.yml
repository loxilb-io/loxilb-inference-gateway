name: Release-Hygiene

# Repository hygiene gate: runs scripts/release-hygiene.sh over the PR's
# commit range and the tracked tree (AI attribution, internal identifiers,
# internal-doc links, tracked tooling artifacts). Blocking on every PR.
# The secret scan half of the script is covered by gitleaks.yml.

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene gate
    # Pinned rather than ubuntu-latest: on 2026-09-21 the hosted
    # ubuntu-latest pool stopped dispatching while explicit labels kept
    # starting within minutes, which stalled this required check on every
    # branch including main. ubuntu-latest resolves to 24.04 today, so this
    # is behaviour-neutral and only removes the dependency on that label.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene checks
        run: bash scripts/release-hygiene.sh --base "origin/${{ github.base_ref }}" --skip-gitleaks

      - name: Validate public Swagger contract metadata
        run: ruby scripts/validate-swagger-contract.rb
