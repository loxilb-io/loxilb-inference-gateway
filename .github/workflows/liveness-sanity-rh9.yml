name: Liveness-LB-Sanity-CI-RH9

on:
  #schedule:
  # Runs "At 20:00 UTC every day-of-week"
  #- cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Liveness LB Sanity Ubuntu 22'
       
jobs:
  build:
    name: liveness-lb-sanity-rh9
    runs-on: [self-hosted, redhat]
    if: github.repository == 'loxilb-io/loxilb'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - run: |
             cd cicd/tcplbmon/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/udplbmon/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/sctplbmon/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/tcplbmon6/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      # Per-endpoint counters survive a health flap of another endpoint (the rule is
      # re-programmed in place). Tears down whatever the verdict, keeps the
      # validation's exit code, and leaves llb1's logs in /tmp/ci-logs when red.
      - run: |
             cd cicd/tcplbmon-epstat/
             rc=0
             ./config.sh && ./validation.sh || rc=$?
             if [ $rc -ne 0 ]; then
               mkdir -p /tmp/ci-logs/tcplbmon-epstat
               for f in /tmp/loxilb.err /tmp/loxilb.out /var/log/loxilbdp.log; do docker cp "llb1:$f" /tmp/ci-logs/tcplbmon-epstat/ || true; done
             fi
             ./rmconfig.sh
             exit $rc
      - run: |
             cd cicd/tcplbepmod/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/httpsep/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - run: |
             cd cicd/http2ep/
             ./config.sh
             ./validation.sh
             ./rmconfig.sh
             cd -
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: liveness-lb-sanity-rh9-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ci-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Clean test-bed
        if: success() || failure()
        run: |
            sudo ip -all netns delete
            dps=$(sudo docker ps -a -q)
            if [[ x$dps != x ]]; then
              sudo docker stop $(sudo docker ps -a -q)
              sudo docker rm $(sudo docker ps -a -q)
            fi
            sudo docker image rm ghcr.io/loxilb-io/loxilb-inference-gateway:latest
