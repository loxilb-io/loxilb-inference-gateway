      description: >-
        Validates a policy, resolves its load-balancer ID, attaches its routes to an
        existing sockproxy listener, then stores the policy. The current attachment
        bridge supports IPv4; an existing LB resource alone does not establish an
        eligible listener. Success returns 204 without a policy body or generated ID.
        Duplicate policy IDs, including identical replay, and a second policy for the
        same LB ID return 409. No update or Gateway API export operation is performed.
        Implementation warnings on L7Policy, L7Rule and L7Action describe attachment
        identity, truncation and response-path gaps. A successful attach is source-level
        configuration evidence, not proof of effective matching, TLS responses or
        lifecycle safety. Policy ownership across LB resources sharing a listener
        remains unresolved.
