# LlamaFirewall AI Security Scanner Configuration
# LoxiLB integration for AI-specific security threats

[server]
# LlamaFirewall gRPC server address
# Default: localhost:50052 (avoid Presidio port 50051)
url = localhost:50052

# Request timeout in seconds
# PromptGuard ML model needs more time than simple scanners
# Default: 15 seconds
timeout = 15

[policy]
# Enable/disable LlamaFirewall scanning
# Default: true
enabled = true

# Fail-closed vs fail-open policy
# false = fail-open (allow requests on scanner error)
# true = fail-closed (block requests on scanner error)
# Recommended: false for high availability, true for high security
# Default: false
fail_closed = false

# Minimum confidence score to block (0.0-1.0)
# Higher = fewer false positives, but may miss some attacks
# Lower = more sensitive, but higher false positive rate
# Default: 0.9 (90% confidence required)
block_threshold = 0.9

[scanners]
# PromptGuard: Detect prompt injection attacks
# Uses ML model (BERT) - slower but very accurate
# Recommended: true for user-facing APIs
# Default: true
prompt_guard = true

# CodeShield: Detect insecure code patterns
# Scans AI-generated code for vulnerabilities
# Recommended: true for code generation endpoints
# Default: true
code_shield = true

# Regex: Pattern-based detection of credentials and sensitive data
# Very fast (<2ms), catches API keys, passwords, tokens
# Recommended: always true
# Default: true
regex = true

# HiddenASCII: Detect zero-width and invisible character attacks
# Very fast (<1ms), catches steganography and hidden commands
# Recommended: true
# Default: true
hidden_ascii = true

# AgentAlignment: Detect AI agent misalignment
# Expensive ML model, use only for agent-based systems
# Recommended: false unless using AI agents
# Default: false
agent_alignment = false

# PII Detection: Complementary to Presidio
# Use Presidio for PII instead (more comprehensive)
# Recommended: false (use Presidio instead)
# Default: false
pii_detection = false

[performance]
# Enable response caching for identical requests
# Reduces latency by 95% for repeated scans
# Default: true
cache_enabled = true

# Cache TTL in seconds
# How long to cache scan results
# Default: 300 (5 minutes)
cache_ttl = 300

# Connection pool size
# Number of reusable gRPC connections
# Default: 10
connection_pool_size = 10

[endpoints]
# URL patterns to scan (OpenAI-style selective scanning)
# Empty = scan all requests
# Examples:
#   /api/v1/chat*     - Chat endpoints
#   /api/*/code       - Code generation
#   /admin/*          - Admin endpoints
# Default: empty (scan all)
scan_patterns =

# URL patterns to skip scanning
# Use to exclude health checks, metrics, etc.
# Examples:
#   /health
#   /metrics
#   /api/v1/status
# Default: /health,/metrics
skip_patterns = /health,/metrics

[monitoring]
# Enable Prometheus metrics export
# Default: true
metrics_enabled = true

# Health check interval in seconds
# How often to ping LlamaFirewall server
# Default: 30
health_check_interval = 30

# Log scan decisions
# false = only log blocks
# true = log all decisions (allow + block)
# Default: false
log_all_decisions = false

# Log level: DEBUG, INFO, WARNING, ERROR
# Default: INFO
log_level = INFO
