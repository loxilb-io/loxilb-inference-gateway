name: Release

# Tag-triggered release pipeline. Produces the full artifact matrix:
#   - multi-arch (amd64+arm64) container images: Ubuntu 22.04 default + -u24 variant
#   - .deb / .rpm packages (amd64+arm64) via in-repo nfpm packaging
#   - binary tarballs (loxilb) per architecture
#   - SHA256SUMS over every non-image artifact
# Packages are validated by package-sanity before anything is attached to the
# GitHub release. Release-candidate tags (…-rc.N) publish as pre-releases and
# do NOT move the `latest` / `latest-u24` image tags.
#
# Tag scheme: vMAJOR.MINOR.PATCH[.BUILD][-rc.N], e.g. v0.9.8.7 or v0.9.8.7-rc.1
#
# AUTHORIZATION: the `authorize` job below targets the `release` Environment,
# which carries required reviewers. Every publishing job depends on it, so a
# tag push alone cannot ship anything — nothing reaches GHCR or the releases
# page until a maintainer approves the run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Existing tag to rebuild (images/packages only, no release page)'
        required: true

# One release at a time. Two tags in flight would race on the `latest` /
# `latest-u24` manifests, and the winner would be whichever finished last.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/loxilb-io/loxilb-inference-gateway

jobs:
  meta:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve tag and channel
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ github.event.inputs.tagName }}"
          fi
          # Validate before anything is built or published. The gateway follows
          # loxilb-io/loxilb's scheme: vMAJOR.MINOR.PATCH with an optional
          # fourth build component, plus an optional -rc.N prerelease suffix.
          #
          # The push trigger's `v*` glob already excludes loxilb-mcp's
          # `mcp/vX.Y.Z` tags, but workflow_dispatch takes a free-text tag name,
          # so this is the gate that actually stops a wrong or malformed tag
          # from producing a published release.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+){2,3}(-rc\.[0-9]+)?$'; then
            echo "::error::'${tag}' is not a valid release tag: expected vMAJOR.MINOR.PATCH[.BUILD][-rc.N] (e.g. v0.9.8.7 or v0.9.8.7-rc.1)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-rc.*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # Single approval choke point. Deliberately a standalone no-op job rather
  # than `environment:` on the build jobs themselves: those are matrices, and
  # gating each leg would demand repeated approvals and litter the Deployments
  # page with one record per leg. One gate, one record, one approval.
  authorize:
    name: authorize release
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - name: Approved
        run: echo "Publishing ${{ needs.meta.outputs.tag }} approved by ${{ github.actor }}."

  build-image:
    name: image ${{ matrix.variant }} ${{ matrix.arch }}
    needs: [meta, authorize]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: u22, dockerfile: Dockerfile,     suffix: '',     arch: amd64, runner: ubuntu-22.04 }
          - { variant: u22, dockerfile: Dockerfile,     suffix: '',     arch: arm64, runner: ubuntu-24.04-arm }
          - { variant: u24, dockerfile: Dockerfile.u24, suffix: '-u24', arch: amd64, runner: ubuntu-24.04 }
          - { variant: u24, dockerfile: Dockerfile.u24, suffix: '-u24', arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build WITHOUT pushing so the CVE gate below can reject the image before
      # it exists in the registry. Each matrix leg builds its own native
      # architecture, so `load: true` works without emulation.
      - name: Build per-arch image (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ needs.meta.outputs.tag }}${{ matrix.suffix }}-${{ matrix.arch }}
          # .dockerignore strips .git, so the Makefile cannot derive the version
          # inside the build. Without this the image would ship a binary
          # reporting "dev" under a tagged image name.
          build-args: |
            VERSION=${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=release-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Trivy gate (CRITICAL + fixable) — blocks publish
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.meta.outputs.tag }}${{ matrix.suffix }}-${{ matrix.arch }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Cache-warm rebuild of the identical image; every layer is a cache hit,
      # so this is a re-export rather than a second compile.
      - name: Push per-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.meta.outputs.tag }}${{ matrix.suffix }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=release-${{ matrix.variant }}-${{ matrix.arch }}

  merge-image:
    name: manifest ${{ matrix.variant }}
    needs: [meta, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Cosign signing + attestation OIDC
      attestations: write # record build-provenance / SBOM attestations
    strategy:
      matrix:
        include:
          - { variant: u22, suffix: '',     latest: latest }
          - { variant: u24, suffix: '-u24', latest: latest-u24 }
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        id: manifest
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          SUFFIX: ${{ matrix.suffix }}
          LATEST: ${{ matrix.latest }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}${SUFFIX}" \
            "${IMAGE}:${TAG}${SUFFIX}-amd64" \
            "${IMAGE}:${TAG}${SUFFIX}-arm64"
          if [ "$PRERELEASE" = "false" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:${LATEST}" \
              "${IMAGE}:${TAG}${SUFFIX}-amd64" \
              "${IMAGE}:${TAG}${SUFFIX}-arm64"
          fi
          docker buildx imagetools inspect "${IMAGE}:${TAG}${SUFFIX}"
          # Digest of the manifest list — the thing users actually pull, and so
          # the thing the signature and attestations must be bound to.
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}${SUFFIX}" \
                     --format '{{.Manifest.Digest}}')"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::could not resolve manifest digest (got '${DIGEST}')"; exit 1 ;;
          esac
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign manifest (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          # Auth forces syft's `registry:` source so it pulls the pushed digest
          # straight from GHCR rather than falling through to the docker daemon.
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-${{ matrix.variant }}.spdx.json
          # The action would otherwise try to attach the SBOM to the release by
          # re-downloading its own workflow artifact, which needs `actions: read`
          # — a permission this job does not hold. It fails only once a release
          # exists for the tag, i.e. on re-runs. Leave it off.
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom-${{ matrix.variant }}.spdx.json
          push-to-registry: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.variant }}
          path: sbom-${{ matrix.variant }}.spdx.json
          if-no-files-found: error

  build-packages:
    name: packages ${{ matrix.arch }}
    needs: [meta, authorize]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The monitoring tarball is arch-independent — built on the amd64 leg only.
          - { arch: amd64, runner: ubuntu-22.04, formats: 'deb,rpm,tarball,monitoring' }
          - { arch: arm64, runner: ubuntu-24.04-arm, formats: 'deb,rpm,tarball' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}

      - name: Install nfpm
        run: |
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_$(dpkg --print-architecture).deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build packages and tarball
        run: |
          packaging/build-pkgs.sh \
            --version "${{ needs.meta.outputs.tag }}" \
            --arch "${{ matrix.arch }}" \
            --from-docker \
            --formats "${{ matrix.formats }}" \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error

  package-sanity:
    name: package sanity
    needs: build-packages
    uses: ./.github/workflows/package-sanity.yml
    # Required: a called workflow gets NO secrets unless they are passed. Its
    # `plan` job logs in to GHCR with secrets.GHCR_TOKEN, which resolves empty
    # without this and fails the login — taking the whole gate down with it.
    secrets: inherit
    with:
      artifact_prefix: packages-

  trivy:
    name: image CVE gate
    needs: [meta, merge-image]
    uses: ./.github/workflows/trivy-image.yml
    # Same as above: trivy-image.yml's first step is a GHCR login using
    # secrets.GHCR_TOKEN. Without `secrets: inherit` the CVE gate cannot run
    # at all — and since the images are already pushed by then, a silent
    # failure here means published-but-unscanned images.
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      image-tag: ${{ needs.meta.outputs.tag }}

  release:
    name: publish release
    if: github.event_name == 'push'
    needs: [meta, merge-image, package-sanity, trivy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Kept out of dist/ on purpose: SHA256SUMS above covers the installable
      # artifacts, and folding the SBOMs into it would change what that file
      # has always meant.
      - uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
            sbom/*
          body: |
            LoxiLB Inference Gateway `${{ needs.meta.outputs.tag }}`.

            Container images (multi-arch, amd64+arm64):
            - `${{ env.IMAGE }}:${{ needs.meta.outputs.tag }}` (Ubuntu 22.04 base)
            - `${{ env.IMAGE }}:${{ needs.meta.outputs.tag }}-u24` (Ubuntu 24.04 base)

            Attached artifacts: `.deb` (Ubuntu 20.04/22.04/24.04), `.rpm`
            (RHEL/Rocky/Alma 9), binary tarballs, `SHA256SUMS`, and an SPDX
            SBOM per image variant. See the README for install instructions
            and the kernel baseline required by the eBPF datapath.

            Images are scanned for fixable CRITICAL CVEs before they are
            published, signed with Cosign (keyless), and carry SLSA build
            provenance and SBOM attestations. Verify with:

            ```
            cosign verify ${{ env.IMAGE }}:${{ needs.meta.outputs.tag }} \
              --certificate-identity-regexp '^https://github\.com/loxilb-io/loxilb-inference-gateway/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            gh attestation verify oci://${{ env.IMAGE }}:${{ needs.meta.outputs.tag }} --owner loxilb-io
            ```

            This is a fork of [loxilb-io/loxilb](https://github.com/loxilb-io/loxilb)
            with inference-aware L4/L7 routing for LLM serving fleets.
