  '/logs':
    get:
      summary: Fetch logs with optional filtering
      description: >
        Fetch log lines newest-first, paging backwards towards the start of the
        file. When level or keyword is set the server keeps reading backwards
        until the requested number of *matching* lines has been collected, the
        start of the file is reached, or the per-request scan cap (32 MiB) is
        hit — so has_more means "more matches may exist", not merely "more bytes
        exist". Offsets in next_cursor are byte offsets into the file the page
        was read from; for a .log.gz archive they address the uncompressed
        stream.
      parameters:
        - name: lines
          in: query
          required: false
          type: string
          description: Number of log lines to fetch (default is 100). With level or keyword set this is the number of matching lines.
        - name: level
          in: query
          required: false
          type: string
          description: Filter logs by level (e.g., INFO, ERROR, DEBUG). Matched as a substring, searched backwards across the whole file rather than within one page.
        - name: keyword
          in: query
          required: false
          type: string
          description: Filter logs containing a specific keyword or phrase. Matched as a substring, searched backwards across the whole file rather than within one page.
        - name: cursor
          in: query
          required: false
          type: string
          description: Opaque pagination cursor from a previous response's next_cursor; fetches the next page.
        - name: file
          in: query
          required: false
          type: string
          description: Specific log file to read (default is the current log file). Rotated .log.gz archives are accepted and decompressed transparently.
      responses:
        '200':
          description: Logs fetched successfully
          schema:
            $ref: '#/definitions/Logs'
        '400':
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/Error'

