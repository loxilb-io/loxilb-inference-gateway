# Default values for loxilb-inference-gateway (umbrella chart).
#
# Phase 1 is the core: the loxilb-igw data plane, the kube-loxilb controller
# and the Gateway API inference objects. Keycloak (JWT), SIEM (audit sink) and
# PostgreSQL (API-key store) arrive as further subcharts in later phases.
#
# Endpoint selection. By default loxilb selects endpoints itself: the policy is
# the InferencePool, its HTTPRoute and the loxilb.io/* annotations rendered from
# `inference` below, and the selector is loxilb's epselect (chwbl, gpuaware,
# wrr-hash), KV-exact and prefill/decode logic. With
# inference.externalEndpointPicker the gateway asks an Endpoint Picker (EPP)
# over ext_proc instead; this chart points the pools at it but does not deploy
# it (see there).

global:
  # Pull secrets applied to every pod of every subchart.
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Subcharts. Every key under loxilb-igw / kube-loxilb is passed through to
# charts/loxilb-igw/values.yaml and charts/kube-loxilb/values.yaml.
# ---------------------------------------------------------------------------
loxilb-igw:
  enabled: true
  # Everything else: charts/loxilb-igw/values.yaml (image, loxilb.* flags,
  # persistence, trust, mgmtService ...). Helm merges those defaults in here,
  # so the umbrella's hooks and tests see the effective values.
  # image:
  #   repository: ghcr.io/loxilb-io/loxilb-inference-gateway
  #   tag: v0.9.9.1

kube-loxilb:
  enabled: true
  # Everything else: charts/kube-loxilb/values.yaml.
  # The VIP pool kube-loxilb assigns Gateway addresses from. For fullproxy the
  # address must be one the loxilb node can bind, e.g. the node IP itself.
  cidrPools:
    defaultPool: 192.168.80.90/32
  # image:
  #   repository: ghcr.io/loxilb-io/kube-loxilb
  #   tag: latest      # the published :latest lacks integration/inference-gateway; build it
  # External loxilb instead of the in-cluster DaemonSet (with loxilb-igw.enabled=false):
  # loxiURL: ["http://192.168.80.90:11111"]

# ---------------------------------------------------------------------------
# CRDs. The Gateway API and Inference Extension CRDs belong to their own
# projects and are a cluster-wide version decision, so the chart does not ship
# them; the loxilb CRDs (loxiurl, bgppeer, egress, ...) are in
# charts/kube-loxilb/crds and follow Helm's crds/ rules (installed, never upgraded).
# ---------------------------------------------------------------------------
crds:
  # pre-install/pre-upgrade hook (weight -10): fails with a clear message when
  # the Gateway API or Inference Extension CRDs are missing, warns when their
  # bundle version differs from the tested one.
  precheck:
    enabled: true
    # Fail instead of warn on a bundle-version mismatch. An Inference Extension
    # older than v1.6.0 always fails: InferencePool.spec.endpointPickerRef is
    # required there, and this chart renders pools without one.
    strictVersion: false
    image:
      repository: alpine/k8s
      tag: 1.34.12
      pullPolicy: IfNotPresent
    backoffLimit: 0
    activeDeadlineSeconds: 600
    resources: {}
  # Convenience: have the hook `kubectl apply` the CRDs below instead of only
  # checking them. Needs Kubernetes >= 1.30 (Gateway API v1.5.1 uses CEL isIP()).
  installGatewayAPI: false
  gatewayAPI:
    version: v1.5.1
    channel: standard
    # Applied when installGatewayAPI is true. Default:
    # https://github.com/kubernetes-sigs/gateway-api/releases/download/<version>/<channel>-install.yaml
    manifestURL: ""
  inferenceExtension:
    version: v1.6.0
    # Applied with `kubectl apply -k` when installGatewayAPI is true. Default:
    # https://github.com/kubernetes-sigs/gateway-api-inference-extension/config/crd?ref=<version>
    kustomizeURL: ""

# ---------------------------------------------------------------------------
# The inference layer (templates/inference/): one GatewayClass, one Gateway,
# and an InferencePool + HTTPRoute per entry of `pools`.
# lbmode=fullproxy and usepodnetwork=yes are imposed by kube-loxilb and are
# therefore not values here.
# ---------------------------------------------------------------------------
inference:
  gatewayClass:
    create: true
    name: loxilb-gc
    controllerName: loxilb.io/loxilb
    annotations: {}
  gateway:
    create: true
    name: inference-gw
    # Namespace of the Gateway; empty means the release namespace.
    namespace: llm
    annotations: {}
    listeners:
      - name: http
        protocol: HTTP
        port: 8080
        allowedRoutes:
          namespaces:
            from: All
  pools:
    - name: vllm-qwen3
      # The pool selects pods in its own namespace; empty means the release namespace.
      namespace: llm
      selector:
        app: vllm-qwen3
      targetPort: 8000
      modelName: qwen3-32b               # loxilb.io/model-name
      epselect: chwbl                    # loxilb.io/epselect: chwbl | gpuaware | wrr-hash
      sseMode: true                      # loxilb.io/sse-mode (also arms API-key / rate-limit enforcement)
      # Any other loxilb.io/* annotation, verbatim (kv-exact-mode, pd-disagg, chwbl-*, ...).
      # The fc-* annotations set the capacity admission gate (loxilb.io/fc-mode,
      # fc-max-outstanding, fc-max-queue-depth, ...; kube-loxilb ca558a6 or
      # later). They act only with sseMode, an auth.mode or pd-disagg.
      annotations: {}
      # Rendered as loxilb.io/api-key-auth and loxilb.io/jwt-auth-profile.
      # kube-loxilb feat/auth-annotation (830fa59) or later carries them into
      # the loxilb rule; an older kube-loxilb installs the rule WITHOUT the
      # policy. The JWT modes need a cluster-scoped JWTAuthProfile named
      # jwtAuthProfile (phase 2 renders it) and the gateway needs its API-key
      # store (--aikey-db-*): without the store every verified token is
      # refused 503 policy_store_unavailable. NOTES.txt warns on both.
      auth:
        mode: none                       # none | required | jwt | apikey-or-jwt
        jwtAuthProfile: ""
      route:
        name: llm-route                  # empty: <pool>-route
        hostnames: []
        matches: []                      # HTTPRouteMatch list; empty: "/" prefix
  # An Endpoint Picker (e.g. the llm-d Router EPP) for every pool. The chart
  # does not deploy it: install it yourself so that a Service `name` serving
  # ext_proc on `port` exists in each pool's namespace. Enabled, every pool
  # gets endpointPickerRef; kube-loxilb (feat/auth-annotation) resolves it to
  # the Service's cluster IP and puts it on the rule, and the gateway asks the
  # picker which pod serves each request.
  #   FailOpen   no picker reachable: loxilb's own selection (epselect) serves.
  #   FailClose  no picker reachable: 503 epp_unavailable, nothing reaches the
  #              model servers; also while the Service does not exist.
  # Only a gateway listing "epp" in /version features calls the picker (main
  # builds since 2026-10-27 and v0.9.9.1 do). On any other, kube-loxilb sends a
  # FailOpen rule without
  # the picker and refuses a FailClose one (EndpointPickerUnsupported).
  # Per-pool `annotations` tune the call: loxilb.io/epp-timeout-ms (default
  # 3000) and loxilb.io/epp-plaintext: "true" for a picker without TLS. A pool
  # with a picker cannot also set loxilb.io/pd-disagg.
  externalEndpointPicker:
    enabled: false
    name: ""
    port: 9002
    failureMode: FailOpen

# ---------------------------------------------------------------------------
# Hooks beyond the CRD precheck.
# ---------------------------------------------------------------------------
hooks:
  # pre-delete (weight -10): delete the chart's HTTPRoutes, then its
  # InferencePools, and wait until the Services kube-loxilb derived from them
  # are gone - while kube-loxilb is still running. Helm alone deletes the pools
  # and the kube-loxilb Deployment in one sweep, and the derived Services (no
  # ownerReference) would stay behind, with their rules on an external gateway.
  # A timeout is reported and does not block the uninstall.
  drain:
    enabled: true
    timeoutSeconds: 120
    image:
      repository: alpine/k8s
      tag: 1.34.12
      pullPolicy: IfNotPresent
    resources: {}

# ---------------------------------------------------------------------------
# helm test: templates/tests/ (test-igw-version, test-pool-rule).
# ---------------------------------------------------------------------------
tests:
  enabled: true
  # loxilb REST base URL the tests call. Empty: the loxilb-igw management
  # Service, else the first kube-loxilb.loxiURL, else the discovery Service.
  loxilbURL: ""
  expectProduct: loxilb-inference-gateway
  curlImage:
    repository: curlimages/curl
    tag: 8.23.0
    pullPolicy: IfNotPresent
  kubectlImage:
    repository: alpine/k8s
    tag: 1.34.12
    pullPolicy: IfNotPresent
  rbac:
    create: true

nameOverride: ""
fullnameOverride: ""
