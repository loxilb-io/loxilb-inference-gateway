          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Certificate not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
    
    delete:
      summary: Delete a certificate
