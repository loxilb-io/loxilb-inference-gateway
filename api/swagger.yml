swagger: '2.0'
info:
  title: Loxilb Rest API
  description: Loxilb REST API for Baremetal Scenarios
  version: 0.0.1
schemes:
  - http
  - https
host: "0.0.0.0:11111"
basePath: /netlox/v1
produces:
  - application/json
consumes:
  - application/json
paths:
  '/config/import':
    post:
      summary: Import configurations
      consumes:
        - multipart/form-data
      parameters:
        - in: formData
          name: configuration
          type: file
          description: The configuration file to upload.
      responses:
        '204':
          description: OK
  '/config/export':
    get:
      summary: Export all configurations
      description: Export cluster, endpoint, firewall, loadbalancer, mirror, and policy configurations as a JSON file.
      parameters:
        - name: components
          in: query
          description: Comma-separated list of components to export (cluster, endpoint, firewall, loadbalancer, mirror, policy). If not specified, all components are exported.
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: Configuration JSON file download
          schema:
            type: file
        '400':
          description: Invalid parameters
          schema:
            $ref: '#/definitions/Error' 
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error' 
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error' 
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'

  '/config/snapshot':
    get:
      summary: Download a complete instance snapshot
      description: Returns the versioned, checksummed snapshot document (schema 1.0) covering all v1 configuration domains. Replaces the deprecated /config/export. Response carries Content-Disposition and X-Snapshot-Checksum headers.
      parameters:
        - name: components
          in: query
          description: Comma-separated list of v1 domains to capture (endpoint, loadbalancer, firewall, policy, mirror, session, sessionulcl, ipfilter, securityrate, bfd, bgp, ipsec). If not specified, all domains are captured.
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: Snapshot document download
          schema:
            type: file
          headers:
            Content-Disposition:
              type: string
            X-Snapshot-Checksum:
              type: string
        '400':
          description: Invalid parameters
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Another snapshot or restore operation is in progress
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/restore':
    post:
      summary: Restore an instance snapshot
      description: Runs the staged restore pipeline (parse, validate, plan, preserve, apply, verify, commit-or-rollback) on the posted snapshot document. Default mode is dry-run, which validates and plans without mutating anything; commit must be explicit. Replaces the deprecated /config/import.
      parameters:
        - name: mode
          in: query
          description: dry-run (default) validates and returns the plan without mutating anything; commit applies the snapshot with automatic rollback on failure.
          type: string
          enum: [dry-run, commit]
          default: dry-run
        - name: snapshot
          in: body
          required: true
          description: The snapshot document, as produced by GET /config/snapshot.
          schema:
            type: object
      produces:
        - application/json
      responses:
        '200':
          description: Restore result (both modes; inspect result and errors fields)
          schema:
            $ref: '#/definitions/RestoreResult'
        '400':
          description: Malformed or incompatible snapshot document
          schema:
            $ref: '#/definitions/RestoreResult'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Another snapshot or restore operation is in progress
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Restore failed (rolled-back or ROLLBACK-FAILED; see result field)
          schema:
            $ref: '#/definitions/RestoreResult'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/persist':
    post:
      summary: Persist the running configuration to disk
      description: Dumps the gateway's live configuration to {config-path}/snapshot.json (atomic temp-file + rename, 0600) so it survives a daemon restart. This is "save" as an API (single-writer rule) - the same write the gateway performs automatically after a committed restore and, when auto-persist is enabled, after every successful mutating config call. loxicmd save --api calls this instead of writing legacy *.txt files client-side.
      produces:
        - application/json
      responses:
        '200':
          description: Configuration persisted
          schema:
            $ref: '#/definitions/PersistResult'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Another snapshot or restore operation is in progress
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'

  '/meta':
    get:
      summary: "Get metadata for all POST APIs"
      description: "Returns metadata about required fields for each POST API."
      security: []
      operationId: "getMeta"
      tags:
        - "Metadata"
      produces:
        - "application/json"
      responses:
        "200":
          description: "Successfully retrieved metadata"
          schema:
            type: object
            additionalProperties: true
        "500":
          description: "Internal Server Error"
#----------------------------------------------
# User Management
#----------------------------------------------
  '/auth/login':
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token if the credentials
        are valid.
      parameters:
      - description: User credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/User'
      produces:
      - application/json
      security: [] # Overrides global security, no authorization required
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: User login
      tags:
      - auth
  '/auth/logout':
    post:
      consumes:
      - application/json
      description: Invalidates the user's token and logs them out.
      security:
        - BearerAuth: []
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: User logout
      tags:
      - auth
  '/auth/users':
    get:
      description: Retrieves all users from the database and returns them as a JSON
        response.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Fetch all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user in the system
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/User'
      produces:
      - application/json
      security: [] # Overrides global security, no authorization required
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Create a new user
      tags:
      - users
  '/auth/users/{id}':
    delete:
      consumes:
      - application/json
      description: Deletes a user by its ID
      security:
        - BearerAuth: []
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Delete user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates an existing user with the provided JSON payload
      security:
        - BearerAuth: []
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Update user
      tags:
      - users
  '/auth/token/upgrade':
    post:
      consumes:
      - application/json
      description: Using manual token, It need to upgrade the token.
      parameters:
      - description: license as a token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/UpdateLicenseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UpdateLicenseRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Upgrade token
      tags:
      - auth
#----------------------------------------------
# Load Balancer
#----------------------------------------------
  '/config/loadbalancer':
    post:
      summary: Create a new Load balancer service
      description: Create a new load balancer service with .
      parameters:
        - name: attr
          in: body
          required: true
          description: Attributes for load balance service
          schema:
            $ref: '#/definitions/LoadbalanceEntry'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/PostSuccess'
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Capacity insufficient
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Resource Conflict. VLAN already exists OR dependency VRF/VNET not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/loadbalancer/all':
    get:
      summary: Get all of the load balancer services
      description: Get all of the load balancer services with conntrack infomation.
      parameters:
        - name: projectId
          in: query
          required: false
          type: string
          description: >-
            Octavia tenant/project identifier filter. When supplied, only
            load-balancer services whose serviceArguments.projectId matches are returned.
            This is a CONVENIENCE filter, NOT a tenant-isolation/authz boundary:
            an unfiltered GET still returns rules with any projectId.
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              lbAttr:
                type: array
                items:
                  $ref: '#/definitions/LoadbalanceEntry'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
    delete:
      summary: Delete all Load balancer services
      description: Delete all load balancer services.
      responses:
        '204':
          description: OK
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Capacity insufficient
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Resource Conflict. VLAN already exists OR dependency VRF/VNET not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/loadbalancer/name/{lb_name}':
    delete:
      summary: Delete an existing Load balancer service
      description: Delete an existing load balancer service with name.
      parameters:
        - name: lb_name
          in: path
          type: string
          required: true
          description: Attributes for load balance service name
      responses:
        '204':
          description: OK
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Capacity insufficient
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Resource Conflict. VLAN already exists OR dependency VRF/VNET not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/loadbalancer/externalipaddress/{ip_address}/port/{port}/protocol/{proto}':
    get:
      summary: Get a Load balancer service by composite key
      description: Returns a single load balancer rule identified by its VIP/port/protocol composite key (Octavia).
      operationId: getConfigLoadbalancerExternalipaddressIPAddressPortPortProtocolProto
      parameters:
        - name: ip_address
          in: path
          type: string
          required: true
          description: External (VIP) IP address of the load balancer service
        - name: port
          in: path
          type: number
          required: true
          description: Service port of the load balancer service
        - name: proto
          in: path
          type: string
          required: true
          description: Protocol of the load balancer service (tcp/udp/sctp)
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/LoadbalanceEntry'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
    delete:
      summary: Delete an existing Load balancer service
      description: Delete an existing load balancer service with .
      parameters:
        - name: ip_address
          in: path
          type: string
          required: true
          description: Attributes for load balance service
        - name: port
          in: path
          type: number
          required: true
          description: Attributes for load balance service
        - name: proto
          in: path
          type: string
          required: true
          description: Attributes for load balance service
        - name: bgp
          in: query
          type: boolean
          description: option for BGP enable
        - name: block
          in: query
          type: number
          required: false
          description: block value if any
        - name: model_name
          in: query
          type: string
          required: false
          description: >-
            Model name carried by the rule (the `model_name` given at creation). It is part of the
            rule key, so a rule that names a model can only be deleted by naming the same model here.
            Omitting it matches only a rule with no model name: with two rules on one VIP:port, one
            naming a model and one not, a delete without `model_name` removes the model-less rule and
            leaves the other serving.
      responses:
        '204':
          description: OK
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Capacity insufficient
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Resource Conflict. VLAN already exists OR dependency VRF/VNET not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
    patch:
      summary: Patch an existing Load balancer service (RFC 7386 JSON merge-patch)
      description: >-
        Apply an RFC 7386 JSON merge-patch to an existing load balancer rule identified by
        its VIP/port/protocol composite key (Octavia). Fields present in the body are
        overwritten, absent fields are left untouched, and an explicit null clears a clearable
        field. Immutable fields (security, egress, mode, protocol, VIP composite key)
        are rejected with 400. Returns 200 if the target rule exists, 404 if it is
        absent. The rule is mutated in place; established connections are not dropped.
      operationId: patchConfigLoadbalancerExternalipaddressIPAddressPortPortProtocolProto
      consumes:
        - application/merge-patch+json
        - application/json
      parameters:
        - name: ip_address
          in: path
          type: string
          required: true
          description: External (VIP) IP address of the load balancer service
        - name: port
          in: path
          type: number
          required: true
          description: Service port of the load balancer service
        - name: proto
          in: path
          type: string
          required: true
          description: Protocol of the load balancer service (tcp/udp/sctp)
        - name: attr
          in: body
          required: true
          description: RFC 7386 merge-patch document over the load balancer service
          schema:
            $ref: '#/definitions/LoadbalanceEntry'
      responses:
        '200':
          description: Updated
        '400':
          description: Malformed merge-patch body or attempt to modify an immutable field
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
  '/config/loadbalancer/id/{id}':
    get:
      summary: Get a Load balancer service by opaque id
      description: Returns a single load balancer rule identified by its stable opaque id (Octavia).
      operationId: getConfigLoadbalancerID
      parameters:
        - name: id
          in: path
          type: string
          required: true
          description: Stable opaque identifier of the load balancer rule
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/LoadbalanceEntry'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
  '/config/l7policy':
    post:
      summary: Create an L7 content-routing policy
      description: >-
        Creates a dedicated L7_POLICY resource (policy + ordered child rules) and attaches it to an
        existing L4 load-balancer referenced by its stable opaque id. The body is
        validated server-side with Octavia per-type rules (FILE_TYPE only EQUAL_TO/REGEX; key
        required for HEADER/COOKIE/QUERY; redirect statusCode allow-list default 302; REJECT default
        403; REGEX patterns try-compiled at config time) and translated to the internal route IR,
        then carried to the running sockproxy by a SEPARATE attach call (proxy_attach_l7_policy) —
        NEVER inline on the 4096-byte proxy_arg.
      operationId: postConfigL7Policy
      parameters:
        - name: attr
          in: body
          required: true
          description: L7 policy attributes
          schema:
            $ref: '#/definitions/L7Policy'
      responses:
        '204':
          description: OK
        '400':
          description: Malformed arguments (failed Octavia validation or unrepresentable export)
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Referenced load-balancer not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
    get:
      summary: Get all L7 content-routing policies
      operationId: getConfigL7PolicyAll
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/L7PolicyGetEntry'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
  '/config/l7policy/id/{id}':
    get:
      summary: Get a single L7 content-routing policy by id
      operationId: getConfigL7PolicyID
      parameters:
        - name: id
          in: path
          type: string
          required: true
          description: Stable opaque identifier of the L7 policy
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/L7Policy'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
    delete:
      summary: Delete an L7 content-routing policy by id
      description: Detaches the policy from its load-balancer (proxy_detach_l7_policy regfrees every compiled REGEX) and removes the resource.
      operationId: deleteConfigL7PolicyID
      parameters:
        - name: id
          in: path
          type: string
          required: true
          description: Stable opaque identifier of the L7 policy
      responses:
        '204':
          description: OK
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
  '/config/cert':
    post:
      summary: Upload a TLS certificate under an opaque certId
      description: >-
        Uploads inline PEM material (cert + key [+ chain]) under an opaque certId — the
        canonical TLS-material store. The handler persists the PEM to the managed
        dir (/etc/loxilb/certs/<certId>/, 0700 dir / 0600 key) and registers it via the C
        certId registry, which auto-derives the hostname(s) from the leaf cert SAN/CN
        and registers them into the hostname-keyed SNI store. Selection at handshake stays by
        hostname; certId is the upload/rotate/delete handle. When certId is absent the server
        mints one. Malformed PEM / missing key is rejected with 400 (never a panic).
      operationId: postConfigCert
      parameters:
        - name: attr
          in: body
          required: true
          description: Certificate attributes (certId optional; inline PEM)
          schema:
            $ref: '#/definitions/Cert'
      responses:
        '201':
          description: Created
        '400':
          description: Malformed PEM / missing material
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
  '/config/cert/{certId}':
    put:
      summary: Rotate the material under a stable certId
      description: >-
        Atomic zero-downtime rotation — re-persists the new PEM under the SAME certId and swaps
        the cert object into the SNI store under lock; in-flight connections keep the old SSL
        until they close. Unknown certId returns 404; malformed material returns 400.
      operationId: putConfigCertCertId
