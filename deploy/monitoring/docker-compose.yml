# LoxiLB Inference Gateway monitoring stack (Prometheus + Grafana).
# Internal monitoring design; quick start: ./README.md
#
# host networking: Prometheus must reach the loxilb container on its docker
# bridge IP; inter-bridge container traffic is blocked by docker's isolation
# chains, so both services run on the host network (ports 9090 / 3000).
services:
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: loxilb-prometheus
    network_mode: host
    restart: unless-stopped
    # OPTIONAL (transport-TLS scrape path only): uncomment `user: "0"` to let
    # Prometheus read the 0600 client key bind-mount without chowning it.
    # user: "0"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # OPTIONAL (transport-TLS scrape path only — see prometheus.yml + README):
      # run certs/gen-certs.sh first, then uncomment these + `user: "0"` above.
      # - ./certs/rootCA.crt:/etc/prometheus/certs/rootCA.crt:ro
      # - ./certs/client.crt:/etc/prometheus/certs/client.crt:ro
      # - ./certs/client.key:/etc/prometheus/certs/client.key:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Prometheus has no authentication of its own; bind it to loopback so
      # only same-host consumers (Grafana on the host network, the sweep and
      # drill tooling) can reach it. To expose it beyond this host, front it
      # with an authenticated proxy on the management network instead of
      # widening this bind.
      - --web.listen-address=127.0.0.1:9090

  grafana:
    image: grafana/grafana:11.6.16
    container_name: loxilb-grafana
    network_mode: host
    restart: unless-stopped
    env_file: .env            # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
