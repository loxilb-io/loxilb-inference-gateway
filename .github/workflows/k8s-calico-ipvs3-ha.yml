name: K8s-Calico-Cluster-IPVS3-HA-Sanity-CI
on:
 schedule:
 # Runs "At 17:00 UTC every day-of-week"
 - cron: '0 17 * * *'
 workflow_dispatch:
    inputs:
      testName:
        description: 'Test Run-Name'     
        required: true
        default: 'k8s-calico-cluster-ipvs3-ha'
jobs:
  test-runner:
    name: k8s-calico-cluster-ipvs3-ha-sanity
    runs-on: [self-hosted, large]
    if: github.repository == 'loxilb-io/loxilb-inference-gateway' 
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}

    - name: Run the test
      run: |
         cd cicd/k8s-calico-ipvs3-ha
         ./config.sh
         ./validation.sh
         cd -
         
    - name: Clean test-bed
      if: success() || failure()
      run: |
        cd cicd/k8s-calico-ipvs3-ha || true
        ./rmconfig.sh
        cd -
