name: Monitoring-Lint

# Tier-0 hermetic correctness gate for the Prometheus + Grafana stack
# (deploy/monitoring/). No loxilb, no traffic, no eBPF — pure static checks that
# run in seconds on any runner. See the internal monitoring CI plan (Tier 0).
#
# Catches the silent-drift class that manual validation can't re-catch per change:
#   - a dashboard/alert referencing a metric the exporter no longer emits
#   - a broken PromQL expression
#   - an alert annotation pointing at a renamed/absent panel
#   - a panel wired to the wrong datasource
#
# Triggered by changes to the stack OR to the exporter metric surface, so a
# metric rename that orphans a panel fails here, not in production.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'deploy/monitoring/**'
      - 'tools/metric-manifest/**'
      - '**/*.go'
      - '.github/workflows/monitoring-lint.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deploy/monitoring/**'
      - 'tools/metric-manifest/**'
      - '**/*.go'
      - '.github/workflows/monitoring-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring-lint:
    name: monitoring-lint
    runs-on: ubuntu-latest
    env:
      PROM_VERSION: 2.53.4   # keep in sync with deploy/monitoring/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # exporter metric names live in the main tree only

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install promtool (pinned Prometheus release)
        run: |
          arch=$(dpkg --print-architecture)   # amd64 / arm64
          url="https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-${arch}.tar.gz"
          curl -sSL "$url" -o /tmp/prom.tgz
          tar xzf /tmp/prom.tgz -C /tmp
          sudo install "/tmp/prometheus-${PROM_VERSION}.linux-${arch}/promtool" /usr/local/bin/promtool
          promtool --version

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run monitoring lint (Tier 0)
        run: |
          python3 deploy/monitoring/ci/test_lint_monitoring.py
          python3 deploy/monitoring/ci/lint-monitoring.py --require-promtool

      - name: Verify metric ownership manifest
        run: |
          python3 deploy/monitoring/ci/gen-metric-manifest.py --self-test
          python3 deploy/monitoring/ci/gen-metric-manifest.py --check --locked-rev-check

      - name: Exporter-side metric contract
        # api/prometheus is where the label sets the rules and dashboards
        # select on are declared, so it belongs to this gate rather than to a
        # datapath one -- and it is reachable here, with no eBPF checkout,
        # because these tests need none. TestEveryGateDenialArmIsCounted lives
        # in this package for exactly that reason: it parses the datapath's
        # gate exports as source, so it can hold them to the metric contract
        # without the privileged environment their own package tests require.
        run: go test -count=1 ./api/prometheus

      - name: Metric extractor resolution behaviour
        # The extractor is pointed at an upstream checkout to compute parity, so
        # its ability to resolve indirect registrations is a correctness
        # property now, not a convenience: a pattern it cannot resolve becomes a
        # family reported absent upstream, and a consumer hides a working panel.
        run: go test -count=1 ./tools/metric-manifest

      - name: Verify OSS parity artifact (against the PINNED upstream revision)
        # Pinned, not main: this leg must be reproducible, so a PR fails only
        # for what the PR changed. Upstream moving under us is a separate
        # question, asked on a schedule by oss-parity-drift.yml.
        run: |
          python3 deploy/monitoring/ci/gen-oss-parity.py --self-test
          rev=$(python3 -c "import json;print(json.load(open('deploy/monitoring/manifest/oss-parity.json'))['provenance']['upstream_revision'])")
          echo "pinned upstream revision: $rev"
          git clone --filter=blob:none --no-checkout \
            https://github.com/loxilb-io/loxilb.git /tmp/upstream-loxilb
          git -C /tmp/upstream-loxilb checkout --quiet "$rev"
          python3 deploy/monitoring/ci/gen-oss-parity.py \
            --upstream /tmp/upstream-loxilb --check
