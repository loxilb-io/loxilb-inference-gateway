        enum:
          - open
          - closed
        example: "open"
      scan_mode:
        type: string
        description: Large body handling (full=skip if too large, truncate=scan first 64KB)
        enum:
          - full
          - truncate
        example: "truncate"
      analyzer_url:
        type: string
        description: Presidio analyzer gRPC endpoint
        example: "localhost:50051"
      anonymizer_url:
        type: string
        description: Presidio anonymizer gRPC endpoint (optional)
        example: "localhost:50051"
      score_threshold:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        description: Minimum confidence score for PII detection (0.0-1.0)
        example: 0.7
      timeout_ms:
        type: integer
        format: int64
        minimum: 0
        description: Presidio request timeout in milliseconds
        example: 100
      max_body_size:
        type: integer
        format: int64
        minimum: 0
        description: Maximum HTTP body size to scan (bytes)
        example: 65536
      min_body_size:
        type: integer
        format: int64
        minimum: 0
        description: Minimum HTTP body size to scan (bytes)
        example: 100
      circuit_breaker:
        $ref: '#/definitions/PIICircuitBreaker'
      retry:
        $ref: '#/definitions/PIIRetry'
      # === V2 API Fields ===
      enable_v2:
        type: boolean
        description: Enable Presidio v2 API (combined analyze+anonymize, 40% faster)
        example: true
      default_operator:
        type: string
        description: Default anonymization operator for v2
        enum:
          - replace
          - redact
          - hash
          - mask
          - encrypt
        example: "encrypt"
      encryption_key:
        type: string
        description: Base64-encoded encryption key for v2 (AES-256, 32 bytes)
        example: "YourBase64EncodedKey32BytesLong="
      batch_size:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        description: Batch size for v2 streaming API
        example: 10

  PIICircuitBreaker:
    type: object
    properties:
      threshold:
        type: integer
        format: int64
        minimum: 0
        description: Number of failures before opening circuit
        example: 5
      timeout_sec:
        type: integer
        format: int64
        minimum: 0
        description: Time to wait before attempting half-open (seconds)
        example: 60
      success_threshold:
        type: integer
        format: int64
        minimum: 0
        description: Number of successes needed to close circuit
        example: 3

  PIIRetry:
    type: object
    properties:
      max_retries:
        type: integer
        format: int64
        minimum: 0
        description: Maximum number of retry attempts
        example: 1
      backoff_ms:
        type: integer
        format: int64
        minimum: 0
        description: Backoff time between retries (milliseconds)
        example: 100

  PIIURLPatternsEntry:
    type: object
    required:
      - mode
    properties:
      mode:
        type: string
        description: Pattern update mode (add, replace, clear)
        enum:
          - add
          - replace
          - clear
        example: "replace"
      patterns:
        type: array
        items:
          $ref: '#/definitions/PIIURLPattern'
        description: List of URL patterns (max 64)

  PIIURLPattern:
    type: object
    required:
      - pattern
    properties:
      pattern:
        type: string
        description: URL pattern with wildcards (e.g., /v1/chat/*, /api/*)
        example: "/v1/chat/*"
      is_exclude:
        type: boolean
        description: Exclude pattern (true) or include pattern (false)
        example: false

  PIIStatusResponse:
    type: object
    properties:
      enabled:
        type: boolean
        description: Whether PII detection is enabled
        example: true
      mode:
        type: string
        description: Current detection mode
        example: "mask"
      direction:
        type: string
        description: Current scan direction
        example: "both"
      fail_mode:
        type: string
        description: Current fail mode
        example: "open"
      scan_mode:
        type: string
        description: Current large body handling mode
        example: "truncate"
      analyzer_url:
        type: string
        description: Analyzer endpoint
        example: "localhost:50051"
      anonymizer_url:
        type: string
        description: Anonymizer endpoint
        example: "localhost:50051"
      score_threshold:
        type: number
        format: float
        description: Current confidence threshold
        example: 0.7
      timeout_ms:
        type: integer
        format: int64
        description: Request timeout
        example: 100
      max_body_size:
        type: integer
        format: int64
        description: Maximum body size to scan
        example: 65536
      min_body_size:
        type: integer
        format: int64
        description: Minimum body size to scan
        example: 100
      circuit_breaker:
        $ref: '#/definitions/PIICircuitBreaker'
      retry:
        $ref: '#/definitions/PIIRetry'
      url_patterns:
        type: array
        items:
          $ref: '#/definitions/PIIURLPattern'
        description: Current URL patterns
      url_pattern_count:
        type: integer
        format: int64
        description: Number of configured URL patterns
        example: 3

  PIIStatsResponse:
    type: object
    properties:
      total_scans:
        type: integer
        format: int64
        description: Total number of PII scans performed
        example: 1523
      pii_detected:
        type: integer
        format: int64
        description: Number of requests with PII detected
        example: 245
      pii_blocked:
        type: integer
        format: int64
        description: Number of requests blocked due to PII
        example: 12
      errors:
        type: integer
        format: int64
        description: Number of scan errors
        example: 8

#----------------------------------------------
# LlamaFirewall AI Security Definitions
#----------------------------------------------
  LlamaFirewallConfigEntry:
    type: object
    properties:
      server_url:
        type: string
        description: LlamaFirewall gRPC server URL
        example: "localhost:50052"
      timeout_sec:
        type: integer
        format: int64
        minimum: 1
        maximum: 300
        description: Request timeout in seconds (for ML models)
        example: 15
        x-nullable: true
      fail_closed:
        type: boolean
        description: Fail-closed (true=block on error) vs fail-open (false=allow on error)
        example: false
        x-nullable: true
      block_threshold:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        description: Minimum confidence score to block (0.0-1.0)
        example: 0.9
        x-nullable: true
      cache_enabled:
        type: boolean
        description: Enable response caching for identical requests
        example: true
        x-nullable: true
      cache_ttl_sec:
        type: integer
        format: int64
        minimum: 0
        description: Cache TTL in seconds
        example: 300
        x-nullable: true
      connection_pool_size:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        description: Number of reusable gRPC connections
        example: 10
        x-nullable: true
      scan_patterns:
        type: array
        items:
          type: string
        description: URL patterns to scan (empty = scan all)
        example: ["/api/v1/chat*", "/api/*/code"]
      skip_patterns:
        type: array
        items:
          type: string
        description: URL patterns to skip scanning
        example: ["/health", "/metrics"]

  LlamaFirewallScannersEntry:
    type: object
    properties:
      prompt_guard:
        type: boolean
        description: Enable PromptGuard (ML-based prompt injection detection)
        example: true
        x-nullable: true
      code_shield:
        type: boolean
        description: Enable CodeShield (insecure code pattern detection)
        example: true
        x-nullable: true
      regex:
        type: boolean
        description: Enable Regex (credential/API key leak detection)
        example: true
        x-nullable: true
      hidden_ascii:
        type: boolean
        description: Enable HiddenASCII (zero-width/invisible character detection)
        example: true
        x-nullable: true
      agent_alignment:
        type: boolean
        description: Enable AgentAlignment (AI agent misalignment detection)
        example: false
        x-nullable: true
      pii_detection:
        type: boolean
        x-nullable: true
        description: Enable PII Detection (complementary to Presidio)
        example: false

  LlamaFirewallStatusResponse:
    type: object
    properties:
      enabled:
        type: boolean
        description: Whether LlamaFirewall scanning is enabled
        example: true
      server_url:
        type: string
        description: Configured server URL
        example: "localhost:50052"
      connected:
        type: boolean
        description: Connection status to gRPC server
        example: true
      fail_closed:
        type: boolean
        description: Current fail policy
        example: false
      block_threshold:
        type: number
        format: float
        description: Current block threshold
        example: 0.9
      scanners:
        $ref: '#/definitions/LlamaFirewallScannersStatus'
      cache_enabled:
        type: boolean
        description: Cache status
        example: true
      cache_ttl_sec:
        type: integer
        format: int64
        description: Cache TTL
        example: 300
      scan_patterns:
        type: array
        items:
          type: string
        description: Active scan patterns
      skip_patterns:
        type: array
        items:
          type: string
        description: Active skip patterns
      last_health_check:
        type: string
        description: Last health check timestamp (RFC3339)
        example: "2025-01-10T10:30:00Z"

  LlamaFirewallScannersStatus:
    type: object
    properties:
      prompt_guard:
        type: boolean
        description: PromptGuard enabled
        example: true
      code_shield:
        type: boolean
        description: CodeShield enabled
        example: true
      regex:
        type: boolean
        description: Regex enabled
        example: true
      hidden_ascii:
        type: boolean
        description: HiddenASCII enabled
        example: true
      agent_alignment:
        type: boolean
        description: AgentAlignment enabled
        example: false
      pii_detection:
        type: boolean
        description: PII Detection enabled
        example: false

  LlamaFirewallStatsResponse:
    type: object
    properties:
      total_scans:
        type: integer
        format: int64
        description: Total number of scans performed
        example: 2456
      requests_scanned:
        type: integer
        format: int64
        description: User requests scanned (PromptGuard+Regex)
        example: 1523
      responses_scanned:
        type: integer
        format: int64
        description: AI responses scanned (CodeShield+Regex)
        example: 933
      threats_detected:
        type: integer
        format: int64
        description: Total threats detected across all scanners
        example: 47
      requests_blocked:
        type: integer
        format: int64
        description: Requests blocked due to threats
        example: 12
      scan_errors:
        type: integer
        format: int64
        description: Number of scan errors
        example: 3
      avg_latency_ms:
        type: integer
        format: int64
        description: Average scan latency in milliseconds
        example: 85
      cache_hits:
        type: integer
        format: int64
        description: Number of cache hits
        example: 542
      scanner_stats:
        $ref: '#/definitions/LlamaFirewallScannerStats'
      decisions:
        $ref: '#/definitions/LlamaFirewallDecisionStats'

  LlamaFirewallScannerStats:
    type: object
    properties:
      prompt_guard:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      code_shield:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      regex:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      hidden_ascii:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      agent_alignment:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'
      pii_detection:
        $ref: '#/definitions/LlamaFirewallIndividualScannerStats'

  LlamaFirewallIndividualScannerStats:
    type: object
    properties:
      scans:
        type: integer
        format: int64
        description: Number of scans by this scanner
        example: 1523
      detections:
        type: integer
        format: int64
        description: Threats detected by this scanner
        example: 15
      avg_latency_ms:
        type: integer
        format: int64
        description: Average latency for this scanner
        example: 45
      errors:
        type: integer
        format: int64
        description: Errors from this scanner
        example: 1

  LlamaFirewallDecisionStats:
    type: object
    properties:
      allow:
        type: integer
        format: int64
        description: Number of ALLOW decisions
        example: 2397
      block:
        type: integer
        format: int64
        description: Number of BLOCK decisions
        example: 12
      hitl:
        type: integer
        format: int64
        description: Number of Human-In-The-Loop decisions
        example: 47

  LlamaFirewallHealthResponse:
    type: object
    properties:
      healthy:
        type: boolean
        description: Overall health status
        example: true
      server_url:
        type: string
        description: Server URL checked
        example: "localhost:50052"
      connected:
        type: boolean
        description: Connection status
        example: true
      latency_ms:
        type: integer
        format: int64
        description: Health check latency
        example: 12
      message:
        type: string
        description: Health check message
        example: "LlamaFirewall server is healthy"
      timestamp:
        type: string
        description: Health check timestamp (RFC3339)
        example: "2025-01-10T10:30:00Z"

  ApiKeyCreateRequest:
    type: object
    required:
      - tenant_id
    properties:
      tenant_id:
        type: string
        description: Tenant identifier that owns this key
      name:
        type: string
        description: Human-readable label for the API key
      allowed_models:
        type: array
        items:
          type: string
        description: List of model identifiers this key may access
      rate_limit_rps:
        type: integer
        format: int64
        description: Maximum requests per second allowed for this key
      burst_size:
        type: integer
        format: int64
        description: Burst capacity above the steady-state RPS limit
      tokens_per_min:
        type: integer
        format: int64
        description: Maximum LLM tokens per minute for this key
      expires_at:
        type: string
        format: date-time
        description: Optional expiry timestamp (RFC3339)
      enabled:
        type: boolean
        x-nullable: true
        description: Whether the API key is active. Absent = enabled (optional, nullable to distinguish unset).

  ApiKeyCreateResponse:
    type: object
    required:
      - raw_key
    properties:
      raw_key:
        type: string
        description: The plaintext API key — returned ONLY at creation time
      key_id:
        type: string
        description: Unique identifier of the created API key

  ApiKeySummary:
    type: object
    required:
      # enabled must always serialize: a disabled key (enabled=false) is still
      # listed/returned by the management endpoints, and the operator relies on
      # this flag to tell it apart. Without 'required', go-swagger emits
      # omitempty and false would be dropped from the JSON.
      - enabled
    properties:
      key_id:
        type: string
        description: Unique identifier of the API key
      tenant_id:
        type: string
        description: Tenant that owns this key
      name:
        type: string
        description: Human-readable label for the API key
      allowed_models:
        type: array
        items:
          type: string
        description: List of model identifiers this key may access
      rate_limit_rps:
        type: integer
        format: int64
        description: Maximum requests per second allowed for this key
      burst_size:
        type: integer
        format: int64
        description: Burst capacity above the steady-state RPS limit
      tokens_per_min:
        type: integer
        format: int64
        description: Maximum LLM tokens per minute for this key
      created_at:
        type: string
        format: date-time
        description: Timestamp when the key was created
      expires_at:
        type: string
        format: date-time
        description: Optional expiry timestamp (RFC3339)
      enabled:
        type: boolean
        description: Whether this key is currently active

  TenantRateLimitMod:
    type: object
    required:
      - tenant_id
    properties:
      tenant_id:
        type: string
        description: Tenant identifier
      rps:
        type: integer
        format: int64
        description: Maximum requests per second for the tenant
      tokens_per_min:
        type: integer
        format: int64
        description: Maximum LLM tokens per minute for the tenant
      model_limits:
        type: array
        description: Per-model token quotas for the tenant
        items:
          $ref: '#/definitions/TenantModelRateLimit'

  TenantModelRateLimit:
    type: object
    properties:
      model:
        type: string
        description: Model name the quota applies to
      tokens_per_min:
        type: integer
        format: int64
        description: Maximum LLM tokens per minute for this tenant and model; 0 removes the model quota

  TenantRateLimitEntry:
    type: object
    required:
      - tenant_id
    properties:
      tenant_id:
        type: string
        description: Tenant identifier
      rps:
        type: integer
        format: int64
        description: Maximum requests per second for the tenant
      tokens_per_min:
        type: integer
        format: int64
        description: Maximum LLM tokens per minute for the tenant
      model_limits:
        type: array
        description: Per-model token quotas for the tenant
        items:
          $ref: '#/definitions/TenantModelRateLimit'
      updated_at:
        type: string
        format: date-time
        description: Timestamp of the last rate limit update

  OPAWatcherConfig:
    type: object
    required:
      - opa_url
    properties:
      opa_url:
        type: string
        description: OPA server URL (e.g. http://opa:8181)
      policy_path:
        type: string
        description: OPA policy path to query
        default: "loxilb/l4"
      poll_interval_sec:
        type: integer
        description: Polling interval in seconds
        default: 30
      fail_open:
        type: boolean
        description: Allow traffic when OPA is unreachable
        default: false

  OPAWatcherStatus:
    type: object
    properties:
      opa_url:
        type: string
        description: Configured OPA server URL
      policy_path:
        type: string
        description: Configured OPA policy path
      poll_interval_sec:
        type: integer
        description: Configured polling interval in seconds
      fail_open:
        type: boolean
        description: Fail-open setting
      status:
        type: string
        description: Current watcher status (running, stopped, not_configured)
      last_sync_at:
        type: string
        format: date-time
        description: Timestamp of last successful sync
      rules_count:
        type: integer
        description: Number of active firewall rules
      circuit_breaker_state:
        type: integer
        description: Circuit breaker state (0=closed, 1=half-open, 2=open)
      last_error:
        type: string
        description: Last error message if any

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
security:
  - BearerAuth: [] # Global security applied to all endpoints by default
