name: Govulncheck

# Go vulnerability scan over the project packages. Blocking: govulncheck
# exits non-zero when a known vulnerability is reachable from our code.
# The cicd/ tree is excluded (its common/ package mixes C helper sources
# into a Go package and never ships in release binaries).

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-images:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/go-candidate-images.yml
    secrets: inherit

  model-regeneration:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read toolchain pin
        id: pins
        run: echo "go=$(python3 scripts/update-go-pins.py --print-go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}
      - name: Check tuple validation after clean generation
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./api/cmd/sync-model-validators
          go generate ./api/restapi
          go run ./api/cmd/sync-model-validators -check
          go test ./api/models -run '^TestEndPointHostStateTupleValidation$' -count=1

  govulncheck:
    name: govulncheck
    # Dependabot PRs don't receive repo secrets, so CI_SUBMODULE_TOKEN is empty
    # and the private loxilb-ebpf submodule can't be cloned. Skip rather than
    # fail red; the scheduled run still provides vuln coverage.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}

      - name: Read and check centralized pins
        id: pins
        run: |
          python3 scripts/update-go-pins.py --check
          echo "go=$(python3 scripts/update-go-pins.py --print-go-version)" >> "$GITHUB_OUTPUT"
          echo "govulncheck=$(python3 scripts/update-go-pins.py --print-govulncheck-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}

      - name: Install cgo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev gcc-multilib libpcap-dev \
            libbsd-dev build-essential elfutils dwarves bison flex pkg-config \
            libjson-c-dev libnghttp2-dev

      - name: Install govulncheck
        env:
          GOVULNCHECK_VERSION: ${{ steps.pins.outputs.govulncheck }}
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Run govulncheck
        # Gate on FIXABLE reachable vulnerabilities only: run govulncheck in JSON
        # mode and fail CI only when a reachable vuln has an available upstream fix.
        # Advisories with no fix (Fixed: N/A) — e.g. GoBGP GO-2026-4736 (NEXT_HOP
        # DoS), which has no fix in any gobgp major version — are reported but do
        # not block. -e lets go list tolerate the C-only cicd/common package.
        run: |
          mapfile -t pkgs < <(go list -e ./... | grep -v /cicd/)
          set +e
          govulncheck -format json "${pkgs[@]}" > govulncheck.json 2> govulncheck.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "govulncheck failed to run (exit $rc):"; cat govulncheck.err; exit 1
          fi
          python3 .github/scripts/govulncheck-gate.py govulncheck.json
