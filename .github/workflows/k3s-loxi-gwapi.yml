name: K3s-Loxi-GWAPI-Sanity-CI
on:
 schedule:
 # Runs "At 7:00 UTC every day-of-week"
 - cron: '0 7 * * *'
 workflow_dispatch:
    inputs:
      testName:
        description: 'Test Run-Name'     
        required: true
        default: 'k3s-loxi-gwapi'
jobs:
  build:
    name: k3s-loxi-gwapi-sanity
    runs-on: [self-hosted, large]
    if: github.repository == 'loxilb-io/loxilb-inference-gateway' 
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - name: Run K3s LoxiGWAPI CICD
        run: |
         cd cicd/k3s-flannel-loxilb-gwapi
         ./config.sh
         ./validation.sh
         ./rmconfig.sh
         cd -
      - name: Clean test-bed
        if: success() || failure()
        run: |
          cd cicd/k3s-flannel-loxilb-gwapi/ || true
          ./rmconfig.sh
          cd -
