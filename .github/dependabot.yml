# Dependabot: weekly dependency update PRs for Go modules, GitHub Actions,
# and the container/package build bases. PRs only — nothing merges without
# review and green CI.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Base OS and Go toolchain are pinned to our stable set (ubuntu 20/22/24,
      # go 1.25) and moved by hand, not by Dependabot. Freeze both here so the
      # weekly run stops proposing ubuntu 26.x / go 1.26+ bumps.
      - dependency-name: "ubuntu"
      - dependency-name: "golang"

  - package-ecosystem: docker
    directory: "/packaging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # Same policy as above for the packaging build base.
      - dependency-name: "ubuntu"
      - dependency-name: "golang"

  # Monitoring stack image pins (prom/prometheus, grafana/grafana) in the
  # shipped compose file — bumps are gated by monitoring-lint + monitoring-e2e.
  - package-ecosystem: docker-compose
    directory: "/deploy/monitoring"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
