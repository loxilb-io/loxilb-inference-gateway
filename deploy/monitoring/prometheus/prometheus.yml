# Prometheus scrape config for LoxiLB Inference Gateway monitoring.
# Design: docs/MONITORING-DESIGN.md §2 — mTLS scrape of the loxilb API TLS listener.
global:
  scrape_interval: 10s      # aligned to loxilb's 10s stats sweep; do not lower
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: loxilb
    scheme: https
    metrics_path: /netlox/v1/metrics
    tls_config:
      ca_file: /etc/prometheus/certs/rootCA.crt
      cert_file: /etc/prometheus/certs/client.crt
      key_file: /etc/prometheus/certs/client.key
    static_configs:
      # loxilb API TLS listener (--tls-port, default 8091).
      # Edit for your deployment; cert SAN must cover this address (gen-certs.sh).
      - targets: ["172.17.0.2:8091"]

  # Prometheus self-monitoring (soak checks use prometheus_tsdb_head_series).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
