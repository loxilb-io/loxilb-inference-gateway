name: Build-Check-CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      userInput:
        description: 'Enter string to print at end'
        required: true
        default: 'Finished'
      tags:
        description: 'Build Check'  

jobs:

  build:
    name: build-check-ci
    # Dependabot PRs don't receive repo secrets, so CI_SUBMODULE_TOKEN is empty
    # and the private loxilb-ebpf submodule can't be cloned. Skip rather than
    # fail red; the bump is re-validated by the push/schedule run after merge.
    if: ${{ github.actor != 'dependabot[bot]' }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
        
    - name: Install Latest Docker
      run: |
        # for pkg in docker.io docker-doc docker-compose podman-docker containerd runc; do sudo apt-get remove $pkg; done
        # sudo apt-get update
        # sudo apt-get install ca-certificates curl gnupg
        # sudo install -m 0755 -d /etc/apt/keyrings
        # curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        # sudo chmod a+r /etc/apt/keyrings/docker.gpg

        # echo \
        #  "deb [arch="$(dpkg --print-architecture)" signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
        #  "$(. /etc/os-release && echo "$VERSION_CODENAME")" stable" | \
        # sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        # sudo apt-get update
        # sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        echo "Done"

    - name: Build the loxilb Docker image (build-check)
      run: |
        TEST_TAG="ghcr.io/loxilb-io/loxilb-inference-gateway:buildcheck-${{ github.run_id }}"
        docker build --progress=plain -f Dockerfile.buildcheck . --tag "$TEST_TAG"
        docker run -u root --cap-add SYS_ADMIN --restart unless-stopped --privileged -dit -v /dev/log:/dev/log --name loxilb-buildcheck "$TEST_TAG"
    - run: echo ${{ github.event.inputs.userInput }}
