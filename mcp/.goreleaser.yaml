# GoReleaser config for loxilb-mcp — the standalone MCP bridge.
# Runs from this directory (the nested Go module). Produces, for every
# push of a `mcp/vX.Y.Z` tag: cross-platform static binaries + archives,
# a SHA256SUMS file, a Homebrew cask, and a multi-arch GHCR image.
#
#   Local dry run:  cd mcp && goreleaser release --snapshot --clean
#   Real release:   handled by .github/workflows/mcp-release.yml
version: 2

project_name: loxilb-mcp

# This module lives in mcp/ and releases on its OWN tags, `mcp/vX.Y.Z`,
# independent of the datapath's `vX.Y.Z[.W]` tags. GoReleaser OSS has no
# monorepo tag-prefix support, so the workflows run it with working-directory
# `mcp` and pass the prefix-stripped version via GORELEASER_CURRENT_TAG.
before:
  hooks:
    - go test ./...

builds:
  - id: loxilb-mcp
    main: ./cmd/loxilb-mcp
    binary: loxilb-mcp
    env:
      - CGO_ENABLED=0        # fully static — one binary per OS/arch, no libc dep
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/loxilb-io/loxilb-inference-gateway/mcp/internal/mcp.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: "loxilb-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

snapshot:
  # A literal, not `incpatch .Version`: outside a release run `git describe`
  # picks up the datapath's 4-part tags (v0.9.8.6), which aren't semver and
  # can't be incremented.
  version_template: "0.0.0-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:"]

# Homebrew cask published to the tap repo loxilb-io/homebrew-tap. A cask, not a
# formula: `brews:` is deprecated upstream, and casks are what GoReleaser now
# uses for pre-built binaries. Casks are macOS-only — Linux users take the
# tarball, the container image, or `go install`.
# Requires: the tap repo to exist and secret HOMEBREW_TAP_TOKEN (a PAT with
# contents:write on that repo) exported to the release job.
homebrew_casks:
  - name: loxilb-mcp
    binaries: [loxilb-mcp]
    repository:
      owner: loxilb-io
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/loxilb-io/loxilb-inference-gateway"
    description: "Standalone MCP bridge for loxilb-inference-gateway"
    license: "Apache-2.0"
    # The default URL is derived from the (prefix-stripped) version, which is
    # not where the assets live — the release sits on the `mcp/vX.Y.Z` tag. The
    # slash stays literal: this is byte-for-byte the `browser_download_url`
    # GitHub reports for these assets. (GoReleaser percent-encodes it when it
    # builds the URL itself, which does NOT match what GitHub publishes.)
    url:
      template: "https://github.com/loxilb-io/loxilb-inference-gateway/releases/download/mcp/v{{ .Version }}/{{ .ArtifactName }}"
    hooks:
      post:
        # The binaries are unsigned, so Gatekeeper would quarantine them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/loxilb-mcp"]
          end

# Multi-arch container image on GitHub Packages (GHCR). One buildx build across
# both platforms, manifest included — `dockers:`/`docker_manifests:` are
# deprecated upstream. The build context holds the binaries under
# <os>/<arch>/, hence the $TARGETPLATFORM COPY in the Dockerfile.
dockers_v2:
  - id: loxilb-mcp
    ids: [loxilb-mcp]
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    images:
      - "ghcr.io/loxilb-io/loxilb-mcp"
    tags:
      - "{{ .Version }}"
      # `latest` must not follow a pre-release: `mcp/v1.2.0-rc.1` should publish
      # its own tag and leave `latest` on the last stable image.
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: loxilb-mcp
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/loxilb-io/loxilb-inference-gateway"

# The GitHub Release is NOT created by GoReleaser. It derives the release tag
# from the version it was handed (0.1.0 → `v0.1.0`), which would mint a tag in
# the datapath's own `vX.Y.Z` namespace. The workflow publishes the release on
# the real `mcp/vX.Y.Z` tag with `gh release create` and uploads dist/ instead.
release:
  disable: true
