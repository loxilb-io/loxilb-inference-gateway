name: AI-Gateway-Sanity-CI

# Builds loxilb-inference-gateway from source (Go + eBPF), overlays the fresh
# binary onto the container image, and runs the self-contained AI-gateway CICD
# scenarios that need only loxilb + local mock/echo backends (no GPU, no cloud,
# no external 3rd-party service). Scenarios that require published backend
# images (vllm-server / mcp-server / grpc) are listed under workflow_dispatch.
#
# One job per family, in parallel: the single job took 68 minutes on main
# (the vLLM P/D mock alone 20), so a red arrived an hour after the push.
# Every job starts from the same composite setup (.github/actions/ai-sanity-setup:
# toolchain, from-source build, the image overlay, and the loxicmd the
# Dockerfile pins, so every CLI half runs the CLI this tree ships) and keeps
# the artifacts of a failed run. Each job is a required check on main; a
# scenario that is moved or renamed moves with its job name, never silently
# out of the gate.
#   ai-pd-vllm        vLLM P/D disaggregation (mock vLLM)             ~23 min
#   ai-engine-mocks   SGLang/TRT-LLM P/D, llama.cpp, SGLang KV-cache   ~18 min
#   ai-auth           API keys, auth-plane separation, SSE quota,
#                     with the CLI halves of ai-apikey and ai-sse-quota
#   ai-jwtauth        JWT bearer admission (Keycloak) and its CLI half
#   ai-admission      capacity gate, model routing/conflict (with the
#                     ai-model-routing CLI half), endpoint health,
#                     connectionLimit, rule replace                    ~17 min
#   ai-tenant-sched   tenant scheduling, bands, release accounting
#                     (cicd/ai-tenant, REQUIRE_ALL=1), and its CLI
#                     half                                             ~25 min
#   ai-pd-admission   P/D bounded admission per endpoint: shed, park,
#                     overflow (cicd/vllm-pd-admission-cpu)            ~3 min
#   ai-kv-strict      strict KV admission: profile/engine contract
#                     refusals (cicd/kv-profile-admission) and SGLang
#                     attestation rungs (cicd/kv-sglang-attest)        ~4 min
# NOTE: cicd/vllm-kvcache-routing-cpu is intentionally NOT gated here. Its
# strict fixture-driven asserts (exact tokenizer-overlap fallthrough timing)
# are sensitive to hosted-runner state; that real-vLLM CPU harness is
# exercised out-of-band (manual runs) rather than in this workflow.

on:
  push:
    branches:
      - main
    paths:
      # a datapath-only change arrives as the submodule pointer bump
      - 'loxilb-ebpf'
      - 'cicd/vllm-**'
      - 'cicd/sglang-**'
      - 'cicd/trtllm-**'
      - 'cicd/llamacpp-**'
      - 'cicd/ai-**'
      - 'cicd/kv-profile-admission/**'
      - 'cicd/kv-sglang-attest/**'
      - 'cicd/tcplbconnlimit/**'
      - 'cicd/lbreplace/**'
      - 'cicd/common/**'
      - 'cicd/sockmap-fullproxy/**'
      - 'cicd/sockmap-restart/**'
      - 'pkg/**'
      - 'api/**'
      - '.github/workflows/ai-gateway-sanity.yml'
      - '.github/actions/ai-sanity-setup/**'
  pull_request:
    branches: [ "main" ]
    paths:
      # a datapath-only change arrives as the submodule pointer bump
      - 'loxilb-ebpf'
      - 'cicd/vllm-**'
      - 'cicd/sglang-**'
      - 'cicd/trtllm-**'
      - 'cicd/llamacpp-**'
      - 'cicd/ai-**'
      - 'cicd/kv-profile-admission/**'
      - 'cicd/kv-sglang-attest/**'
      - 'cicd/tcplbconnlimit/**'
      - 'cicd/lbreplace/**'
      - 'cicd/common/**'
      - 'cicd/sockmap-fullproxy/**'
      - 'cicd/sockmap-restart/**'
      - 'pkg/**'
      - 'api/**'
      - '.github/workflows/ai-gateway-sanity.yml'
      - '.github/actions/ai-sanity-setup/**'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'AI Gateway Sanity'

jobs:
  # AI P/D disaggregation, mock vLLM (the longest scenario, on its own runner)
  ai-pd-vllm:
    name: ai-pd-vllm
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: Prefill/Decode disaggregation (mock vLLM)
        run: |
          cd cicd/vllm-pd-disagg/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Keep what a failed run left (scenario artifacts, mock logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pd-vllm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cicd/vllm-pd-disagg/artifacts*/
            /tmp/ai-*.log
          if-no-files-found: ignore
          retention-days: 14

  # AI engine mocks: SGLang and TRT-LLM P/D, llama.cpp affinity, SGLang KV-cache routing
  ai-engine-mocks:
    name: ai-engine-mocks
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: SGLang P/D dual-dispatch disaggregation (mock SGLang)
        run: |
          cd cicd/sglang-pd-disagg/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: TRT-LLM P/D rewriter-dialect disaggregation (mock TRT-LLM)
        run: |
          cd cicd/trtllm-pd-disagg/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: llama.cpp typed plain-LB affinity + guards (mock llama.cpp)
        run: |
          cd cicd/llamacpp-lb/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: SGLang KV-cache-aware routing (echo backends)
        run: |
          cd cicd/sglang-loxilb-kvcache/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Keep what a failed run left (scenario artifacts, mock logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-engine-mocks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cicd/sglang-pd-disagg/artifacts*/
            cicd/trtllm-pd-disagg/artifacts*/
            cicd/llamacpp-lb/artifacts*/
            cicd/sglang-loxilb-kvcache/artifacts*/
            /tmp/ai-*.log
          if-no-files-found: ignore
          retention-days: 14

  # AI credential plane: API keys, authentication plane separation, SSE quota
  ai-auth:
    name: ai-auth
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: API keys + tenant rate limits (PostgreSQL-backed)
        run: |
          cd cicd/ai-apikey/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      # The capacity admission gate: ceilings over HTTP/1.1, HTTP/2 and TLS,
      # the gauges and decision counters it exports, its refusals on the
      # audit trail, the same load admitted in observe mode, and the bounded
      # queue: waiting in order, deadlines, cancellation, runtime changes,
      # rule deletion and the maintenance drain.
      - name: Authentication plane separation (PostgreSQL key store, plaintext + TLS)
        run: |
          cd cicd/ai-authsep/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: SSE streaming quota
        run: |
          cd cicd/ai-sse-quota/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Keep what a failed run left (scenario artifacts, mock logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cicd/ai-apikey/artifacts*/
            cicd/ai-authsep/artifacts*/
            cicd/ai-sse-quota/artifacts*/
            /tmp/ai-*.log
          if-no-files-found: ignore
          retention-days: 14

  # JWT bearer admission against a live Keycloak realm, on its own job.
  ai-jwtauth:
    name: ai-jwtauth
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      # The bearer (JWT) admission arm against a real Keycloak realm: the token
      # verdict ladder, apikey-or-jwt precedence, upstream header hygiene, the
      # HTTP/2 admission legs, the keyless VIP quota arm and the missing-usage
      # accounting arm. 69 declared case IDs with a Z1/Z2 inventory, so a case
      # that stops running turns the step red instead of shrinking the count.
      #
      # It ran only in the local runner until now, which left the largest AI
      # regression suite in the tree gating no pull request. Measured cost on
      # the reference bed: 84s config + 77s validation + 16s cleanup, plus 43s
      # the first time it builds the pinned Keycloak image (config.sh builds it
      # on demand and reuses it afterwards). Keycloak and PostgreSQL are
      # locally built/pulled containers, so the job stays within this
      # workflow's no-external-service charter.
      # The setup installed the tree's pinned loxicmd (loxicmd-pin), so the
      # CLI half (validate_cli.sh, folded into validation.sh) is required
      # rather than auto: a pin regression fails the step instead of
      # skipping the half.
      - name: JWT bearer admission against a live Keycloak realm
        env:
          CLI_TESTS: required
        run: |
          cd cicd/ai-jwtauth/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Keep what a failed run left (scenario artifacts, mock logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-jwtauth-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cicd/ai-jwtauth/artifacts*/
            /tmp/ai-*.log
          if-no-files-found: ignore
          retention-days: 14

  # AI admission gate and the rule contract: capacity gate, model routing and conflict, endpoint health, connection limit, rule replace
  ai-admission:
    name: ai-admission
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: Capacity admission gate (HTTP/1, HTTP/2, TLS, audit, observe)
        run: |
          cd cicd/ai-admission/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Model-name routing
        run: |
          cd cicd/ai-model-routing/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: OpenAI JSON boundaries (streaming, duplicate metadata, auth, h2c and audit)
        if: ${{ !cancelled() }}
        run: |
          bash cicd/ai-json-parser/validation.sh \
            ghcr.io/loxilb-io/loxilb-inference-gateway:latest \
            "$GITHUB_WORKSPACE/cicd/ai-json-parser/artifacts/run"
      - name: Keep JSON parser boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-json-parser-${{ github.run_id }}-${{ github.run_attempt }}
          path: cicd/ai-json-parser/artifacts/
          if-no-files-found: ignore
          retention-days: 14
      # The other half of the model contract: one body-first resolution shared
      # by authorization and routing, and a hard 400 when the body and the
      # X-Model header disagree. It ran only in the local runner, so a change
      # that agreed with the router but disagreed with the authorizer reached
      # main ungated.
      - name: Effective-model contract on enforcing services
        run: |
          cd cicd/ai-model-conflict/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Endpoint health fans out to every pool (address-keyed)
        run: |
          cd cicd/ai-ephealth/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: connectionLimit round trip (REST-declared ceiling enforced at SYN time)
        # Built from source above, so the handler copy under test is this
        # change's, not the published image's.
        run: |
          cd cicd/tcplbconnlimit/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: LB rule replace and merge-patch (every accepted value reads back)
        run: |
          cd cicd/lbreplace/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Keep what a failed run left (scenario artifacts, mock logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cicd/ai-admission/artifacts*/
            cicd/ai-model-routing/artifacts*/
            cicd/ai-model-conflict/artifacts*/
            cicd/ai-ephealth/artifacts*/
            cicd/tcplbconnlimit/artifacts*/
            cicd/lbreplace/artifacts*/
            /tmp/ai-*.log
          if-no-files-found: ignore
          retention-days: 14

  # The tenant scheduling suite (cicd/ai-tenant/validation-sched.sh): the
  # priority bands, floors and the reserve, weighted and strict wakes, tenant
  # rotation, shed and eviction, the TTL header, h2c parity, release
  # accounting (both identities of loxilb_ai_fc_band_total), the band knobs'
  # API and their persistence, DB outage and recovery. Every case is declared
  # with an inventory (declared = executed + pending + elsewhere): a case that
  # stops running turns the step red, and REQUIRE_ALL=1 (the PR gate) fails a
  # pending one. B4 is declared elsewhere (cicd/vllm-kvcache-routing-cpu, run
  # by hand); this job is the scheduling-only result and its summary says so.
  # The run records the candidate tuple it is evidence for (gateway commit,
  # eBPF and libbpf gitlinks, image id and digest, binary SHA256) in
  # artifacts-sched/identity.json and its inventory in summary.txt; both are
  # kept as artifacts on every run, and a failed run keeps everything it left.
  # Measured on the reference bed: about 22 minutes end to end.
  ai-tenant-sched:
    name: ai-tenant-sched
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      # CLI_TESTS=required: the setup installed the tree's pinned loxicmd
      # (loxicmd-pin), so the CLI half (validate_cli.sh, folded into
      # validation-sched.sh) must run, never skip.
      - name: Tenant scheduling, bands and release accounting (PostgreSQL-backed, REQUIRE_ALL)
        env:
          REQUIRE_ALL: "1"
          CLI_TESTS: required
        run: |
          cd cicd/ai-tenant/
          ./config.sh
          ./validation-sched.sh
          ./rmconfig.sh
          cd -
      - name: Keep the run's identity, inventory and results (every rule with its fc_effective, the gateway logs, the per-request answers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tenant-sched-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cicd/ai-tenant/artifacts-sched/
            /tmp/ai-tenant-*.log
          if-no-files-found: ignore
          retention-days: 14

  # The P/D bounded-admission gate per endpoint: shed, park and overflow, with
  # hanging prefill stubs so requests really overlap (cicd/vllm-pd-admission-cpu,
  # GPU-free). Its counter families have no other committed coverage. The suite
  # rebuilds the bed at queue depth 2 partway through and leaves no containers
  # on success; its evidence (per-phase baselines, probe codes) is in hidden
  # .adm-* files and in the datapath log inside llb1, which a failed run keeps.
  ai-pd-admission:
    name: ai-pd-admission
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: P/D bounded admission (shed, park, overflow)
        run: |
          cd cicd/vllm-pd-admission-cpu/
          sudo -E ./config.sh
          sudo -E ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Collect the gateway logs a failed run left in llb1
        if: failure()
        run: |
          mkdir -p cicd/vllm-pd-admission-cpu/artifacts
          docker cp llb1:/var/log/loxilbdp.log cicd/vllm-pd-admission-cpu/artifacts/ || true
          docker cp llb1:/tmp/loxilb.err cicd/vllm-pd-admission-cpu/artifacts/ || true
          docker cp llb1:/tmp/loxilb.out cicd/vllm-pd-admission-cpu/artifacts/ || true
          docker ps -a > cicd/vllm-pd-admission-cpu/artifacts/docker-ps.txt || true
      - name: Keep what a failed run left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pd-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cicd/vllm-pd-admission-cpu/artifacts*/
            cicd/vllm-pd-admission-cpu/.adm-*
            /tmp/pd-fault/
            /tmp/ai-*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Strict KV admission, GPU-free. kv-profile-admission holds the admission
  # contract (profile/engine/hash refusals, replace-only fields, binding
  # identity); kv-sglang-attest earns the attestation rungs through the SGLang
  # simulator in cicd/common/kv_hash, whose self-test gates config.sh. Both
  # suites call sudo themselves, so the step runs them as the runner user.
  ai-kv-strict:
    name: ai-kv-strict
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: ./.github/actions/ai-sanity-setup
        with:
          ghcr-token: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: Strict KV profile admission (refusals, replace-only, binding identity)
        env:
          LOXILB_DOCKER_IMAGE: ghcr.io/loxilb-io/loxilb-inference-gateway:latest
        run: |
          cd cicd/kv-profile-admission/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: SGLang KV attestation rungs (simulator self-test, then T1-T9)
        env:
          LOXILB_DOCKER_IMAGE: ghcr.io/loxilb-io/loxilb-inference-gateway:latest
        run: |
          cd cicd/kv-sglang-attest/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: Collect the gateway logs a failed run left in llb1
        if: failure()
        run: |
          mkdir -p /tmp/ai-kv-strict
          docker cp llb1:/var/log/loxilbdp.log /tmp/ai-kv-strict/ || true
          docker cp llb1:/tmp/loxilb.err /tmp/ai-kv-strict/ || true
          docker cp llb1:/tmp/loxilb.out /tmp/ai-kv-strict/ || true
          docker ps -a > /tmp/ai-kv-strict/docker-ps.txt || true
      - name: Keep what a failed run left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-kv-strict-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ai-kv-strict/
            /tmp/kvsgl-sim-*
            /tmp/kvpa-*.json
            /tmp/kvsgl-*.json
          if-no-files-found: ignore
          retention-days: 14

  # The sockmap testbed is otherwise run by hand (see cicd/sockmap-fullproxy/README.md):
  # its acceleration suites need a kernel carrying the sk_psock_backlog fix, which
  # the hosted runners do not have. This suite drives a handful of small echoes
  # through a response-accelerated service, well under the volume where that defect
  # shows, and holds the per-direction contract for a service that declares
  # api_key_auth: the request direction is refused and stays on the relay, where the
  # credential is checked and X-Api-Key stripped on every keep-alive request; the
  # response direction is accepted and its bytes are redirected by the kernel. The
  # image is built from the Dockerfile (-DHAVE_SOCKOPS, the build --sockmapsupport
  # is documented for) rather than overlaid from the host build.
  sockmap-apikey-response-sanity:
    name: sockmap-apikey-response-sanity
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
      - run: sudo apt-get update
      - run: sudo apt-get -y install linux-tools-$(uname -r) linux-tools-common nodejs
      - run: loxilb-ebpf/utils/mkllb_bpffs.sh
      - name: Build the image the sockmap testbed starts (Dockerfile defaults)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker build --secret id=github_token,env=GH_TOKEN -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      # The suite creates a key and drives keyed traffic, so the testbed brings
      # up its optional PostgreSQL key store (the same fixture cicd/ai-apikey
      # uses). Without the knob the suite refuses to start.
      - name: A declared api_key_auth keeps requests on the relay and accelerates responses
        env:
          SOCKMAP_AI_KEY_STORE: "1"
        run: |
          cd cicd/sockmap-fullproxy/
          ./config.sh
          ./validation_apikey_response.sh
          ./rmconfig.sh
          cd -

  # A client that half-closes after its request, on a service whose
  # half_close_mode is hold: it gets its whole answer, and a reset lets it go
  # at once - while it waits, when only the reset reported on its disarmed fd
  # can end it, and while its answer is still being written to it. The service
  # is not accelerated, so the kernel defect above does not apply.
  sockmap-hold-sanity:
    name: sockmap-hold-sanity
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
      - run: sudo apt-get update
      - run: sudo apt-get -y install linux-tools-$(uname -r) linux-tools-common nodejs
      - run: loxilb-ebpf/utils/mkllb_bpffs.sh
      - name: Build the image the sockmap testbed starts (Dockerfile defaults)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker build --secret id=github_token,env=GH_TOKEN -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      - name: A half-closed client is held for its answer and let go on a reset
        run: |
          cd cicd/sockmap-fullproxy/
          ./config.sh
          ./validation_hold.sh
          ./rmconfig.sh
          cd -

  # A gateway started with --sockmapsupport must come back after a restart of
  # the SAME container: the writable layer survives (the cgroup directory from
  # the previous boot) but the mount namespace does not (the cgroup2 mount), so
  # the hierarchy has to be mounted again on every boot. The daemon runs as the
  # container's PID 1 here; the shared testbed starts it under
  # --entrypoint /bin/bash, which does not reproduce an operator's restart.
  sockmap-restart-sanity:
    name: sockmap-restart-sanity
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - name: Build the image the restart check starts (Dockerfile defaults)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker build --secret id=github_token,env=GH_TOKEN -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      - name: The same container comes back from two restarts with its rule
        run: cicd/sockmap-restart/validation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sockmap-restart-evidence
          path: cicd/sockmap-restart/artifacts/
          if-no-files-found: ignore
          retention-days: 14
