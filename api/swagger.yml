  /oauth/{provider}:
    get:
      description: Initiates the OAuth login flow for the specified provider.
      parameters:
      - description: OAuth provider
        in: path
        name: provider
        required: true
        type: string
      # Overrides global security: this initiates the login flow, so by
      # construction the caller holds no credential yet.
      security: []
      responses:
        "302":
          description: Found
          schema:
            $ref: '#/definitions/OauthMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/OauthErrorResponse'
      summary: OAuth login
      tags:
      - auth
  /oauth/{provider}/callback:
    get:
      description: Handles the OAuth callback flow for the specified provider.
      parameters:
      - description: OAuth provider
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      security: [] # Overrides global security, no authorization required
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/OauthLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/OauthErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/OauthErrorResponse'
      summary: OAuth callback
      tags:
      - auth
  /oauth/{provider}/token:
    get:
      description: Handles the OAuth token refresh workflow for the specified provider.
      parameters:
      - description: OAuth provider
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth access token
        in: query
        name: token
        required: true
        type: string
      - description: OAuth refresh token
        in: query
        name: refreshtoken
        required: true
        type: string
      security: [] # Overrides global security, no authorization required
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/OauthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/OauthErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/OauthErrorResponse'
      summary: OAuth callback
      tags:
      - auth
