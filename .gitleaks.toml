# gitleaks configuration — extends the default ruleset.
[extend]
useDefault = true

# Unit-test fixtures use obviously fake credentials (e.g. "sk-live-verysecret-…",
# "0123456789abcdef…"). Allowlist those files rather than individual findings so
# history rewrites and line moves do not resurrect false positives.
[allowlist]
description = "Unit-test fixtures with dummy credentials"
paths = [
  '''mcp/internal/mcp/phase3_test\.go''',
  '''mcp/internal/mcp/server_test\.go''',
  # The same fixture files lived at pkg/mcp/ before loxilb-mcp was extracted
  # into a standalone module; the full-history scan still sees them there.
  '''pkg/mcp/phase3_test\.go''',
  '''pkg/mcp/server_test\.go''',
  # Upstream loxilb cicd/ test fixtures surfaced by the full-history scan:
  # ephemeral throwaway CI clusters, Vagrant well-known insecure keys,
  # minica-generated self-signed test certs, and kubeadm bootstrap tokens for
  # CI-only clusters that no longer exist. These are NOT secrets — the public
  # upstream loxilb repo ships these same files. Scoped to fixture file *types*
  # so a real credential accidentally committed to a cicd script is still caught.
  '''(^|/)\.vagrant/.*/private_key$''',        # Vagrant default insecure keypair
  '''^cicd/.*/(minica-)?key\.pem$''',          # minica-generated test TLS keys
  '''^cicd/.*/server\.key$''',                 # per-scenario self-signed server keys
  '''^cicd/.*/k3s\.yaml$''',                   # throwaway k3s kubeconfig/server token
  '''^cicd/.*/configs/config$''',              # throwaway kubeadm kubeconfig
  '''^cicd/.*/configs/join\.sh$''',            # kubeadm join: ephemeral bootstrap token
  '''^cicd/.*/ingress/loxilb-secret\.yml$''',  # test ingress TLS secret
  '''^cicd/ipsec[^/]*/config\.sh$''',          # IPsec test PSK values
  '''^api/certification/server\.key$''',       # swagger codegen self-signed test key
  # release-hygiene.sh is itself the private-key DETECTION script: its step-6
  # belt-and-braces embeds PEM header literals (-----BEGIN PRIVATE KEY-----)
  # and base64 body regexes ([A-Za-z0-9+/]{40,}) as *match patterns*, which
  # gitleaks' own private-key rule then flags on — a circular false positive.
  # The script carries no key material. (PR #32 fixed the script's own
  # self-check but not this scan of the script.)
  '''^scripts/release-hygiene\.sh$''',
]
