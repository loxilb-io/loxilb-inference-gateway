#----------------------------------------------
# LoxiLB Prometheus 
#----------------------------------------------
  '/metrics':
    get:
      summary: Scrape metrics from the cache
      description: >-
        Prometheus exposition rather than JSON. Whether this route requires a
        bearer token is a deployment property, not a property of the route,
        which is why it is declared without a security requirement while still
        declaring 401, 403 and 503. The --metrics-auth option decides - auto
        (the default) requires a token only under mgmt-profile remote-tls,
        require always requires one, and disable never does and is refused
        under remote-tls. A scraper that gets 401 here is reaching a gateway
        that expects a credential; configure the scrape job with a bearer token
        rather than removing the requirement. Collection or export being
        disabled answers a plain-text 503, decided before the credential is
        examined. Which series appear depends on initialization and activity;
        an absent series is not a measured zero.
      # Overrides global security. A Prometheus scraper does not carry a bearer,
      # and on a loopback or trusted-network deployment it should not have to.
      # It is NOT blanket-anonymous: the route declares 401/403/503 because
      # --metrics-auth (see the description) can put it behind the same bearer
      # chain as every other route on this listener, and under mgmt-profile
      # remote-tls it does so by default. The requirement cannot be expressed in
      # the generated chain, which admits only one answer for every deployment,
      # so ConfigGetPrometheusCounter applies it from the single decision
      # options.MetricsAuthPlan makes at startup.
      security: []
      responses:
        '200':
          description: Metrics in prometheus text format
          schema:
            type: string
        '401':
          description: Authentication is required for this route on this deployment and the credential was missing or invalid
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Authenticated principal's role carries no authority for this operation
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Metrics collection is disabled (a plain-text body, not JSON), or the credential store could not answer
  '/config/metrics':
    get:
      description: Returns the runtime Prometheus enablement flag, not proof of freshness or availability of every series.
      summary: Get prometheus config value
      responses:
        '200':
          description: prometheus config value
          schema:
            $ref: '#/definitions/MetricsConfig'
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
    post:
      description: Idempotently enables runtime collection and scraping, not metric-resource creation. Collection is asynchronous; enablement does not prove a first sample exists. This setting is not recovered through snapshots.
      summary: turn on prometheus option
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/OperationResult'
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
    delete:
      description: Idempotently disables runtime collection and scraping without stopping data forwarding or clearing every cached value. JSON metric readback can therefore remain stale.
      summary: turn off prometheus option
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/OperationResult'
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
#----------------------------------------------
# GPU-Aware Load Balancing
#----------------------------------------------
  '/config/gpu/enable':
    post:
      summary: Enable GPU-aware load balancing
      description: Enables runtime GPU monitoring and associated map configuration and starts a cleanup thread. Requires compiled support and available maps; already-enabled requests are rejected. No source linkage was established from this global toggle to an effective per-service routing switch. Cleanup is currently a placeholder; success does not verify GPU-aware traffic selection.
      responses:
        '200':
          description: GPU monitoring enabled successfully
          schema:
            $ref: '#/definitions/GPUEnableResponse'
        '400':
          description: GPU monitoring already enabled
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Failed to enable GPU monitoring
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/gpu/disable':
    post:
      summary: Disable GPU-aware load balancing
      description: Disables runtime GPU monitoring and stops its cleanup thread; already-disabled requests are rejected. This does not establish that existing services switch to CHWBL, since service selection configuration is separate. Map-update failure can leave partial state and is not a completed transition.
      responses:
        '200':
          description: GPU monitoring disabled successfully
          schema:
            $ref: '#/definitions/GPUEnableResponse'
        '400':
          description: GPU monitoring already disabled
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Failed to disable GPU monitoring
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/gpu/status':
    get:
      summary: Get GPU monitoring status
      description: Returns the monitoring flag and cached worker observations, not verified GPU health or effective service routing. Uncompiled support can report routing_mode disabled. Worker count includes cached entries; ebpf_map_loaded checks one worker-statistics map descriptor rather than all required maps.
      responses:
        '200':
          description: GPU monitoring status
          schema:
            $ref: '#/definitions/GPUMonitoringStatus'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/gpu/conversations/cleanup':
    post:
      summary: Manual conversation cleanup
      description: Conversation cleanup is currently a placeholder. The backend returns zero deletion and age counts without deleting mappings; success does not prove cleanup or an empty conversation table.
      parameters:
        - name: max_age_hours
          in: query
          type: integer
          required: false
          default: 1
          description: Requested age threshold in hours, defaulting to one when omitted. Negative values are rejected by the handler. The current backend does not apply the threshold or delete mappings; zero is not a functioning delete-all action.
      responses:
        '200':
          description: Cleanup completed successfully
          schema:
            $ref: '#/definitions/ConversationCleanupResponse'
        '400':
          description: GPU monitoring disabled or invalid parameters
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Cleanup operation failed
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/worker/metrics':
    post:
      summary: Update worker GPU metrics
      description: Submits a complete worker sample, not a partial update. Endpoint, queued_requests and kv_cache_usage_perc are required; omitted optional counters become zero. Active GPU monitoring is required. Cache and map updates can fail partially; successful ingestion does not establish endpoint registration or a verified routing decision.
      parameters:
        - name: attr
          in: body
          required: true
          schema:
            $ref: '#/definitions/WorkerMetricsEntry'
      responses:
        '200':
          description: Metrics updated successfully
          schema:
            $ref: '#/definitions/WorkerMetricsUpdateResponse'
        '400':
          description: GPU monitoring disabled or invalid request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Failed to update metrics
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
    get:
      summary: Get all worker metrics
      description: >-
        Returns the GPU metrics currently held for every tracked worker, and
        whether monitoring is enabled at all.


        Requires the global bearer credential; a viewer role is sufficient.
        Unlike the POST on this path, the read is not refused while monitoring
        is disabled -- it reports that state instead, through
        monitoring_enabled. An empty workers list therefore means "no worker
        has reported yet" only when monitoring_enabled is true.


        Each entry's timestamp is the ingestion time the worker reported, not
        the time this response was built, so a consumer computes staleness as
        now - timestamp. Ingestion rejects any sample whose timestamp is more
        than 10 seconds old and substitutes the receive time when a sample
        carries none, so a timestamp here is never further than that behind the
        moment the gateway accepted it.
      responses:
        '200':
          description: Worker metrics retrieved successfully
          schema:
            $ref: '#/definitions/WorkerMetricsResponse'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '503':
          description: Management credential store unavailable
          schema:
            $ref: '#/definitions/Error'
