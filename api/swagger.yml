swagger: '2.0'
info:
  title: Loxilb Rest API
  description: >-
    LoxiLB Inference Gateway management API. Read each field together with its
    operation, engine, topology, and lifecycle conditions; a schema default does
    not by itself establish omission or replace-update behavior. Descriptions
    explicitly identify known implementation limitations. The companion
    swagger-extras.yml documents manually registered routes. Management-plane
    authorization and data-plane X-Api-Key enforcement are separate policies.
  version: 0.0.1
schemes:
  - http
  - https
host: "0.0.0.0:11111"
basePath: /netlox/v1
produces:
  - application/json
consumes:
  - application/json
x-loxilb-contract-relations:
  version: 1
  scope: '#/definitions/LoadbalanceEntry'
  status: partial-static-audit
  description: >-
    Project-specific UI advisory metadata, not Swagger 2.0 validation keywords.
    Rules refer to JSON Pointers in an effective LoadbalanceEntry body, after a
    PATCH has been merged with the live declaration. No UI interpreter is shipped
    by this metadata. Static enforcement evidence is not runtime qualification;
    unknown rules must be displayed as unresolved, not silently treated as passed.
    See api/contract-relations.md for the versioned rule semantics.
  rules:
    - id: LB-PD-FULLPROXY
      kind: requires
      when: {field: /serviceArguments/pd_disagg_mode, operator: in, values: [true]}
      require:
        - {field: /serviceArguments/mode, operator: in, values: [4], missing: 0}
      enforcement: server-static
      message: P/D orchestration requires fullproxy mode.
      evidence: pkg/loxinet/rules.go:AddLbRule
    - id: LB-PD-ROLES
      kind: filtered-count
      when: {field: /serviceArguments/pd_disagg_mode, operator: in, values: [true]}
      array: /endpoints
      counts:
        - {field: /ep_role, equals: 1, minimum: 1}
        - {field: /ep_role, equals: 2, minimum: 1}
      enforcement: server-static
      message: P/D requires at least one prefill and one decode endpoint.
      evidence: pkg/loxinet/rules.go:AddLbRule
    - id: LB-CACHE-REQUIRES-PD
      kind: requires
      when: {field: /serviceArguments/pd_cache_aware_mode, operator: in, values: [true]}
      require:
        - {field: /serviceArguments/pd_disagg_mode, operator: in, values: [true], missing: false}
      enforcement: server-static
      message: Tier-1 P/D trie affinity requires P/D orchestration.
      evidence: pkg/loxinet/rules.go:AddLbRule
    - id: LB-EXACT-PD-MODE
      kind: requires
      when: {field: /serviceArguments/kvExactMode, operator: in, values: [1]}
      require:
        - {field: /serviceArguments/pd_disagg_mode, operator: in, values: [true], missing: false}
      enforcement: server-static
      message: Exact mode 1 requires a P/D pool.
      evidence: pkg/loxinet/rules.go:AddLbRule
    - id: LB-EXACT-SINGLE-POOL
      kind: requires
      when: {field: /serviceArguments/kvExactMode, operator: in, values: [3]}
      require:
        - {field: /serviceArguments/mode, operator: in, values: [4], missing: 0}
        - {field: /serviceArguments/pd_disagg_mode, operator: in, values: [false], missing: false}
      enforcement: server-static
      message: Exact mode 3 requires fullproxy and prohibits P/D orchestration.
      evidence: pkg/loxinet/rules.go:AddLbRule
    - id: LB-CONTENT-SELECTOR-FULLPROXY
      kind: requires
      when: {field: /serviceArguments/sel, operator: in, values: [5, 8, 9, 10]}
      require:
        - {field: /serviceArguments/mode, operator: in, values: [4], missing: 0}
      enforcement: server-static
      message: These request-content selectors require the fullproxy data path.
      evidence: pkg/loxinet/rules.go:AddLbRule
    - id: LB-SGLANG-RANKS
      kind: requires
      when: {field: /serviceArguments/kvDpRankCount, operator: greater-than, value: 1}
      require:
        - {field: /serviceArguments/kvEngineType, operator: in, values: [sglang], missing: vllm}
      enforcement: server-static
      message: Event rank fan-out above one is SGLang-only.
      evidence: pkg/loxinet/rules.go:kvEngineConfigValidate
    - id: LB-SGLANG-BOOTSTRAP
      kind: requires
      when: {field: /serviceArguments/pdBootstrapPort, operator: greater-than, value: 0}
      require:
        - {field: /serviceArguments/kvEngineType, operator: in, values: [sglang], missing: vllm}
        - {field: /serviceArguments/pd_disagg_mode, operator: in, values: [true], missing: false}
      enforcement: server-static
      message: A nonzero bootstrap port requires SGLang P/D.
      evidence: pkg/loxinet/rules.go:pdBootstrapPortValidate
    - id: LB-EXACT-MODEL-NAME
      kind: requires
      when: {field: /serviceArguments/kvExactMode, operator: in, values: [1, 3]}
      require:
        - {field: /serviceArguments/model_name, operator: nonempty-string}
      enforcement: server-static
      message: Exact routing requires a model name and separately validated tokenizer readiness.
      evidence: pkg/loxinet/rules.go:kvExactRuntimeValidate
    - id: LB-PROFILE-REQUIRES-EXACT
      kind: requires
      when: {field: /serviceArguments/kvModelProfile, operator: nonempty-string}
      require:
        - {field: /serviceArguments/kvExactMode, operator: in, values: [1, 3], missing: 0}
      enforcement: server-static
      message: A model profile cannot be bound when exact routing is disabled.
      evidence: pkg/loxinet/rules.go:kvExactRuntimeValidate
    - id: LB-API-SURFACE-REQUIRES-EXACT
      kind: requires
      when: {field: /serviceArguments/kvExactApiMode, operator: nonempty-string}
      require:
        - {field: /serviceArguments/kvExactMode, operator: in, values: [1, 3], missing: 0}
      enforcement: server-static
      message: An exact API-surface declaration requires exact routing.
      evidence: pkg/loxinet/rules.go:kvExactRuntimeValidate
    - id: LB-RANK-PORT-RANGE
      kind: sum-bound
      when: {field: /serviceArguments/kvExactMode, operator: in, values: [1, 3]}
      terms:
        - {field: /serviceArguments/kvZmqPort, missing: 5557, zero: 5557}
        - {field: /serviceArguments/kvDpRankCount, missing: 1, zero: 1}
      offset: -1
      maximum: 65535
      enforcement: server-static
      message: The highest effective rank port must fit in 1..65535.
      evidence: pkg/loxinet/rules.go:kvSubscriberRankPorts
    - id: LB-ENDPOINT-HASH-KEY-BYTES
      kind: conditional-join-byte-bound
      fields:
        host: /serviceArguments/host
        path: /serviceArguments/path_prefix
        model: /serviceArguments/model_name
      encodings:
        - {when: path-and-model, format: 'host|path|model'}
        - {when: path-only, format: 'host|path'}
        - {when: model-only, format: 'host||model'}
        - {when: neither, format: 'host'}
      maximum: 511
      unit: utf8-bytes
      enforcement: server-static
      message: The encoded endpoint routing key, including separators, must fit in 511 UTF-8 bytes.
      evidence: pkg/loxinet/rules.go:validateLBFixedCStringFields
paths:
  '/config/import':
    post:
      summary: Import configurations
      consumes:
        - multipart/form-data
      parameters:
        - in: formData
          name: configuration
          type: file
          description: Required by the handler. Deprecated import immediately attempts a committed replacement; there is no dry-run. Legacy JSON shape validation is incomplete, so empty or unrecognized documents can become empty domains and risk deleting configuration. Prefer POST /config/restore with dry-run first.
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/OperationResult'
        '401':
          $ref: '#/responses/ManagementUnauthorized'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '503':
          $ref: '#/responses/ManagementStoreUnavailable'
  '/config/export':
    get:
      summary: Export all configurations
      description: Deprecated compatibility wrapper for GET /config/snapshot. Downloads a versioned, checksummed snapshot of supported domains, not all runtime state or external secrets. The response carries deprecation and snapshot identity headers.
      parameters:
        - name: components
          in: query
          description: Comma-separated snapshot domains. Omitted or empty selection captures all supported domains. The legacy cluster token is ignored; cluster-only selection consequently widens to all snapshot domains and should not be used.
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: Configuration JSON file download
          schema:
            type: file
        '400':
          description: Invalid parameters
          schema:
            $ref: '#/definitions/Error' 
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error' 
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error' 
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'

  '/config/snapshot':
    get:
      summary: Download a complete instance snapshot
      description: Returns a versioned, checksummed snapshot document using schema 1.5. Supported snapshot domains exclude some runtime-only state and externally stored secrets. Replaces deprecated /config/export. Response carries Content-Disposition and X-Snapshot-Checksum headers.
      parameters:
        - name: components
          in: query
          description: Comma-separated domains (endpoint, loadbalancer, kvexactbinding, l7policy, firewall, policy, mirror, session, sessionulcl, ipfilter, securityrate, bfd, bgp, ipsec, cors, tracing, cert). Omitted or empty selection captures all supported domains. Inspect included_domains and excluded_domains for actual coverage; certificate material and OTLP header values remain external.
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: Snapshot document download
          schema:
            type: file
          headers:
            Content-Disposition:
              type: string
            X-Snapshot-Checksum:
              type: string
        '400':
          description: Invalid parameters
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '409':
          description: Another snapshot or restore operation is in progress
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/restore':
    post:
      summary: Restore an instance snapshot
      description: Defaults to dry-run, which checks structure, checksum, schema compatibility, coverage and required dependencies and reports a replacement plan without applying it. Dry-run does not execute every domain's apply-time validation or guarantee commit success. Explicit commit replaces selected domains, verifies the result and attempts rollback on failure. Application and write-through persistence are separate outcomes; inspect result, errors and persisted, not HTTP status alone. Replaces deprecated /config/import.
      parameters:
        - name: mode
          in: query
          description: dry-run (default) performs pre-apply checks and planning without applying configuration. commit replaces selected domains and attempts rollback if apply or verification fails; rollback itself can fail. A successful commit can return persisted=false when write-through fails without undoing the applied state.
          type: string
          enum: [dry-run, commit]
          default: dry-run
        - name: components
          in: query
          description: Comma-separated snapshot domains to replace, not merge. Omitted or empty selection uses included_domains. Uncovered domains are refused. Required dependencies are checked across the document manifest before component selection.
          type: string
        - name: snapshot
          in: body
          required: true
          description: The snapshot document, as produced by GET /config/snapshot.
          schema:
            type: object
      produces:
        - application/json
      responses:
        '200':
          description: Restore result (both modes; inspect result and errors fields)
          schema:
            $ref: '#/definitions/RestoreResult'
        '400':
          description: Malformed or incompatible snapshot document
          schema:
            $ref: '#/definitions/RestoreResult'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '409':
          description: Another snapshot or restore operation is in progress
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Restore failed (rolled-back or ROLLBACK-FAILED; see result field)
          schema:
            $ref: '#/definitions/RestoreResult'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/persist':
    post:
      summary: Persist the running configuration to disk
      description: Atomically writes supported snapshot configuration to {config-path}/snapshot.json with mode 0600. Inspect included_domains, excluded_domains, external_dependencies, checksum and generation for coverage and identity. Runtime-only settings and external secrets are not made durable by this operation. Committed restore attempts write-through separately; eligible successful mutations schedule debounced persistence when auto-persist is enabled rather than synchronously saving every mutation.
      produces:
        - application/json
      responses:
        '200':
          description: Configuration persisted
          schema:
            $ref: '#/definitions/PersistResult'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '409':
          description: Another snapshot or restore operation is in progress
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'

  '/meta':
    get:
      summary: "Get metadata for all POST APIs"
      description: "Returns simplified input metadata from embedded main and supplemental Swagger. One operation is selected per path, preferring POST, then PUT, then PATCH; main-document entries win overlaps. Ranges, defaults, patterns, authentication, cross-field rules and vendor extensions, including root relationship metadata, are not passed through. This is advisory field metadata, not a complete UI validator. Extraction errors are currently logged without changing the handler's 200 response."
      # Overrides global security: this returns the shape of the published API
      # derived from the embedded specifications, which is documentation, not
      # runtime state. The handler takes no principal.
      security: []
      operationId: "getMeta"
      tags:
        - "Metadata"
      produces:
        - "application/json"
      responses:
        "200":
          description: "Successfully retrieved metadata"
          schema:
            type: object
            additionalProperties: true
        "500":
          description: "Internal Server Error"
#----------------------------------------------
# User Management
#----------------------------------------------
  '/auth/login':
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token if the credentials
        are valid.
      parameters:
      - description: User credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/User'
      produces:
      - application/json
      security: [] # Overrides global security, no authorization required
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: User login
      tags:
      - auth
  '/auth/logout':
    post:
      consumes:
      - application/json
      description: Invalidates the user's token and logs them out.
      security:
        - BearerAuth: []
      produces:
      - application/json
      responses:
        '401':
          $ref: '#/responses/ManagementUnauthorized'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '503':
          $ref: '#/responses/ManagementStoreUnavailable'
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: User logout
      tags:
      - auth
  '/auth/users':
    get:
      description: Retrieves all users from the database and returns them as a JSON
        response.
      produces:
      - application/json
      responses:
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Authenticated principal is not authorized to list users
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Management credential store unavailable
          schema:
            $ref: '#/definitions/Error'
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/UserSummary'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Fetch all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: |-
        Creates a new user in the system.

        Requires an authenticated administrator, with one exception: while no
        user exists at all, a request from a loopback peer may create the first
        one, so that the management API can be brought up before any credential
        exists. That bootstrap closes as soon as the first account is created.

        The authentication is performed by the handler rather than by the
        generated security chain, because the chain cannot express a condition
        that depends on the state of the user table. The security block below is
        empty for that reason and does not mean the operation is open.
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/User'
      produces:
      - application/json
      security: [] # Authentication is enforced in the handler; see description
      responses:
        '503':
          description: Management credential store unavailable
          schema:
            $ref: '#/definitions/Error'
        "200":
          description: OK
          schema:
            $ref: '#/definitions/OperationResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized - not an administrator, and the bootstrap
            conditions (loopback peer, no user yet) are not met
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden - authenticated, but the role carries no
            authority to create users
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Create a new user
      tags:
      - users
  '/auth/users/{id}':
    delete:
      consumes:
      - application/json
      description: Deletes a user by its ID
      security:
        - BearerAuth: []
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        '401':
          $ref: '#/responses/ManagementUnauthorized'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '503':
          $ref: '#/responses/ManagementStoreUnavailable'
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Delete user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates an existing user with the provided JSON payload
      security:
        - BearerAuth: []
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/User'
      produces:
      - application/json
      responses:
        '401':
          $ref: '#/responses/ManagementUnauthorized'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '503':
          $ref: '#/responses/ManagementStoreUnavailable'
        "200":
          description: OK
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Update user
      tags:
      - users
  '/auth/token/upgrade':
    post:
      consumes:
      - application/json
      description: Using manual token, It need to upgrade the token.
      parameters:
      - description: license as a token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/UpdateLicenseRequest'
      produces:
      - application/json
      responses:
        '403':
          $ref: '#/responses/ManagementForbidden'
        '503':
          $ref: '#/responses/ManagementStoreUnavailable'
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UpdateLicenseRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Upgrade token
      tags:
      - auth
#----------------------------------------------
# Load Balancer
#----------------------------------------------
  '/config/loadbalancer':
    post:
      summary: Create a new Load balancer service
      description: Create a new load balancer service with .
      parameters:
        - name: attr
          in: body
          required: true
          description: Attributes for load balance service
          schema:
            $ref: '#/definitions/LoadbalanceEntry'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/PostSuccess'
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Capacity insufficient
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Resource Conflict. VLAN already exists OR dependency VRF/VNET not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/loadbalancer/all':
    get:
      summary: Get all of the load balancer services
      description: Get all of the load balancer services with conntrack infomation.
      parameters:
        - name: projectId
          in: query
          required: false
          type: string
          description: >-
            Octavia tenant/project identifier filter. When supplied, only
            load-balancer services whose serviceArguments.projectId matches are returned.
            This is a CONVENIENCE filter, NOT a tenant-isolation/authz boundary:
            an unfiltered GET still returns rules with any projectId.
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              lbAttr:
                type: array
                items:
                  $ref: '#/definitions/LoadbalanceEntry'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          $ref: '#/responses/ManagementForbidden'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
    delete:
      summary: Delete all Load balancer services
      description: Delete all load balancer services.
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/OperationResult'
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Capacity insufficient
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Resource Conflict. VLAN already exists OR dependency VRF/VNET not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
          schema:
            $ref: '#/definitions/Error'
  '/config/loadbalancer/name/{lb_name}':
    delete:
      summary: Delete an existing Load balancer service
      description: Delete an existing load balancer service with name.
      parameters:
        - name: lb_name
          in: path
          type: string
          required: true
          description: Attributes for load balance service name
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/OperationResult'
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Capacity insufficient
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '409':
