apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3
  namespace: llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-qwen3
  template:
    metadata:
      labels:
        app: vllm-qwen3
    spec:
      containers:
        - name: server
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "/mock/mock_vllm.py", "--role", "normal", "--port", "8000"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: mock
              mountPath: /mock
      volumes:
        - name: mock
          configMap:
            name: mock-vllm-py
