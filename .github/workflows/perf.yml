name: perf-CI
on:
 schedule:
 # Runs "At 13:00 UTC every day-of-week"
 - cron: '0 14 * * *'
 workflow_dispatch:
    inputs:
      testName:
        description: 'Test Run-Name'     
        required: true
        default: 'perf-single-node'
      threads:
        description: 'No. of threads for iperf & netperf'     
        required: true
        default: '50'
      duration:
        description: 'Test Run duration'     
        required: true
        default: '10'
jobs:
  build:
    name: perf-single-node
    if: github.repository == 'loxilb-io/loxilb-inference-gateway'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    # Force the u22 :latest image on hosted ubuntu-24.04 (6.x-azure)
    # runners: the latest-u24 eBPF datapath trips the kernel BPF verifier
    # E2BIG limit and loxilb aborts. common.sh honors LOXILB_DOCKER_IMAGE.
    # The u22 leg already defaults to :latest, so this override is a no-op there.
    env:
      LOXILB_DOCKER_IMAGE: latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
      - uses: actions/setup-go@v5
        with:
             go-version: '>=1.18.0'
      - run: sudo apt-get update
      - run: sudo apt-get -y install lksctp-tools linux-tools-$(uname -r) bridge-utils iperf iproute2 nodejs socat iperf3
      - run: |
         cd cicd/tcpsctpperf
         ./config.sh
         ./validation.sh ${{ github.event.inputs.threads }}  ${{ github.event.inputs.duration }}
         ./rmconfig.sh
         cd -
