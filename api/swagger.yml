  '/config/loadbalancer/hosturl/{hosturl}/externalipaddress/{ip_address}/port/{port}/protocol/{proto}':
    delete:
      summary: Delete an existing Load balancer service
      description: >-
        Delete an existing load balancer service by its full rule key. The key is the VIP, port,
        protocol and host URL, plus `path_prefix`, `path_match_mode` and `model_name` when the rule
        was created with them; a delete that omits a key component the rule carries does not match
        it and returns 404 (no-rule error).
      parameters:
        - name: hosturl
          in: path
          type: string
          required: true
          description: Attributes for load balance service
        - name: ip_address
          in: path
          type: string
          required: true
          description: Attributes for load balance service
        - name: port
          in: path
          type: number
          required: true
          description: Attributes for load balance service
        - name: proto
          in: path
          type: string
          required: true
          description: Attributes for load balance service
        - name: bgp
          in: query
          type: boolean
          description: option for BGP enable
        - name: block
          in: query
          type: number
          required: false
          description: block value if any
        - name: path_prefix
          in: query
          type: string
          required: false
          description: URL path prefix to match for deletion (allows selective deletion of path-based rules)
        - name: path_match_mode
          in: query
          type: string
          required: false
          description: Path matching mode (disabled, prefix, exact) for selective deletion
        - name: model_name
          in: query
          type: string
          required: false
          description: >-
            Model name carried by the rule (the `model_name` given at creation). It is part of the
            rule key, so a rule that names a model can only be deleted by naming the same model here.
            Omitting it matches only a rule with no model name: with two rules on one VIP:port, one
            naming a model and one not, a delete without `model_name` removes the model-less rule and
            leaves the other serving.
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/OperationResult'
        '400':
          description: Malformed arguments for API call
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Invalid authentication credentials
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Capacity insufficient
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Resource not found
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Resource Conflict. VLAN already exists OR dependency VRF/VNET not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal service error
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Maintenance mode
