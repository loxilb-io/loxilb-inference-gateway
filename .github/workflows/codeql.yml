name: CodeQL

# Static analysis of the Go code paths. Advisory at launch (not a required
# status check); findings land in the repository's Security tab.
# Manual build mode: the tree needs the eBPF submodule's cgo build, which
# CodeQL's autobuild cannot drive.

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze go
    # Dependabot PRs don't receive repo secrets, so CI_SUBMODULE_TOKEN is empty
    # and the private loxilb-ebpf submodule can't be cloned. Skip rather than
    # fail red; the scheduled run still provides full CodeQL coverage.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev gcc-multilib libpcap-dev \
            libbsd-dev build-essential elfutils dwarves bison flex pkg-config \
            libjson-c-dev libnghttp2-dev
          # Pre-built libtokenizers static lib (KV router HF tokenizer backend),
          # mirroring the Dockerfile so the cgo link resolves -ltokenizers.
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          wget -q "https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-${arch}.tar.gz" -O /tmp/libtokenizers.tar.gz
          sudo tar -xzf /tmp/libtokenizers.tar.gz -C /usr/local/lib/
          sudo mkdir -p /opt/loxilb /usr/lib64
          sudo chown -R "$(id -u)" /opt/loxilb /usr/lib64

      - name: Build
        run: make

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:go'
