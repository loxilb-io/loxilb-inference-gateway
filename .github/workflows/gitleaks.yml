name: Gitleaks

# Secret scan over the full git history (all refs) using the repository's
# .gitleaks.toml allowlist. Blocking: any finding fails the workflow.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release downloader controls
        run: python3 scripts/test_fetch_release_asset.py

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-release-asset.sh gitleaks-linux-x64 "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
          ./gitleaks version

      - name: Scan full history
        run: |
          ./gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="--all" --redact --no-banner --verbose
