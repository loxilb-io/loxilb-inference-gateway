              description: opaque protocol hint for this VIP (round-trip only)

      allowedSources:
        type: array
        description: values of allowed source IP
        items:
          properties:
            prefix:
              type: string
              description: IP address for allowed source access
      # DOCA HW-offload telemetry — hand-maintained in api/models/loadbalance_entry.go
      # (json tags offload_state/hw_pkts/hw_bytes). Declared here so a `swagger generate server`
      # REPRODUCES them instead of clobbering the generated model and breaking the handler test
      # build (regen-clobber todo 2026-06-04). Additive/optional (omitempty), aggregate
      # DOCA offload state across this LB service's active flows; absent when no DOCA plugin is active.
      # NOTE: the property KEYS are snake_case (offload_state/hw_pkts/hw_bytes) ON PURPOSE — a
      # go-swagger property name becomes the json tag verbatim, so snake_case here makes the regen
      # reproduce the existing hand-maintained tags `json:"offload_state"`/`hw_pkts`/`hw_bytes` in
      # api/models/loadbalance_entry.go (the whole point of the regen-clobber fix). The camelCase
      # aliases offloadState / hwPkts / hwBytes are named in each description for cross-reference.
      offload_state:
        type: string
        x-nullable: false
        description: >-
          aggregate DOCA HW offload state for this LB service ("none", "hw"),
          derived from the dominant CT offload state across active flows. Absent when no DOCA
          plugin is active (omitempty). Generated Go field OffloadState (camelCase alias offloadState).
      hw_pkts:
        type: integer
        format: uint64
        x-nullable: false
        description: >-
          aggregate DOCA hardware packet count for this LB service (omitempty).
          Generated Go field HwPkts (camelCase alias hwPkts).
      hw_bytes:
        type: integer
        format: uint64
        x-nullable: false
        description: >-
          aggregate DOCA hardware byte count for this LB service (omitempty).
          Generated Go field HwBytes (camelCase alias hwBytes).

