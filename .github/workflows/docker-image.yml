name: Build-CI
  
on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Tag Name'     
        required: true
        default: 'latest-amd64'

jobs:

  build:
    name: build-ci
    
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
        
    - name: Build and run the latest loxilb Docker image
      if: github.event.inputs.tagName == ''
      run: |
          docker build . --tag ghcr.io/loxilb-io/loxilb-inference-gateway:latest-amd64
          docker run -u root --cap-add SYS_ADMIN  --restart unless-stopped --privileged -dit -v /dev/log:/dev/log --name loxilb ghcr.io/loxilb-io/loxilb-inference-gateway:latest-amd64
      
    - name: Build and run the loxilb Docker image with given tag
      if: github.event.inputs.tagName != ''
      run: |
          docker build . --tag ghcr.io/loxilb-io/loxilb-inference-gateway:${{ github.event.inputs.tagName }}
          docker run -u root --cap-add SYS_ADMIN  --restart unless-stopped --privileged -dit -v /dev/log:/dev/log --name loxilb ghcr.io/loxilb-io/loxilb-inference-gateway:${{ github.event.inputs.tagName }}
      
    - name: Publish the latest loxilb Docker image
      if: | 
          github.repository == 'loxilb-io/loxilb-inference-gateway' 
          &&  github.event.inputs.tagName == ''
      run: docker push ghcr.io/loxilb-io/loxilb-inference-gateway:latest-amd64
      
    - name: Publish the loxilb Docker image with given tag
      if: |
          github.repository == 'loxilb-io/loxilb-inference-gateway'
          &&  github.event.inputs.tagName != ''
      run: docker push ghcr.io/loxilb-io/loxilb-inference-gateway:${{ github.event.inputs.tagName }} 
      
    # DISABLED. Unlike the two publish steps above, this step carried no
    # repository guard and no tag filter, so every dispatch of this workflow
    # deleted the three oldest versions of the container package — which, once
    # releases exist, are published release images. Anyone pinning an older
    # tag would get a 404, with nothing in the release history to explain it.
    # Re-enable only with a filter that can never match a release tag.
