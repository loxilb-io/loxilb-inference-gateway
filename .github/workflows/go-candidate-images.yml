name: Candidate Go image binaries

on:
  workflow_call:
    inputs:
      bgp-recovery:
        type: boolean
        default: false
        description: Export the u22 candidate to the privileged BGP recovery job
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    # Private submodule credentials are available only on trusted repository refs.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.bgp-recovery && '[{"variant":"u22","dockerfile":"Dockerfile"}]' || '[{"variant":"u22","dockerfile":"Dockerfile"},{"variant":"u24","dockerfile":"Dockerfile.u24"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - name: Read and check centralized pins
        id: pins
        run: |
          python3 scripts/update-go-pins.py --check
          echo "go=$(python3 scripts/update-go-pins.py --print-go-version)" >> "$GITHUB_OUTPUT"
          echo "govulncheck=$(python3 scripts/update-go-pins.py --print-govulncheck-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}
      - name: Install binary scanner
        env:
          GOVULNCHECK_VERSION: ${{ steps.pins.outputs.govulncheck }}
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - uses: ./.github/actions/install-trivy
      - name: Build the actual candidate Dockerfile
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p security-results
          revision=$(git rev-parse HEAD)
          docker build --secret id=github_token,env=GH_TOKEN \
            --metadata-file "security-results/${VARIANT}-build.json" \
            --build-arg "VERSION=ci-${revision:0:12}" --build-arg OPENSSL_BUILD_CPUS=2 \
            --label "org.opencontainers.image.revision=$revision" \
            -f "$DOCKERFILE" -t "loxilb-candidate:${VARIANT}" .
      - name: Export the candidate for privileged BGP validation
        if: ${{ inputs.bgp-recovery && matrix.variant == 'u22' }}
        run: |
          mkdir -p "$RUNNER_TEMP/bgp-candidate"
          docker image inspect loxilb-candidate:u22 --format '{{.Id}}' > "$RUNNER_TEMP/bgp-candidate/image-id"
          git rev-parse HEAD > "$RUNNER_TEMP/bgp-candidate/source-revision"
          docker save loxilb-candidate:u22 | gzip -1 > "$RUNNER_TEMP/bgp-candidate/image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.bgp-recovery && matrix.variant == 'u22' }}
        with:
          name: bgp-recovery-candidate-u22
          path: ${{ runner.temp }}/bgp-candidate/
          compression-level: 0
          retention-days: 1
      - name: Inspect and scan all actual candidate Go binaries
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 scripts/scan-go-image-binaries.py --image "loxilb-candidate:${VARIANT}" \
            --output "security-results/${VARIANT}-binaries"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-go-${{ matrix.variant }}
          path: security-results/
          if-no-files-found: warn

  fixtures:
    if: ${{ !inputs.bgp-recovery && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read and check centralized pins
        id: pins
        run: |
          python3 scripts/update-go-pins.py --check
          echo "go=$(python3 scripts/update-go-pins.py --print-go-version)" >> "$GITHUB_OUTPUT"
          echo "govulncheck=$(python3 scripts/update-go-pins.py --print-govulncheck-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}
      - name: Verify generated inputs and scanner policies
        run: |
          python3 scripts/update-go-pins.py --check --verify-vendor
          python3 -m unittest discover -s scripts -p 'test_update_go_pins.py'
          python3 -m unittest discover -s scripts -p 'test_scan_go_image_binaries.py'
          python3 -m unittest discover -s .github/scripts -p 'test_govulncheck_gate.py'
      - name: Install binary scanner
        env:
          GOVULNCHECK_VERSION: ${{ steps.pins.outputs.govulncheck }}
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - uses: ./.github/actions/install-trivy
      - name: Build and scan every affected fixture image
        run: |
          mkdir -p security-results
          docker build --network none -t loxilb-candidate:reflect-echo cicd/common/reflect-echo
          python3 scripts/scan-go-image-binaries.py --profile reflect-echo \
            --image loxilb-candidate:reflect-echo --output security-results/reflect-echo
          for role in client server http-client http-server; do
            case "$role" in client|server) profile="grpc-$role" ;; *) profile="$role" ;; esac
            docker build -f "cicd/common/grpc/Dockerfile.$role" \
              -t "loxilb-candidate:$profile" cicd/common/grpc
            python3 scripts/scan-go-image-binaries.py --profile "$profile" \
              --image "loxilb-candidate:$profile" --output "security-results/$profile"
          done
      - name: Build and scan shared-vendor consumers from the managed inventory
        run: |
          python3 scripts/update-go-pins.py --list-shared-vendor-builds > security-results/shared-vendor-builds.tsv
          while IFS=$'\t' read -r profile recipe; do
            docker build --network none -f "$recipe" -t "loxilb-candidate:$profile" .
            python3 scripts/scan-go-image-binaries.py --profile "$profile" \
              --image "loxilb-candidate:$profile" --output "security-results/$profile"
          done < security-results/shared-vendor-builds.tsv
      - name: Build and scan the legacy GoBGP recipe's Go payload
        run: |
          legacy_src=$(mktemp -d)
          legacy_tag=$(python3 -c 'import json; print(json.load(open("build/go-dependencies.json"))["gobgp"]["legacy"])')
          grpc_pin=$(python3 -c 'import json; print(json.load(open("build/go-dependencies.json"))["grpc"])')
          net_pin=$(python3 -c 'import json; print(json.load(open("build/go-dependencies.json"))["x_net"])')
          git clone --depth 1 --branch "$legacy_tag" https://github.com/osrg/gobgp.git "$legacy_src"
          git -C "$legacy_src" rev-parse HEAD > security-results/legacy-gobgp-revision.txt
          (
            cd "$legacy_src"
            go get "google.golang.org/grpc@$grpc_pin" "golang.org/x/net@$net_pin"
            go mod tidy
            mkdir image
            CGO_ENABLED=0 go build -o image/gobgp ./cmd/gobgp
            CGO_ENABLED=0 go build -o image/gobgpd ./cmd/gobgpd
          )
          printf 'FROM scratch\nCOPY gobgp gobgpd /usr/sbin/\n' > "$legacy_src/image/Dockerfile"
          docker build -t loxilb-candidate:gobgp-legacy "$legacy_src/image"
          python3 scripts/scan-go-image-binaries.py --profile gobgp-legacy \
            --image loxilb-candidate:gobgp-legacy --output security-results/gobgp-legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-go-fixtures
          path: security-results/
          if-no-files-found: warn

  # Match basic-sanity-ubuntu-24: the u22 datapath avoids the known u24
  # image verifier E2BIG on hosted 6.x-azure kernels. Use our own PR build.
  bgp-recovery:
    needs: gateway
    if: ${{ inputs.bgp-recovery && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Start job runtime clock
        run: date +%s > "$RUNNER_TEMP/bgp-recovery-job-start"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: bgp-recovery-candidate-u22
          path: ${{ runner.temp }}/bgp-candidate
      - name: Load and verify this revision's candidate
        run: |
          test "$(cat "$RUNNER_TEMP/bgp-candidate/source-revision")" = "$(git rev-parse HEAD)"
          gzip -dc "$RUNNER_TEMP/bgp-candidate/image.tar.gz" | docker load
          test "$(docker image inspect loxilb-candidate:u22 --format '{{.Id}}')" = "$(cat "$RUNNER_TEMP/bgp-candidate/image-id")"
          test "$(docker image inspect loxilb-candidate:u22 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$(git rev-parse HEAD)"
      - name: Verify API, HA, YAML adoption and YAML-only upgrade recovery
        run: |
          mkdir -p "$RUNNER_TEMP/bgp-recovery"
          started=$SECONDS
          trap 'printf "%s\n" "$((SECONDS-started))" > "$RUNNER_TEMP/bgp-recovery/profile-runtime-seconds.txt"' EXIT
          for profile in default role static yaml-only; do
            flags=()
            case "$profile" in
              role) flags+=(--role-managed) ;;
              static) flags+=(--static-baseline) ;;
              yaml-only) flags+=(--yaml-preservation) ;;
            esac
            python3 cicd/bgp-recovery/validate.py --image loxilb-candidate:u22 \
              --output "$RUNNER_TEMP/bgp-recovery/$profile" "${flags[@]}"
          done
      - name: Record runtime
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/bgp-recovery"
          if test -f "$RUNNER_TEMP/bgp-recovery-job-start"; then
            elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/bgp-recovery-job-start") ))
            printf '%s\n' "$elapsed" > "$RUNNER_TEMP/bgp-recovery/job-runtime-seconds.txt"
            printf 'BGP recovery job elapsed through validation: %ss\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep BGP evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-recovery-evidence
          path: |
            ${{ runner.temp }}/bgp-recovery/
            !${{ runner.temp }}/bgp-recovery/**/config/**
          if-no-files-found: warn
