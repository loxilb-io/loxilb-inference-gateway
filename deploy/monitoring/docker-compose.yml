# LoxiLB Inference Gateway monitoring stack (Prometheus + Grafana).
# Design: docs/MONITORING-DESIGN.md — quick start: ./README.md
#
# host networking: Prometheus must reach the loxilb container on its docker
# bridge IP; inter-bridge container traffic is blocked by docker's isolation
# chains, so both services run on the host network (ports 9090 / 3000).
services:
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: loxilb-prometheus
    network_mode: host
    restart: unless-stopped
    # root: allows reading the 0600 client TLS key without chowning it to the
    # image's nobody uid; see README "Security notes".
    user: "0"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./certs/rootCA.crt:/etc/prometheus/certs/rootCA.crt:ro
      - ./certs/client.crt:/etc/prometheus/certs/client.crt:ro
      - ./certs/client.key:/etc/prometheus/certs/client.key:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090

  grafana:
    image: grafana/grafana:11.6.0
    container_name: loxilb-grafana
    network_mode: host
    restart: unless-stopped
    env_file: .env            # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
