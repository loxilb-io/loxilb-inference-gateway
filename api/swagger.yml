          Structured secondary VIPs (Octavia additional_vips). Additive
          ALONGSIDE the flat secondaryIPs (kept unchanged). Stored and round-tripped for all
          protocols; only SCTP consumes them at the dataplane. All fields opaque.
        items:
          properties:
            address:
              type: string
              description: secondary VIP address
            subnetId:
              type: string
              description: opaque Octavia subnet identifier for this VIP (round-trip only)
            portId:
              type: string
              description: opaque Octavia port identifier for this VIP (round-trip only)
            proto:
