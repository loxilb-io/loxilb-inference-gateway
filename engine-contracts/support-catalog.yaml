# engine-contracts/support-catalog.yaml — approval-owned support status.
#
# Human-approved support state for EXACT identity tuples. This file is the
# ONLY place a support claim may live; contracts.yaml declares what is
# implementable, observed-releases.json records what the watcher saw, and
# neither implies support (DEC-001).
#
# Promotion states: observed | candidate | validated | blocked | deprecated.
# Evidence gates per capability: pass | fail | not_run | n_a. A gate that
# was not run is NOT a pass; promotion to "validated" requires an exact
# identity tuple (revision + image digests), an immutable evidence bundle,
# real-engine evidence, and two-stage human approval (DEC-009, DEC-012).
#
# Every entry below is seeded at "candidate" with conservative gates: a
# gate is "pass" only where reproducible evidence exists in this
# repository today. Prior live campaigns predate the evidence-bundle
# format and are deliberately NOT counted (they re-run under the
# promotion pipeline).

