          schema:
            $ref: '#/definitions/Error'

  '/log-archives/{filename}':
    get:
      summary: Download a specific log archive
      description: Download a log archive file by its name.
      # The handler streams the raw file; without this override the operation
      # inherits the global produces [application/json] and go-swagger's
      # negotiator returns 406 for Accept: application/octet-stream.
      # NOTE: takes effect in generated code on the next build_api.sh run.
      produces:
        - application/octet-stream
      parameters:
        - name: filename
          in: path
          required: true
          type: string
          description: Name of the log archive file to download.
      responses:
        '200':
          description: Log archive file download
          schema:
            type: file
        '400':
          description: Missing or invalid filename
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: File not found
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/Error'

