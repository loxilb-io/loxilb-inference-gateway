        description: Action on sequence number overflow
      mtu:
        type: integer
        format: uint16
        description: Maximum transmission unit for IPsec packets
      supportedAlgorithms:
        type: array
        items:
          type: string
        description: List of supported crypto algorithms
      hwCapabilities:
        type: object
        properties:
          qatAvailable:
            type: boolean
