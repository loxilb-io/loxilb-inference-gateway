name: MCP-Sanity-CI

# Validates the MCP (Model Context Protocol) gateway path: session-sticky
# proxying (mcp-session-id), TLS termination and end-to-end HTTPS, plus the
# no-LB direct client<->server smokes that isolate backend problems.
# The explicit 2026-07-28 mode also checks request validation and H2-to-H1 relay.
# All backend images (mcp-server, mcp-server-https, mcp-client) are built
# from the local context cicd/common/mcp — no published images required.

on:
  push:
    branches:
      - main
    paths:
      - 'cicd/mcp-**'
      - 'cicd/common/mcp/**'
      - 'common/**'
      - 'loxilb-ebpf'
      - 'pkg/**'
      - 'api/**'
      - '.github/workflows/mcp-sanity.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cicd/mcp-**'
      - 'cicd/common/mcp/**'
      - 'common/**'
      - 'loxilb-ebpf'
      - 'pkg/**'
      - 'api/**'
      - '.github/workflows/mcp-sanity.yml'
  workflow_dispatch:

jobs:
  mcp-sanity:
    name: mcp-sanity
    runs-on: ubuntu-22.04
    # Dependabot PRs have no submodule token; the private eBPF checkout fails.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
      - name: Install real HTTP/2 multiplex client
        run: python3 -m pip install h2==4.3.0 mcp==2.3.0
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.18.0'
      - run: sudo apt-get update
      - run: sudo apt-get -y install clang llvm libelf-dev gcc-multilib libpcap-dev linux-tools-$(uname -r) elfutils dwarves git libbsd-dev bridge-utils unzip build-essential bison flex iperf iproute2 nodejs socat ethtool libjson-c-dev libnghttp2-dev
      - name: Install libtokenizers (KV-router HF backend)
        run: arch=$(dpkg --print-architecture) && bash scripts/fetch-release-asset.sh tokenizers-linux-"${arch}" /tmp/libtokenizers.tar.gz && sudo tar -xzf /tmp/libtokenizers.tar.gz -C /usr/local/lib/ && rm /tmp/libtokenizers.tar.gz
      - run: loxilb-ebpf/utils/mkllb_bpffs.sh
      - run: sudo -E env "PATH=$PATH" make
      - name: Generated MCP model and embedded contract are reproducible
        run: |
          bash api/check-mcp-generation.sh
          sudo -E env "PATH=$PATH" go run ./api/cmd/sync-swagger -check
      - name: Modern MCP validator and framing regressions (sanitizers)
        run: make -C loxilb-ebpf/common test_mcp
      - name: Modern MCP API, rules, snapshot and metrics regressions
        run: sudo -E env "PATH=$PATH" go test -count=1 ./common ./api/models ./pkg/snapshot ./api/restapi/handler ./pkg/loxinet ./api/prometheus
      - name: Modern MCP fixture wire regressions
        run: python3 -B -m unittest discover -s cicd/mcp-stateless -v
      - run: sudo -E env "PATH=$PATH" GOBIN=/usr/local/bin go install github.com/jsha/minica@latest
      # Gateway image: pull the published one, or build locally when not yet published
      # Authenticate to GHCR so the private image pull below succeeds; without
      # this the pull is 'unauthorized' and CI falls back to a fragile full
      # from-source docker build.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - run: docker pull ghcr.io/loxilb-io/loxilb-inference-gateway:latest || docker build -t ghcr.io/loxilb-io/loxilb-inference-gateway:latest .
      # MCP backend images from the local build context
      - run: bash cicd/common/mcp/docker-build.sh
      - run: docker run -u root --cap-add SYS_ADMIN --restart unless-stopped --privileged -dit -v /dev/log:/dev/log --name loxilb ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: pwd && ls && sudo -E env "PATH=$PATH" make docker-cp
      - run: docker exec -dit loxilb mkllb_bpffs
      - run: id=`docker ps -f name=loxilb | cut -d " " -f 1 | grep -iv "CONTAINER"` && docker commit $id ghcr.io/loxilb-io/loxilb-inference-gateway:latest
      - run: docker stop loxilb && docker rm loxilb

      - name: Modern MCP isolated runtime (HTTP, TLS, HTTP/2, L7, rejection)
        run: |
          candidate_image=$(docker image inspect ghcr.io/loxilb-io/loxilb-inference-gateway:latest --format '{{.Id}}')
          python3 -B cicd/mcp-stateless/run_gateway.py --image "$candidate_image" --evidence-dir "$RUNNER_TEMP/uc8-mcp-evidence" --require-h2 --require-weighted --require-fc --require-fc-warmup --require-cb --require-sdk
      - name: Upload modern MCP runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-mcp-runtime
          # Only public test evidence: never traverse runtime config or private keys.
          path: |
            ${{ runner.temp }}/uc8-mcp-evidence/report.json
            ${{ runner.temp }}/uc8-mcp-evidence/runtime.log
            ${{ runner.temp }}/uc8-mcp-evidence/gateway.log
            ${{ runner.temp }}/uc8-mcp-evidence/sdk-client-*.log
            ${{ runner.temp }}/uc8-mcp-evidence/*.jsonl
          if-no-files-found: ignore

      - name: MCP direct connectivity (no LB — backend smoke)
        run: |
          cd cicd/mcp-direct-test/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: MCP direct connectivity over HTTPS
        run: |
          cd cicd/mcp-direct-test-https/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: MCP HTTP proxy + session stickiness
        run: |
          cd cicd/mcp-httpproxy/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: MCP TLS-terminating fullproxy
        run: |
          cd cicd/mcp-fullproxy/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - name: MCP end-to-end HTTPS
        run: |
          cd cicd/mcp-e2ehttps/
          ./config.sh
          ./validation.sh
          ./rmconfig.sh
          cd -
      - run: echo "MCP sanity complete"
